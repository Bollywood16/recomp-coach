/* Rules engine: recommend a split from the emphasis sliders. */
function recommendTemplate(focus) {
  const f = focus || DEFAULT_FOCUS;
  const rank = (g) => LEVEL_RANK[f[g] ?? "normal"];
  const emph = (g) => rank(g) >= 2;
  const legsMaintained = f.legs === "maintain";
  if (emph("shoulders") && emph("arms") && legsMaintained) {
    return { key: "superhero", why: "Shoulders + arms emphasized with legs on maintain — this is the screen-physique configuration: three upper-dominant days, one maintenance lower day." };
  }
  if (["shoulders", "arms", "chest", "back"].some(emph)) {
    return { key: "upperFocus", why: "You have an upper-body emphasis active. A 3-upper / 1-lower week raises those muscles to ~2-3x/week while one consolidated lower day holds your legs." };
  }
  return { key: "balanced", why: "No strong emphasis set — 2 upper + 2 lower trains everything twice weekly, which the frequency research favors as the default." };
}

const SB_CFG_KEY = "recompcoach:sbcfg";

/* Union logs by identity, keep newest settings by _updatedAt. */
function mergeData(local, cloud) {
  if (!cloud) return local;
  if (!local) return cloud;
  const sById = {};
  [...(cloud.sessions || []), ...(local.sessions || [])].forEach((s) => { sById[s.id] = s; });
  const sessions = Object.values(sById).sort((a, b) => a.id - b.id);
  const wByDate = {};
  [...(cloud.weights || []), ...(local.weights || [])].forEach((w) => { wByDate[w.date] = w; });
  const weights = Object.values(wByDate).sort((a, b) => (a.date < b.date ? -1 : 1));
  const localNewer = (local._updatedAt || "") >= (cloud._updatedAt || "");
  const settingsSrc = localNewer ? local : cloud;
  // injuryProfileHistory is unioned by (at, device) identity — independent of
  // which side's injuryProfile snapshot "wins" below — so a stale device's
  // overwrite is still visible after the fact instead of silently vanishing.
  const histById = {};
  [...(cloud.injuryProfileHistory || []), ...(local.injuryProfileHistory || [])]
    .forEach((h) => { histById[`${h.at}|${h.device}`] = h; });
  const injuryProfileHistory = Object.values(histById).sort((a, b) => (a.at < b.at ? -1 : 1)).slice(-50);
  return {
    ...cloud, ...local,
    sessions, weights,
    swaps: settingsSrc.swaps || {},
    nutrition: settingsSrc.nutrition || local.nutrition,
    focus: settingsSrc.focus || local.focus,
    plan: settingsSrc.plan || local.plan,
    phase: settingsSrc.phase || local.phase,
    injuryProfile: settingsSrc.injuryProfile || local.injuryProfile,
    injuryProfileHistory,
    _updatedAt: new Date().toISOString(),
  };
}

async function cloudPull(client, uid) {
  const { data, error } = await client.from("app_data").select("payload").eq("user_id", uid).maybeSingle();
  if (error) throw error;
  return data ? data.payload : null;
}
async function cloudPush(client, uid, payload) {
  const body = { user_id: uid, payload: { ...payload, _updatedAt: new Date().toISOString() }, updated_at: new Date().toISOString() };
  const { error } = await client.from("app_data").upsert(body);
  if (error) throw error;
}

/* Merge-on-push: EVERY upload first pulls the cloud copy and unions with it,
   so a wiped/evicted device can never overwrite real history. (Root cause of
   the Jul 2026 data-loss incident: a raw background push from an
   evicted-empty container.) If the pull fails while local is empty of logs,
   the push is refused rather than risked. */
async function safeCloudSync(client, uid, localData) {
  let cloud = null, pullOk = false;
  try { cloud = await cloudPull(client, uid); pullOk = true; } catch (e) { /* network */ }
  if (!pullOk && (localData.sessions || []).length === 0) {
    throw new Error("Refusing to sync an empty dataset without reading the cloud copy first.");
  }
  const merged = cloud ? mergeData(localData, cloud) : localData;
  await cloudPush(client, uid, merged);
  return merged;
}

function validateContraindicationVocabulary() {
  const known = new Set(Object.keys(INJURY_VOCABULARY));

/* Runtime backstop for Gate 2's read-only guarantee (spec correction C). There
   is no module system in this app, so "the parser cannot write injuryProfile"
   can't be enforced by imports/exports alone — InjuryProfileCard's closure
   design is the real guarantee, but this doesn't depend on that design being
   followed correctly by every future edit. Freezing the object handed to the
   parser/gate path means a future accidental mutation throws (or no-ops)
   instead of silently corrupting the record. Deep, since the nested
   injuries/movementConstraints are exactly what Gate 2 keys on in Task 4. */
function deepFreeze(obj) {
  if (obj && typeof obj === "object" && !Object.isFrozen(obj)) {
    Object.getOwnPropertyNames(obj).forEach((k) => deepFreeze(obj[k]));
    Object.freeze(obj);
  }
  return obj;
}

/* Every place that constructs a NEW injuryProfile record to persist (App's
   migration, InjuryProfileCard.save(), BackupCard's import) must base it on
   this, never on DEFAULT_INJURY_PROFILE directly. A shallow spread of a
   found/incoming profile over the frozen singleton
   (`{ ...DEFAULT_INJURY_PROFILE, ...found }`) leaves any key ABSENT from
   `found` pointing at the frozen singleton's nested object BY REFERENCE —
   movementConstraints/injuries would be `===` the module-level default, not
   an independent copy. Reading that is harmless, but it's a landmine for any
   future code that mutates in place instead of spreading. JSON round-trip is
   safe here since the record is plain data (strings/booleans/null/arrays/
   objects, no functions or Dates). Pure read-only fallbacks (data.injuryProfile
   || DEFAULT_INJURY_PROFILE, used for display or handed into deepFreeze at
   the gate boundary) are fine to keep pointing at the frozen singleton. */
function cloneInjuryProfileDefaults() {
  return JSON.parse(JSON.stringify(DEFAULT_INJURY_PROFILE));
}

/* Shared by both "load a persisted record" paths — App's boot-time
   localStorage read and BackupCard's file-import restore
   (TASK-0-BACKUP-MIGRATION-REVIEW.txt, Fix 2). Before this, only the boot
   path ran the goalProfile.injuryRecovery -> recoveringMode fail-safe, the
   one-time migration notice, and the goblet -> boxsquat session rename; the
   import path reimplemented just the injuryProfile merge and silently
   skipped all three. A restored pre-Task-0 backup with
   goalProfile.injuryRecovery === false landed on whatever injuryProfile the
   app already had in memory (accidentally correct only when that happened
   to already read recoveringMode: true) instead of running the fail-safe,
   and real logged "goblet" sessions never got renamed. One function now,
   called from both places, so they cannot drift apart again.

   `source` is the record being loaded (the parsed localStorage blob on
   boot; the parsed backup file's `data` on import). Whether a migration is
   needed at all is decided from `source` alone, deliberately never falling
   back to `existing` — restoring an old backup means loading THAT backup's
   own history, not silently inheriting whatever the current device already
   has in memory just because the file happens to be older. This is also
   what keeps the fail-safe live on import: the current device's live
   injuryProfile is always present and truthy, so folding it into the
   "has this record already been migrated" check would make the fail-safe
   permanently unreachable there.

   `existing` is the current in-memory data to fall back onto for the
   bookkeeping fields (history / notice / goblet-migration state) when
   `source` doesn't carry its own — e.g. re-importing an old backup after
   the goblet/boxsquat prompt was already resolved on this device must not
   re-trigger it. There is no such fallback on boot (nothing is loaded yet),
   so that call passes null.

   Renames goblet sessions to boxsquat IN PLACE within the one returned
   `sessions` array — there is no separate per-id bucket for weeklySeries /
   bestSet / stallScore to disagree about, so e1RM trend and stall
   detection see one continuous history under the new id, never a split
   one (verified in scripts/check-backup-import-migration.js). */
function migrateInjuryAndGobletData(source, existing) {
  const prevHistory = source.injuryProfileHistory || (existing && existing.injuryProfileHistory) || [];
  const prevMigrationNotice = source.injuryProfileMigration || (existing && existing.injuryProfileMigration) || null;
  const prevGobletMigration = source.gobletBoxSquatMigration || (existing && existing.gobletBoxSquatMigration) || null;

  // Fails safe: goalProfile.injuryRecovery was only ever written by the
  // user's own toggle in CoachCard, so a real `false` is unambiguous. But
  // absent/null/anything-else-falsy is not a confirmed user choice, and a
  // silent OFF-with-no-gating is the one failure mode where nothing
  // surfaces — so only a strict `=== false` carries forward as OFF;
  // everything else defaults ON.
  const migrating = !source.injuryProfile && !!source.goalProfile;
  let injuryProfile;
  if (source.injuryProfile) {
    injuryProfile = { ...cloneInjuryProfileDefaults(), ...source.injuryProfile };
  } else {
    const explicitlyOff = source.goalProfile && source.goalProfile.injuryRecovery === false;
    injuryProfile = { ...cloneInjuryProfileDefaults(), recoveringMode: !explicitlyOff };
  }

  // One-time, dismissible, and recorded — so a migration that silently
  // changed effective behavior is never silent to the user.
  let injuryProfileHistory = prevHistory;
  let injuryProfileMigration = prevMigrationNotice;
  if (migrating && !injuryProfileMigration) {
    const at = new Date().toISOString();
    injuryProfileMigration = {
      at,
      message: injuryProfile.recoveringMode
        ? "Injury gating has been turned on. Adjust in the Log tab."
        : "Injury gating stayed off, carried over from your previous setting. Adjust in the Log tab.",
      dismissed: false,
    };
    injuryProfileHistory = [...injuryProfileHistory, { at, device: "migration", profile: injuryProfile }].slice(-50);
  }

  // goblet/box-squat split (Task 1 item 1): "goblet" used to mean the
  // combined "Goblet / Box Squat" entry. Historical sessions logged under
  // that id are ambiguous now that the two are separate exercises with
  // different risk profiles (self-limited vs an external stop) — default
  // to boxsquat but ask, once, via GobletBoxSquatMigrationPrompt, rather
  // than silently guessing for a lift with real logged history.
  let gobletBoxSquatMigration = prevGobletMigration;
  let sessions = source.sessions || (existing && existing.sessions) || [];
  const migratingGoblet = sessions.some((s) => s.exerciseId === "goblet") && !gobletBoxSquatMigration;
  if (migratingGoblet) {
    sessions = sessions.map((s) => (s.exerciseId === "goblet" ? { ...s, exerciseId: "boxsquat" } : s));
    gobletBoxSquatMigration = { at: new Date().toISOString(), resolved: false, defaultedTo: "boxsquat" };
  }

  return { injuryProfile, injuryProfileHistory, injuryProfileMigration, gobletBoxSquatMigration, sessions, migrated: migrating || migratingGoblet };
}

/* Job (b): "is specialization timing appropriate yet" — separate from Gate 2's
   movement-safety job, which recoveringMode alone covers and which never lifts.
   This is intentionally derived, not stored: it tracks metrics.weeksTraining
   directly, so there is no second field that can drift out of sync with it. */
function isSpecializationUnlocked(injuryProfile, metrics) {
  return !injuryProfile.recoveringMode || (metrics.weeksTraining || 0) >= 8;
}

/* ===== Movement attribute tagging (Task 1) =====
   Gates key on MECHANICS, not exercise names — a "Deep Goblet Squat" or an
   unfamiliar alternate must be caught the same way a known one is. Every
   exercise across all four sources (D, LIBRARY, LIBRARY_EXT, BONUS) is
   tagged here; coverage is enforced complete by exerciseTaggingGaps() below
   and surfaced in TaggingCoverageCard (Log tab).

   attributes: mechanical descriptors, intersected against
   injuryProfile.movementConstraints.forbidden by Gate 2 (Task 4).
   romProfile: only squatDepth / hingeRom / hipFlexionMax are populated —
   the two dimensions injuryProfile.movementConstraints.limited currently
   constrains. Where a movement's depth is fixed by its own name/design
   ("above_parallel", "mid_shin", etc.) that value is used directly. Where a
   movement is fundamentally NOT on that ordinal scale (isolation machines:
   leg extension, lat pulldown, lateral raise...) the relevant key is simply
   omitted — there's nothing to compare. Where a movement's depth genuinely
   isn't fixed by the exercise itself and there's no existing in-app signal
   either way (belt squat, cable pull-through), the conservative/deeper value
   is used rather than omitting the key — "deny by default" for an unknown
   depth means treating it as unbounded, not as compliant.
   contraindications: reserved for risks independent of measurable depth —
   depth risk is handled by romProfile + Gate 2's limit comparison instead of
   guessing a contraindication per squat variant. Ids used here must exist in
   INJURY_VOCABULARY (validateContraindicationVocabulary() asserts this at
   load).
   pool: reuses the existing `cat` field (same taxonomy the swap picker
   already filters on) EXCEPT "delts" is split into delts_lateral /
   delts_rear — Reverse Pec-Deck and a Lateral Raise are mechanically
   unrelated for gating even though the generator currently lumps them
   together as one muscle group.
   tagSource: how each entry's verdict was actually arrived at — 74/75
   tagged is not the same claim as 74/75 verified, and this is what lets
   TaggingCoverageCard tell the two apart instead of implying they're equal.
     - "descriptive": a mechanical fact, or a value read directly off the
       exercise's own stated name (e.g. rdl's "(mid-shin range)",
       pinsquat's "(above parallel)") — no risk-verdict inference involved.
     - "from_app_caution": the safety VERDICT (contraindicated or not, or
       "treated as compliant") was inferred from an existing INDIRECT in-app
       signal — caution/why text, a vague depth-labeled name like
       "(pain-free depth)", or "this is what the live program already
       prescribes safely today" — not a directly stated value.
     - "conservative_default": no in-app signal existed either way; the
       more-restrictive value was chosen rather than guessing safe.
     - "clinician_reviewed": unused today (clinicianReviewed is false) —
       defined for when one actually is signed off.

   goblet / boxsquat split: "Goblet / Box Squat" was originally one entry,
   tagged verbatim from this build's own spec example (romProfile-compliant
   AND still contraindicated). That conflated two movements with different
   risk profiles under one id — a goblet squat is self-limited (no external
   stop), a box squat is externally limited (the box IS a hard mechanical
   stop, the same enforcement category as pinsquat's safety pins). Split
   into two ids; only the self-limited variant keeps the contraindication.
   See the migration this required in App's load effect and
   GobletBoxSquatMigrationPrompt — existing logged sessions under the old
   combined "goblet" id are ambiguous and needed a one-time user decision,
   not a guess (this lift has +20% progress over 7 weeks with no logged
   pain — silently mis-tagging it contraindicated would have Gate 2 remove
   a movement that's been running successfully). Also corrected axial_load
   off of both while splitting: a goblet/box-squat hold is anterior
   (front-rack), not through the spine — that attribute was only ever there
   because it was copied verbatim from the spec's illustrative example, and
   splitting the entry was the right moment to fix a mechanical inaccuracy
   noticed along the way, flagged here rather than left in place.

   bbrow (Bent-Over Barbell Row) and trapdl (Trap-Bar Deadlift) are tagged
   contraindicated directly from their own existing `caution` / `why` text
   already in LIBRARY / LIBRARY_EXT — not a new judgment, just encoded.

   None of the 75 carry the forbidden attribute itself
   (loaded_deep_hip_flexion) — accurately: nothing in the current library is
   actually described as a full/ATG-depth loaded movement. That forbidden
   entry exists as a forward-looking net for future/untagged additions, not

   today isn't mistaken for the tag being unused/dead. Task 4's test suite
   carries two synthetic fixtures to exercise this path anyway — see
   TASK-1-FIXES-REVIEW.txt. */

/* Task 6, Section 5 (pre-decision 5): pain-escalation's pattern grouping
   used to be `cat` — flagged from the start (see isPainEscalating's own
   comment) as both too wide (any pain on ANY lift sharing a cat
   suppresses every other lift in it) and too narrow (a hip labral issue
   presents across BOTH the squat and hinge cats, which `cat` treats as
   two unrelated patterns, so neither alone reaches the 2-of-4 trigger —
   exactly the gap this profile was built around). `painPattern` replaces
   it: 11 mechanical-loading categories (hip_dominant, knee_dominant,
   horizontal_press, vertical_press, vertical_pull, horizontal_pull,
   elbow_flexion, elbow_extension, lateral_raise, rear_delt, core),
   DERIVED from each exercise's own already-tagged attributes/pool rather
   than hand-typed a second time — cannot drift out of sync with Task 1's
   tagging, and is itself exactly as reviewable (one small function,
   not 75 independent judgment calls to individually re-verify).

   PRIORITY RULE, in order:
   1. Any exercise carrying `loaded_hip_flexion`, `hip_hinge`, or
      `hip_extension` in its attributes -> hip_dominant, REGARDLESS of
      pool/cat. This is the actual fix: it merges squat-pool AND
      hinge-pool AND glute-pool (all hip-flexion-or-extension-loading)
      into ONE pattern, and it deliberately reaches two places a pure
      pool-copy would have missed:
        - kneeraise (pool: core) carries loaded_hip_flexion on its own
          terms (see its comment: "real (bodyweight) hip flexion,
          moderate/controlled, not end-range") -- mechanically a
          hip-flexion movement wearing a "core" muscle-group label. For
          escalation specifically (which pattern is provoking pain, not
          which muscle grows) that mechanical fact outranks the
          muscle-group tag.
        - bbrow and meadows (pool: hpull) both carry hip_hinge, and
          bbrow is already contraindicated for prox_hamstring_tendinosis
          for exactly that reason (same mechanism, same contraindication,
          as trapdl). Grouping them with the hip-hinge pattern instead of
          "horizontal_pull" means pain on trapdl and pain on bbrow now
          correctly inform the SAME escalation state, not two unrelated
          ones.
      quad-pool bss/sissy/bonus_walkinglunge (unilateral, loaded hip
      flexion) fall under this rule too -- correctly separated from
      quad-pool legext/sledpush (pure knee extension, no hip
      involvement at all), which the pool alone can't distinguish.
   2. Otherwise, by pool: delts_lateral -> lateral_raise, delts_rear ->
      rear_delt, hpress -> horizontal_press, vpress -> vertical_press,
      hpull -> horizontal_pull, vpull -> vertical_pull, biceps ->
      elbow_flexion, triceps -> elbow_extension, quad/ham/calf ->
      knee_dominant, core -> core.

   calf/seatedcalf land on knee_dominant as the nearest available lower-
   body category -- the given taxonomy has no dedicated ankle/calf
   pattern. Flagged here rather than silently absorbed so it isn't
   mistaken for a considered clinical judgment; if a real ankle/calf
   escalation pattern ever matters for this profile, it needs its own
   category, not a borrowed one.

   Coverage is asserted, not assumed: painPatternTaggingGaps() (used by
   scripts/check-pain-pattern-migration.js) lists any ALL_KNOWN exercise
   this function fails to classify — must be empty; a real gap here means
   a missing exercise is silently invisible to escalation entirely. */
const PAIN_PATTERNS = [
  "hip_dominant", "knee_dominant", "horizontal_press", "vertical_press", "vertical_pull",
  "horizontal_pull", "elbow_flexion", "elbow_extension", "lateral_raise", "rear_delt", "core",
];
const PAIN_PATTERN_NAMES = {
  hip_dominant: "hip-dominant", knee_dominant: "knee-dominant", horizontal_press: "horizontal press",
  vertical_press: "overhead press", vertical_pull: "vertical pull", horizontal_pull: "horizontal pull",
  elbow_flexion: "biceps / elbow flexion", elbow_extension: "triceps / elbow extension",
  lateral_raise: "lateral raise", rear_delt: "rear delt", core: "core",
};
const POOL_TO_PAIN_PATTERN = {
  delts_lateral: "lateral_raise", delts_rear: "rear_delt", hpress: "horizontal_press", vpress: "vertical_press",
  hpull: "horizontal_pull", vpull: "vertical_pull", biceps: "elbow_flexion", triceps: "elbow_extension",
  quad: "knee_dominant", ham: "knee_dominant", calf: "knee_dominant", core: "core",
};
const HIP_LOADING_ATTRS = ["loaded_hip_flexion", "hip_hinge", "hip_extension"];
function inferPainPattern(ex) {
  if (!ex) return null;
  if ((ex.attributes || []).some((a) => HIP_LOADING_ATTRS.includes(a))) return "hip_dominant";
  return POOL_TO_PAIN_PATTERN[ex.pool] || null;
}
ALL_KNOWN.forEach((ex) => { ex.painPattern = inferPainPattern(ex); });
function painPatternTaggingGaps() {
  return ALL_KNOWN.filter((ex) => !PAIN_PATTERNS.includes(ex.painPattern));
}

/* Task 1 item 5: machohp, cablelat, skull, ohte and ezcurl are declared in
   both D and LIBRARY. _dedupe (above) silently keeps whichever appears
   first when building ALL_KNOWN — today that's harmless because the two
   declarations are identical, but a silent pick is a landmine if they're
   ever edited independently and drift apart. Assert they match instead of
   trusting that; logs loudly rather than silently picking a winner. */
function assertDuplicateDeclarationsMatch() {
  const compareFields = ["name", "cat", "start", "inc", "perHand", "assistable"];
  const mismatches = [];
  LIBRARY.forEach((libEx) => {
    const dEx = D[libEx.id];
    if (!dEx) return;
    compareFields.forEach((f) => {
      if (JSON.stringify(dEx[f]) !== JSON.stringify(libEx[f])) {
        mismatches.push(`${libEx.id}.${f}: D has ${JSON.stringify(dEx[f])}, LIBRARY has ${JSON.stringify(libEx[f])}`);
      }
    });
    if (JSON.stringify(dEx.basedOn || null) !== JSON.stringify(libEx.basedOn || null)) {
      mismatches.push(`${libEx.id}.basedOn: D has ${JSON.stringify(dEx.basedOn)}, LIBRARY has ${JSON.stringify(libEx.basedOn)}`);
    }
  });
  if (mismatches.length) {
    console.error("D/LIBRARY duplicate declarations diverge — ALL_KNOWN silently picked one (the D/PROGRAM_EXERCISES version) without anyone deciding that was correct:", mismatches);
  }
  return mismatches;
}
assertDuplicateDeclarationsMatch();

/* An exercise counts as tagged only if every field Gate 2 (Task 4) reads is
   actually present — a partially-tagged exercise is exactly as unsafe as an
   untagged one. */
const TAG_SOURCES = ["descriptive", "from_app_caution", "conservative_default", "clinician_reviewed"];
function isExerciseTagged(ex) {
  return !!ex
    && Array.isArray(ex.attributes)
    && ex.romProfile !== undefined && ex.romProfile !== null && typeof ex.romProfile === "object"
    && Array.isArray(ex.contraindications)
    && typeof ex.pool === "string" && ex.pool.length > 0
    && TAG_SOURCES.includes(ex.tagSource);
}

/* Coverage report for the Settings view (Task 1 requirement) — every
   untagged exercise, so the library can be completed incrementally rather
   than discovering a gap only when recoveringMode silently denies it. */
function exerciseTaggingGaps() {
  return ALL_KNOWN.filter((ex) => !isExerciseTagged(ex));
}

/* 74/75 tagged is not the same claim as 74/75 verified — this is what lets
   the coverage card say which tags are guesses rather than implying every
   tagged exercise carries equal confidence. */
function conservativeDefaultExercises() {
  return ALL_KNOWN.filter((ex) => ex.tagSource === "conservative_default");
}

function emphasisMult(cat, focus) {
  const g = CAT_TO_GROUP[cat];
  if (!g || !focus || !focus[g]) return 1;
  const lvl = EMPHASIS_LEVELS.find((l) => l.key === focus[g]);
  return lvl ? lvl.mult : 1;
}
/* Scale a slot's base set count by its muscle's emphasis, clamped so it never
   disappears or balloons past a sane per-exercise cap. */
function adjustSets(baseSets, cat, focus) {
  const m = emphasisMult(cat, focus);
  return Math.max(1, Math.min((baseSets || 3) + 3, Math.round((baseSets || 3) * m)));
}
/* Which bonus exercises are active for a given day, based on Specialize focus. */
function bonusForDay(day, focus, program) {
  if (!focus || !day) return [];
  const prog = program || PROGRAMS.balanced;
  const out = [];
  const groupIdx = {};
  BONUS.forEach((b) => {
    const cur = LEVEL_RANK[focus[b.group]] ?? 1;
    if (cur < LEVEL_RANK[b.minLevel]) return;
    const gcats = MUSCLE_GROUPS[b.group].cats;
    const days = prog.filter((d) => d.exercises.some((e) => gcats.includes(e.cat)));
    if (!days.length) return;
    const i = (groupIdx[b.group] = (groupIdx[b.group] ?? -1) + 1);
    const target = days[i % days.length];
    if (target.id === day.id) {
      out.push({ ...b.ex, sets: 3, baseSets: 3, slotId: b.ex.id, swapped: false, isBonus: true, bonusGroup: b.group, focusBoost: true });
    }
  });
  return out;
}

/* ===== Time-budget engine =====
   Fits a day into the user's session length. Estimated cost per exercise =
   sets x (work + rest). */
const COMPOUND_CATS = ["squat", "hinge", "hpress", "vpress", "hpull", "vpull"];
const isCompound = (ex) => COMPOUND_CATS.includes(ex.cat);

/* Trim priority (Fix 1, TASK-0-BACKUP-MIGRATION-REVIEW.txt complaint 5):
   the build's original bug was `focusBoost` collapsing "emphasize" and
   "specialize" into the same boolean, so a compound tie-break (and, after
   that, list position) decided which focused muscle actually got cut —
   and since the day template lists delts before arms, arms (specialize)
   lost more volume than shoulders (emphasize) despite being the HIGHER
   priority. Ranking now reads the real level, ordered
   maintain(0) < normal(1) < emphasize(2) < specialize(3), and the
   compound bonus is scaled to never bridge a one-tier gap: a maintain-
   group compound (rank 0, +1 = 1) is still trimmed before a specialize-
   group isolation (rank 3, +0 = 30). List position remains the final
   tie-break only, unchanged.

   Task 6, Section 6 (pre-decision 4): sessionRules.trimPriority — an
   array like ["maintain","normal","emphasize","specialize"], first
   entry cut first — is now wired through the optional `order` param
   below, threaded from data.plan.sessionRules.trimPriority at every
   call site. Floor percentages (LEVEL_TRIM_FLOOR_PCT_BY_RANK, below)
   are keyed by RANK POSITION, not level name, specifically so a custom
   order stays internally coherent with itself: whichever level a coach
   names LAST (cut last) gets the 75% floor, second-to-last gets 65%,
   regardless of what that level is actually called. Cutting specialize
   first and still protecting "specialize" by name would fight the
   coach's own stated order; this can't, by construction. Gate 13's
   maintain-floor protection (dropTierRank, below) is NOT customizable
   this way — see its own comment for why that stays a fixed safety
   invariant, order param or not. */
const LEVEL_TRIM_FLOOR_PCT_BY_RANK = { 3: 0.75, 2: 0.65, 1: 0, 0: 0 };

function emphasisRank(ex, focus, order) {
  const g = CAT_TO_GROUP[ex.cat];
  const lvl = (focus && g && focus[g]) || "normal";
  if (order && order.includes(lvl)) return order.indexOf(lvl);
  return LEVEL_RANK[lvl] ?? 1;
}
function trimPriority(ex, focus, order) {
  return emphasisRank(ex, focus, order) * 10 + (isCompound(ex) ? 1 : 0);
}
/* Gate 13 (maintain floor, per-movement — Task 6, pre-decision 3;
   DEFERRED-TESTS.md row 9). ONLY for the "drop an entire movement"
   fallback both fitDayToTime and gate7DurationTrim fall to once
   literally every remaining exercise is already at its bare
   per-exercise floor (isCompound ? 2 : 1) — ordinary set-trimming above
   this point is UNCHANGED: maintain still yields sets first, by design
   (trimPriority/emphasisRank ascending, ties broken by list position).
   Losing an entire movement is a different kind of loss than losing a
   set, and for a rehab-relevant maintain movement (hip thrust, calf
   raise on this profile) it's worse than any higher-tier group losing
   one of ITS isolation movements instead — DEFERRED-TESTS.md's own
   words: "maintain still gets none [floor] beyond the per-exercise
   minimum — deliberately... Gate 13's job to change." This remaps
   maintain (rank 0) to LAST place (above specialize) for the
   drop-entirely sort only, so normal/emphasize/specialize all give up a
   whole movement before a maintain one is ever fully removed. Real
   behavior change to a prior signed-off (Fix 1) result — the "core's
   kneeraise survives over legs' maintain lifts" assertion in
   check-trim-priority.js flips as of this commit; see that file's own
   updated comment for the new expected numbers.

   Deliberately takes NO `order` param, unlike trimPriority/emphasisRank
   below sessionRules.trimPriority reorders which group's SETS get
   trimmed first (a preference) — this protection is a safety invariant
   (pre-decision 3: "cannot be dropped entirely"), not a preference a
   plan can dial down. Checks literal maintain-ness directly off `focus`
   rather than deriving from a rank number, so there's no custom order
   array whose omission of "maintain," or reordering, could weaken it. */
function dropTierRank(ex, focus) {
  const g = CAT_TO_GROUP[ex.cat];
  const lvl = (focus && g && focus[g]) || "normal";
  if (lvl === "maintain") return 99;
  return emphasisRank(ex, focus);
}
/* Shared by fitDayToTime's trim loop and Gate 10 (Task 6, estimatedMin
   verification) — "how long does this exercise list take" computed
   identically everywhere it's asked. gate7DurationTrim already had its
   own inline copy of this exact formula before this existed; left alone
   there deliberately (lower blast radius on its own extensively-tested
   trim behavior) rather than force a third call site to route through a
   refactor mid-build — only fitDayToTime and Gate 10 use this directly. */
function estimateDurationSec(list) {
  return list.reduce((a, ex) => a + ex.sets * (40 + restFor(ex).sec) + dropExtraSec(ex), 0);
}
/* Per-muscle-group floor for the time-budget trim: a share of that
   group's OWN pre-trim (generator-intended) volume, not a share of the
   whole day, so it scales with however much the generator already gave
   the muscle rather than a fixed number every session. A strict
   emphasis-level tier order (see trimPriority above) alone over-corrects
   the original bug into its mirror image — the higher tier keeps
   literally everything and the lower tier gets cut to its bare
   per-exercise floor (verified against real data: shoulders 12->4, arms
   11->19 on the Delts & Arms day — an inversion in the other direction).
   A floor lets both focused groups stay recognizably what their focus
   level says: specialize keeps most of its volume, emphasize keeps a
   real block, normal and maintain get no floor beyond the pre-existing
   per-exercise minimum (maintain yields first, by design — a firmer
   guarantee that a maintain-group MOVEMENT survives at all, not just
   that a remaining row doesn't hit zero sets, is Gate 13's job, not
   built yet). Computed once from the list as handed in, before this
   trim pass's own loop touches it — recomputing mid-trim would make the
   floor easier to satisfy the more a group has already been cut, which
   defeats the point. A group that later loses an entire movement (the
   full-drop fallback below) leaves its floor stale — that only makes
   the floor MORE conservative for whatever's left in the group, never
   less, so it's left alone rather than recomputed. */
function groupTrimFloors(items, focus, order) {
  const totals = {};
  items.forEach((ex) => {
    const g = CAT_TO_GROUP[ex.cat];
    if (!g) return;
    const t = totals[g] || (totals[g] = { preFit: 0, absFloor: 0, rank: emphasisRank(ex, focus, order) });
    t.preFit += ex.sets;
    t.absFloor += isCompound(ex) ? 2 : 1;
  });
  const floors = {};
  Object.keys(totals).forEach((g) => {
    const pct = LEVEL_TRIM_FLOOR_PCT_BY_RANK[totals[g].rank] ?? 0;
    floors[g] = Math.max(totals[g].absFloor, Math.round(totals[g].preFit * pct));
  });
  return floors;
}

function fitDayToTime(list, sessionMin, focus, trimPriorityOrder) {
  const budget = Math.max(20, (sessionMin || 60) - 8) * 60; // minus ~8 min warm-up
  const items = list.map((e) => ({ ...e }));
  // Point 4: a drop segment adds real (if brief) time beyond its host
  // set's own "40s work + rest" — see dropExtraSec/DROP_SEGMENT_SEC.
  // Backoff needs no separate term: its sets are already full rested
  // sets once hardSetsFor/the normalization pass in resolveDayExercises
  // have run, so ex.sets already IS the complete segment count.
  const total = () => estimateDurationSec(items);
  const minSets = (ex) => (isCompound(ex) ? 2 : 1);
  const floors = groupTrimFloors(items, focus, trimPriorityOrder);
  const groupOf = (ex) => CAT_TO_GROUP[ex.cat];
  const groupTotal = (g) => items.reduce((a, e) => a + (groupOf(e) === g ? e.sets : 0), 0);
  let trimmed = 0;
  const dropped = [];
  let guard = 200;
  while (total() > budget && guard-- > 0) {
    // Pass 1: respect each group's floor — a group at or below it is off
    // the table as long as ANY candidate elsewhere still has room.
    let cands = items.filter((e) => {
      if (e.sets <= minSets(e)) return false;
      const g = groupOf(e);
      return !g || groupTotal(g) > (floors[g] ?? 0);
    });
    // Pass 2 fallback: every group is at its floor and the day still
    // doesn't fit — Gate 13 territory (no group-floor guarantee exists
    // yet for this case). Falls back to the bare per-exercise floor
    // rather than looping without progress or leaving the day over
    // budget; trimPriority below still orders which group absorbs it.
    if (!cands.length) cands = items.filter((e) => e.sets > minSets(e));
    if (cands.length) {
      cands.sort((a, b) => trimPriority(a, focus, trimPriorityOrder) - trimPriority(b, focus, trimPriorityOrder) || items.indexOf(b) - items.indexOf(a));
      const idx = items.indexOf(cands[0]);
      items[idx] = trimOneHardSet(items[idx]); // backoff sheds backoffSets first — see trimOneHardSet
      trimmed++;
      continue;
    }
    // everything at its absolute per-exercise floor: drop a non-compound
    // lift — dropTierRank order (Gate 13: maintain protected LAST, not
    // first — see its own comment), ties broken last-listed first.
    const dropCands = items.filter((e) => !isCompound(e));
    if (!dropCands.length) break;
    dropCands.sort((a, b) => dropTierRank(a, focus) - dropTierRank(b, focus) || items.indexOf(b) - items.indexOf(a));
    const idx = items.indexOf(dropCands[0]);
    dropped.push(items[idx].name);
    items.splice(idx, 1);
  }
  return { list: items, trimmed, dropped, minutes: Math.round(total() / 60) + 8 };
}

/* Task 6, Section 6: single lookup for sessionRules.trimPriority, reused
   at every fitDayToTime/gate7DurationTrim call site so "did we remember
   to thread it here" isn't a question asked five separate times. */
function trimPriorityOf(data) {
  return (data && data.plan && data.plan.sessionRules && data.plan.sessionRules.trimPriority) || undefined;
}

function dayFittedMinutes(day, data) {
  const list = resolveDayExercises(day, data).map((e) => e.ex);
  return fitDayToTime(list, (data.plan && data.plan.sessionMin) || 60, data.focus, trimPriorityOf(data)).minutes;
}

/* ===== Auto-periodization (phase engine) =====
   Detects where you are in the process and adjusts the program:
   - Re-entry ramp: first ~4 weeks of logging after a layoff. Conservative
     loads, fast weekly progression ("muscle memory" re-acquisition).
   - Building block: the default. Double progression drives overload.
   - Deload: suggested when estimated 1RMs have stalled across most lifts for
     ~3 weeks (accumulated fatigue masking fitness). One week at ~60% sets and
     ~90% loads, then back to building — the standard evidence-based reset.
   - Block rotation: specialization splits are meant to run 8-12 weeks; after
     ~10 the engine suggests rotating back to Balanced so de-emphasized
     muscles return to full volume. Suggestions are one-tap, never silent. */

function trainingWeeks(sessions) {
  return new Set((sessions || []).map((s) => weekStart(s.date))).size;
}

/* `sessions` rows are per-EXERCISE log entries (one row per lift logged on
   a given day), not per-workout — logging 5 lifts in one gym visit creates
   5 rows. A real session/workout count needs to dedupe by date, the same
   pattern trainingWeeks already uses one level up (by week). Used by
   coachMetrics.totalSessions and the Insights Consistency card — both
   used to report sessions.length directly, which is really a set-row
   count (Task 5 build-spec failure #6: "141 sessions over 8 weeks"). */
function countTrainingSessions(sessions) {
  return new Set((sessions || []).map((s) => s.date)).size;
}

function deloadActive(data) {
  const p = data.phase;
  return !!(p && p.deloadUntil && todayISO() <= p.deloadUntil);
}

/* Share of trained compound lifts whose weekly-best e1RM has not improved
   over the last 3 recorded weeks. */
function stallScore(data) {
  const lifts = ALL_KNOWN.filter(
    (ex) => isCompound(ex) && data.sessions.some((s) => s.exerciseId === ex.id)
  );
  let eligible = 0, stalled = 0;
  lifts.forEach((ex) => {
    const series = weeklySeries(data.sessions, ex.id);
    if (series.length < 3) return;
    eligible++;
    const recent = series.slice(-3);
    if (recent[2].e1 <= recent[0].e1 * 1.005) stalled++;
  });
  return { eligible, stalled, ratio: eligible ? stalled / eligible : 0 };
}

function templateWeeks(data) {
  const since = data.plan && data.plan.templateSince;
  if (!since) return 0;
  const ms = new Date(todayISO()) - new Date(since);
  return Math.floor(ms / (7 * 24 * 3600 * 1000));
}

function phaseInfo(data) {
  const wks = trainingWeeks(data.sessions);
  const suggestions = [];
  if (deloadActive(data)) {
    return {
      name: "Deload week", icon: "recover",
      note: `Reduced volume (~60% sets) and ~90% loads through ${shortDate(data.phase.deloadUntil)}. Fatigue drops faster than fitness — you'll come back stronger.`,
      suggestions,
    };
  }
  const st = stallScore(data);
  if (wks >= 6 && st.eligible >= 3 && st.ratio >= 0.6) {
    suggestions.push({
      type: "deload",
      text: `${st.stalled} of ${st.eligible} main lifts have stalled for ~3 weeks — the classic accumulated-fatigue signal. A 1-week deload is the evidence-based reset.`,
    });
  }
  const tmpl = (data.plan && data.plan.template) || "balanced";
  const tWks = templateWeeks(data);
  if ((tmpl === "superhero" || tmpl === "upperFocus") && tWks >= 10) {
    suggestions.push({
      type: "rotate",
      text: `You've run this specialization block for ${tWks} weeks. Research favors 8-12 week blocks, then rotating back to Balanced so de-emphasized muscles recover full volume.`,
    });
  }
  if (wks < 4) {
    return {
      name: "Re-entry ramp", icon: "ramp",
      note: `Week ${wks + 1} of ~4. Loads are deliberately conservative — post-layoff strength returns fast (myonuclear "muscle memory"), so expect quick weekly jumps without forcing them.`,
      suggestions,
    };
  }
  return {
    name: "Building block", icon: "build",
    note: `Week ${wks} of training. Double progression is the driver: hit the top of a rep range on all sets, add weight next session.`,
    suggestions,
  };
}

/* Live weekly-set tally per muscle group across the whole program + bonuses. */
function weeklySetsByGroup(data) {
  const program = getProgram(data);
  const t = {};
  program.forEach((day) => {
    const list = resolveDayExercises(day, data).map((e) => e.ex);
    const fitted = fitDayToTime(list, (data.plan && data.plan.sessionMin) || 60, data.focus, trimPriorityOf(data)).list;
    fitted.forEach((ex) => {
      const g = CAT_TO_GROUP[ex.cat];
      if (g) t[g] = (t[g] || 0) + ex.sets;
    });
  });
  return t;
}

    param:"supplementation", source:"Rawson & Volek 2003; Lanhers et al. 2017 meta-analysis" },

/* Shared phase-tag computation backing both research functions below —
   extracted so "which tags apply right now" is computed once, identically,
   whether the corpus is being filtered (check-in) or just ranked (full). */
function researchPhaseTags(data) {
  const plan = (data.plan && data.plan.template) || "balanced";
  const weeks = trainingWeeks(data.sessions || []);
  const isReentry = weeks < 6;
  const isDeloading = deloadActive(data);
  const ss = stallScore(data);
  const isStalled = ss.eligible >= 2 && ss.ratio >= 0.5;
  const tags = new Set(["all"]);
  if (isReentry) { tags.add("reentry"); tags.add("injury_recovery"); }
  if (isDeloading) tags.add("deload");
  if (isStalled) tags.add("stalled");
  tags.add(plan);
  if (weeks >= 6 && !isDeloading && !isStalled) tags.add("building");
  return tags;
}
function researchSpecificity(r, tags) {
  if (r.phase.some((p) => ["reentry", "injury_recovery", "deload", "stalled"].includes(p) && tags.has(p))) return 0;
  if (r.phase.some((p) => ["superhero", "upperFocus", "maintain"].includes(p) && tags.has(p))) return 1;
  if (r.phase.includes("building") && tags.has("building")) return 2;
  if (r.phase.some((p) => tags.has(p))) return 3;
  return 4;
}
/* Full corpus, ranked (never filtered or truncated) by relevance to the
   user's current phase — for the "full" brief tier. Task 6/7 day-
   authorship isn't built yet, but a model designing complete sessions will
   need the whole evidence base, not a curated slice, once it is. */
function researchRankedFull(data) {
  const tags = researchPhaseTags(data);
  return [...RESEARCH_CORPUS].sort((a, b) => researchSpecificity(a, tags) - researchSpecificity(b, tags));
}
/* Curated subset for the "checkin" tier — today's only real use case
   (recommending template/focus/sessionMin/calorieDelta, optionally simple
   prescriptions). A routine check-in doesn't need the full evidence base
   to justify a template recommendation. Capped at 3 (this app's pre-
   Task-5 behavior capped at 8; tightened further as part of getting the
   checkin tier back under the 7500-char threshold — see buildCoachBrief). */
function researchForCheckIn(data) {
  const tags = researchPhaseTags(data);
  return researchRankedFull(data).filter((r) => r.phase.some((p) => tags.has(p))).slice(0, 1);
}

/* Check-in tier's exercise scope: whatever the user's CURRENT program
   actually contains (every day, resolved through active swaps and any
   focus-driven bonus lifts), plus up to CHECKIN_ALTERNATES_PER_POOL
   same-pool alternates for each, ranked the same way the swap picker in
   ExerciseCard already ranks them (`rank`, 1 = best swap first).

   Measured against the real balanced program: an UNCAPPED pool expansion
   ("every same-pool exercise") pulled in 73 of 75 — the default program
   already touches nearly every pool, so that barely scoped anything.
   Even capped at 1 alternate/pool, the checkin brief still ran ~11.7K
   chars, well over the 7500-char threshold. Set to 0: check-in's actual
   job (recommend template/focus/sessionMin/calorieDelta, optionally
   simple per-exercise overrides on EXISTING exercises) doesn't need
   substitution candidates at all — proposing a SWAP is closer to an
   authoring decision than a routine check-in one. Bump this back up (and
   accept the size cost — see the character counts in buildCoachBrief's
   own comment) if check-in ever needs to reason about swaps directly. */
const CHECKIN_ALTERNATES_PER_POOL = 0;
function checkInExerciseIds(data) {
  const program = getProgram(data);
  const focus = data.focus || DEFAULT_FOCUS;
  const currentIds = new Set();
  program.forEach((day) => {
    day.exercises.forEach((slot) => currentIds.add(resolveSlot(slot, data.swaps, focus).id));
    bonusForDay(day, focus, program).forEach((b) => currentIds.add(b.id));
  });
  const scoped = new Set(currentIds);
  const poolsSeen = new Set();
  currentIds.forEach((id) => {
    const ex = EX_BY_ID[id];
    if (!ex || !ex.pool || poolsSeen.has(ex.pool)) return;
    poolsSeen.add(ex.pool);
    ALL_KNOWN
      .filter((a) => a.pool === ex.pool && !currentIds.has(a.id))
      .sort((a, b) => (a.rank || 4) - (b.rank || 4))
      .slice(0, CHECKIN_ALTERNATES_PER_POOL)
      .forEach((a) => scoped.add(a.id));
  });

}

  const ids = checkInExerciseIds(data);
  return ALL_KNOWN.filter((ex) => ids.has(ex.id));
}

/* ===== Coach brief builder =====
   Assembles the export prompt following Anthropic prompt-engineering practice:
   role first, data in XML-tagged sections before instructions, explicit
   constraints, numbered tasks, and a strict output contract (one fenced JSON
   block) so the reply can be pasted back and applied through the safety gates.

   Two tiers, chosen by the `tier` param ("checkin", the default, or
   "full"): sending the full 75-exercise library and full research corpus
   made the brief 20-25K characters — routinely over the 7500-char "Open in
   Claude" URL threshold, and a copy-paste chore on a phone either way. The
   free path this app exists around was the thing that broke. "checkin" is
   today's only real use case (recommend template/focus/sessionMin/
   calorieDelta, optionally simple prescriptions) and scopes the library to
   the user's current program + pool alternates, and the research to a
   curated phase-relevant subset — both already existed at roughly this
   scope before Task 5 widened them unconditionally. "full" is for Task 6/7
   day-authorship (not built yet) and sends everything; kept working and

function exerciseLibraryEntries(exercises) {
  return exercises.map((ex) => {
    const entry = { id: ex.id, name: ex.name, group: CAT_TO_GROUP[ex.cat] || ex.cat, tagSource: ex.tagSource || "untagged" };
    if (ex.attributes && ex.attributes.length) entry.attributes = ex.attributes;
    if (ex.romProfile && Object.keys(ex.romProfile).length) entry.romProfile = ex.romProfile;
    if (ex.contraindications && ex.contraindications.length) entry.contraindications = ex.contraindications;

   bulk of the brief's size, and repeated JSON keys ("id":,"name":,
   "group":...) across dozens of entries cost real characters for zero
   information the model needs. Fixed column positions (empty fields stay
   blank between pipes, never omitted) so the legend below is enough to

  if (!includeTags) {

  }
  return exerciseLibraryEntries(exercises).map((e) => {
    const attrs = (e.attributes || []).join(",");
    const rom = e.romProfile ? Object.entries(e.romProfile).map(([k, v]) => `${k}=${v}`).join(",") : "";
    const ci = (e.contraindications || []).join(",");
    const code = TAG_SOURCE_CODE[e.tagSource] || "U";
    // Trailing parenthetical qualifiers in a name ("...(above parallel)",
    // "...(no box, self-limited)") restate what romProfile/attributes
    // already say structurally in this same row — dropped here only (not
    // from ex.name itself, which stays intact everywhere else in the app).
    const name = e.name.replace(/\s*\([^)]*\)\s*$/, "");

const EXERCISE_LIBRARY_LEGEND = `Cols (pipe-delim, blank=none): id|name|group|tagSource|attributes|romProfile|contraindications
tagSource: D=descriptive fact, C=from_app_caution, G=conservative_default(UNVERIFIED GUESS - trust less), R=clinician_reviewed
attributes/contraindications: comma-separated. romProfile: key=value, comma-separated.`;

   content is never truncated (every logged lift is still sent, in both

   repeated JSON keys ("id":,"name":,"weeksLogged":...) per lift cost real
   characters for no benefit once a legend states the column order once. */
const TRAINING_METRICS_LIFTS_LEGEND = "lifts cols (pipe-delim): id|name|group|weeksLogged|latestE1|trendPct|stalled";
function formatLiftsCompact(lifts) {

}

/* Every session carrying a resolved pain signal (an answered value, during

function extractPlanJson(text) {
  const fence = text.match(/```json\s*([\s\S]*?)```/i) || text.match(/```\s*([\s\S]*?)```/);
  const raw = fence ? fence[1] : text;
  const s = raw.indexOf("{");
  const e = raw.lastIndexOf("}");
  if (s === -1 || e === -1) throw new Error("No plan JSON found in the pasted text.");
  return JSON.parse(raw.slice(s, e + 1));
}

/* ============================ HELPERS ============================ */

const e1rm = (w, r) => (r >= 1 ? (w === 0 ? r : w * (1 + r / 30)) : 0);
const round5 = (x) => Math.max(5, Math.round(x / 5) * 5);
/* Step a load down by ~10%, but never less than one equipment increment. */
function stepDown(w, inc) {
  const step = Math.max(inc || 5, Math.round((w * 0.1) / (inc || 5)) * (inc || 5));
  return Math.max(inc || 5, w - step);
}

function weekStart(dateISO) {
  const d = new Date(dateISO + "T12:00:00");
  const day = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - day);
  return d.toISOString().slice(0, 10);
}
const shortDate = (iso) =>
  new Date(iso + "T12:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric" });
const todayISO = () => new Date().toISOString().slice(0, 10);
const currentBodyweight = (data) => {
  const w = [...(data.weights || [])].sort((a, b) => (a.date < b.date ? -1 : 1)).slice(-1)[0];
  return (w && w.lbs) || (data.nutrition && Number(data.nutrition ? 146 : 146)) || 146;
};

/* Point 1: drop segments excluded from e1RM — a drop's high-rep, reduced-
   load continuation can produce an inflated Epley estimate that isn't
   representative of true strength, corrupting the trend this feeds
   (weeklySeries -> stallScore -> the deload suggestion). Exclusion form
   (!== "drop"), not an inclusion whitelist: every pre-Task-3 session has
   no segment field at all, and undefined must read as "not drop" so
   historical data isn't retroactively dropped from e1RM tracking (see
   check-set-scheme-migration.js). Backoff rows stay eligible — a backoff
   set's e1RM essentially never beats the top set's anyway, so excluding
   it would cost nothing and including it costs nothing either. */
function bestSet(sets) {
  let best = null;
  for (const s of sets) {
    if (s.segment === "drop") continue;
    const v = e1rm(Number(s.w) || 0, Number(s.r) || 0);
    if (!best || v > best.v) best = { ...s, v };
  }
  return best;
}

function weeklySeries(sessions, exId) {
  const byWeek = {};
  const mine = sessions.filter((s) => s.exerciseId === exId);
  mine.forEach((s) => {
    const wk = weekStart(s.date);
    const b = bestSet(s.sets);
    if (!b) return;
    if (!byWeek[wk] || b.v > byWeek[wk].e1) {
      byWeek[wk] = { ...(byWeek[wk] || {}), week: wk, e1: b.v, topW: Number(b.w) || 0, topR: Number(b.r) || 0 };
    }
  });
  mine.forEach((s) => {
    const wk = weekStart(s.date);
    const vol = s.sets.reduce((a, x) => a + (Number(x.w) || 0) * (Number(x.r) || 0), 0);
    if (byWeek[wk]) byWeek[wk].vol = (byWeek[wk].vol || 0) + vol;
  });
  return Object.values(byWeek).sort((a, b) => (a.week < b.week ? -1 : 1));
}

/* Resolve a program slot through any active swap. The resolved exercise keeps
   the slot's set/rep scheme so the day's structure is preserved. */
function resolveSlot(slot, swaps, focus) {
  const swapId = swaps && swaps[slot.id];
  const base = (!swapId || !EX_BY_ID[swapId])
    ? { ...slot, slotId: slot.id, swapped: false }
    : { ...EX_BY_ID[swapId], repMin: slot.repMin, repMax: slot.repMax,
        slotId: slot.id, swapped: true, originalName: slot.name };
  // Emphasis scales the number of working sets for this exercise's muscle.
  const baseSets = slot.sets;
  base.sets = focus ? adjustSets(baseSets, base.cat, focus) : baseSets;
  base.baseSets = baseSets;
  base.focusBoost = focus ? (LEVEL_RANK[focus[CAT_TO_GROUP[base.cat]] ?? "normal"] >= 2) : false;
  return base;
}

/* Single source of truth for "what does this day actually contain right
   now" — generator slots (through any active swap, focus-adjusted) plus
   focus-driven bonus lifts, RECONCILED against any gated prescriptions
   Task 2's paste-apply pipeline stored for this day. Every caller that
   needs a day's exercise list (DayPage's render, the weekly volume tally,
   the time-budget estimate, the focus-effect summary, and — as of Task 2
   commit 3 — DayPicker.lastDone) goes through this one function so they
   can never compute a different answer from one another. This is also
   the exact lookup buildGateContext's ctx.currentSlotFor uses, so the
   gate-time "does this replace something" decision and the render-time
   splice-vs-push decision read the same predicate, not two that could
   drift apart (see applyGatedPrescriptions' tally subtraction and
   gate1dAmbiguousMatch).

   Returns {slot, ex} pairs: `slot` is what a swap picker needs (the
   original program slot for a generator exercise, or the bonus/
   prescribed exercise object itself, since neither has a separate
   "slot") — `ex` is the resolved exercise to render or count.

   Reconciliation (Task 2 commit 3, proposal section 2): REPLACE is the
   default — a prescription whose exerciseId already resolves to
   something in this day's list overrides that entry's sets/reps/load IN
   PLACE (same array index — critical for weeklySetsByGroup, whose
   accumulation loop just sums whatever's in this list once; growing the
   array here would double-count). A prescription whose exerciseId
   matches nothing in the day is an ADD — pushed as a new entry. A
   prescription matching MORE than one entry (only possible via two
   independently swapped slots converging on the same exercise) is
   skipped defensively here rather than guessed at — the authoritative
   reject-with-reason for that case is gate1dAmbiguousMatch, at apply
   time, against the state that existed when the prescription was gated;
   this is only a fallback for state drifting via a NEW swap made after
   that (rare, user-deliberate, and fails toward the generator's own
   already-approved output rather than toward doubling volume). */
/* Task 2 commit 4 — maxSetsPerMovement + pool-splitting. Deferred test 2's
 * acceptance criterion, and the fix for the build's originating bug
 * (failure #1: 6 sets stacked on EZ-Bar Curl). Given a fully-resolved
 * {slot, ex} list (generator + bonus + prescription-reconciled — this
 * runs LAST, over whatever any of those produced, so it catches overflow
 * regardless of origin per point 6), any entry over the cap is trimmed to
 * it; the overflow is redistributed onto a spawned same-pool alternative
 * rather than dropped or left stacked.
 *
 * Deterministic, explainable candidate order (point 2) — never
 * declaration order in ALL_KNOWN/LIBRARY_EXT: sort candidates by `rank`
 * ascending (the SAME field the swap picker and checkin pool-alternates
 * already use to judge substitute quality — reusing it here instead of
 * inventing a second ranking system), defaulting untagged-rank entries to
 * 4 (matching every other `rank || 4` site in this file), tie-broken by
 * the exercise's own display name so two equally-ranked (or both
 * default-ranked) candidates still resolve the same way every time. The
 * FIRST candidate in that order to pass Gate 1 and Gate 2 — the SAME gate
 * functions a pasted prescription runs through, called directly, not a
 * separate reimplementation (point 3) — is the one spawned.
 *
 * Deliberately NOT re-run here: Gate 1b (checkin scope) — that gate
 * exists to bound what a PASTED PLAN may reference; a pool spawn is the
 * app's own internal structural choice, exactly like bonusForDay already
 * draws from ALL_KNOWN/LIBRARY_EXT with no checkin-scope restriction.
 * Gate 6 (weekly group cap) — defaultGroupCap already exempts the app's
 * own unprompted structural output from Gate 6 (see its comment); a pool
 * split is that same kind of choice, not a new one this function invents,
 * and re-checking it here would risk exactly the double-counting Gate 6's
 * own fix in commit 3 was written to prevent. Gates 3/4/5 (load sanity /
 * pain rule / escalation) — all three act on an explicitly prescribed
 * LOAD; a spawned movement carries none (weight comes from recommend() at
 * render time same as any generator exercise), so there is nothing for
 * them to check.
 *
 * If no candidate passes (point 4): capped, not spawned, and said so —
 * under-dosing is recoverable, silently exceeding a cap is the bug this
 * whole mechanism exists to prevent. Never persisted (like bonusForDay's
 * bonus lifts, not like Gate 7's trim): recomputed fresh from whatever
 * the day's list looks like right now, so a spawned entry can never drift
 * from the state of the thing it's covering for. */
function capAndSplitMovement(list, maxSetsPerMovement, injuryProfile) {
  const cap = maxSetsPerMovement ?? DEFAULT_MAX_SETS_PER_MOVEMENT;
  const out = [...list];
  const notes = [];
  list.forEach((entry) => {
    const ex = entry.ex;
    if (!ex.sets || ex.sets <= cap) return;
    const overflow = ex.sets - cap;
    const idx = out.indexOf(entry);
    // Trim order for a backoff scheme (decision 2): backoffSets first —
    // the reduced-intensity, lower-priority portion — then topSets. Same
    // trimOneHardSet fitDayToTime/gate7DurationTrim use for their own
    // time-budget trim, so the two trim mechanisms can't disagree about
    // which part of a scheme gets shaved. overflow can never exceed
    // topSets+backoffSets (ex.sets already equals that sum, post-
    // normalization), so topSets can never go below 0 here.
    let cappedEx = ex;
    for (let i = 0; i < overflow; i++) cappedEx = trimOneHardSet(cappedEx);
    cappedEx = { ...cappedEx, cappedFrom: ex.sets };
    out[idx] = { slot: entry.slot, ex: cappedEx };
    const plural = (n) => `${n} set${n === 1 ? "" : "s"}`;

    if (!ex.pool) {
      notes.push({ exerciseId: ex.id, gate: "maxSetsPerMovement",
        note: `"${ex.name}" capped at ${cap} sets (${plural(overflow)} over) — untagged pool, no alternative could be searched for. ${plural(overflow)} of intended volume dropped.` });
      return;
    }
    const currentIds = new Set(out.map((e) => e.ex.id));
    const candidates = ALL_KNOWN
      .filter((a) => a.pool === ex.pool && a.id !== ex.id && !currentIds.has(a.id))
      .sort((a, b) => (a.rank || 4) - (b.rank || 4) || a.name.localeCompare(b.name));
    let spawned = null;
    for (const cand of candidates) {
      if (gate1UnknownId({ exerciseId: cand.id }).reject) continue;
      if (gate2Injury({ exerciseId: cand.id }, { injuryProfile }).reject) continue;
      spawned = cand;
      break;
    }
    if (!spawned) {
      notes.push({ exerciseId: ex.id, gate: "maxSetsPerMovement",
        note: `"${ex.name}" capped at ${cap} sets (${plural(overflow)} over) — no valid alternative in the "${ex.pool}" pool (all candidates contraindicated, untagged, or already in this day). ${plural(overflow)} of intended volume dropped rather than exceeding the cap.` });
      return;
    }
    const spawnedEx = {
      ...spawned, sets: overflow, baseSets: overflow,
      // Rep range: prefer the candidate's own (rare among LIBRARY_EXT
      // alternates — see DEFAULT_REP_RANGE's comment), else inherit the
      // overflowing exercise's own range (same precedent resolveSlot's
      // swap already follows: the day's rep-range intent carries over to
      // whatever fills the volume), else the universal fallback.
      repMin: spawned.repMin ?? ex.repMin ?? DEFAULT_REP_RANGE.min,
      repMax: spawned.repMax ?? ex.repMax ?? DEFAULT_REP_RANGE.max,
      slotId: spawned.id, swapped: false, focusBoost: !!ex.focusBoost,
      // Decision 2: overflow is leftover volume, never a deliberate
      // intensity choice — a spawned movement is always straight, never
      // inherits the overflowing exercise's scheme. ALL_KNOWN entries
      // never carry a scheme field to spread in by accident, but this is
      // explicit rather than relying on that being true forever.
      scheme: undefined,
      poolSpawned: true, poolSpawnedFrom: ex.id,
    };
    out.push({ slot: spawnedEx, ex: spawnedEx });
    notes.push({ exerciseId: ex.id, gate: "maxSetsPerMovement",
      note: `"${ex.name}" capped at ${cap} sets (was ${ex.sets}) — spawned "${spawned.name}" for the remaining ${plural(overflow)}: best-ranked available "${ex.pool}" pool alternative, passing all safety gates.` });
  });
  return { list: out, notes };
}

/* Task 3 — set schemes. A scheme changes what "how many sets" means, and
 * three DIFFERENT numbers fall out of one, conflating them is exactly
 * what would corrupt volume counts, duration estimates, and the cap:
 *   - hardSetsFor: what Gate 6 / maxSetsPerMovement / weeklySetsByGroup
 *     key on. backoff's topSets+backoffSets IS the hard-set count (a
 *     backoff set is a real, separately-rested set); drop's segments
 *     never add to it (a drop is a continuation of an existing set, not
 *     a new one) — straight/drop both just pass ex.sets through.
 *   - totalSegmentsFor: every physical segment that takes real time —
 *     used by duration estimation only. Same as hardSetsFor for
 *     straight/backoff; adds drop's extra continuation(s) on top for
 *     drop, since those take real (if brief) time even though they don't
 *     count as hard sets.
 * ex.sets itself is NORMALIZED to hardSetsFor's answer once, right here,
 * so every downstream reader (capAndSplitMovement, weeklySetsByGroup,
 * dayFittedMinutes, dayFocusSummary, DayPage) can keep reading plain
 * `.sets` with zero scheme-awareness of their own — one place computes
 * the derived number, not N places remembering to call a helper instead
 * of the field they're used to reading. */
function hardSetsFor(ex) {
  const scheme = ex.scheme;
  if (scheme && scheme.type === "backoff") return (scheme.topSets || 0) + (scheme.backoffSets || 0);
  return ex.sets || 0;
}
function totalSegmentsFor(ex) {
  const scheme = ex.scheme;
  if (scheme && scheme.type === "drop") {
    const affected = scheme.appliesTo === "allSets" ? (ex.sets || 0) : 1;
    return (ex.sets || 0) + affected * (scheme.drops || 1);
  }
  return ex.sets || 0; // straight and backoff: sets is already the full segment count (post-normalization)
}

/* Decision 5: no research or spec anchor for this number — flagged as an
   estimate, not derived. Duration estimation is already approximate
   (fitDayToTime's own "40s work + rest" per set is itself a rough
   number); this just needs to not be zero and not be silently invented
   without saying so. A drop segment skips its own full rest — minimal/no
   rest is the defining trait of a drop set — but still takes real time
   to execute, so it adds a flat cost here rather than the full
   "40s work + restSec" a separately-rested set costs. */
const DROP_SEGMENT_SEC = 20;
function dropExtraSec(ex) {
  const scheme = ex.scheme;
  if (!scheme || scheme.type !== "drop") return 0;
  const affected = scheme.appliesTo === "allSets" ? (ex.sets || 0) : 1;
  return affected * (scheme.drops || 1) * DROP_SEGMENT_SEC;
}

/* Shared by capAndSplitMovement's cap-trim and fitDayToTime/
   gate7DurationTrim's time-trim — one implementation of "which part of a
   scheme gets shaved when this exercise loses a hard set," so the two
   trim mechanisms (set-cap and time-budget) can't disagree with each
   other. Backoff sheds backoffSets before ever touching topSets (decision
   2's "protect the prioritized/heavier work" rule); straight and drop
   just decrement .sets (a drop's own segments aren't hard sets and are
   untouched by this — only its host set count moves). */
function trimOneHardSet(ex) {
  if (ex.scheme && ex.scheme.type === "backoff") {
    let { topSets = 0, backoffSets = 0 } = ex.scheme;
    if (backoffSets > 0) backoffSets -= 1; else topSets -= 1;
    return { ...ex, sets: ex.sets - 1, scheme: { ...ex.scheme, topSets, backoffSets } };
  }
  return { ...ex, sets: ex.sets - 1 };
}

/* Decision 4: deload strips schemes to straight, same ratchet logic as
   escalation (gate5PainEscalation) and arguably stronger — deload is a
   blanket whole-program recovery week, and a drop set is specifically an
   effort-to-failure-maximizing technique that runs against its purpose.
   Extracted to its own function (was inline in DayPage's isDeload block)
   so it's directly testable rather than an unverified one-liner buried in
   JSX — everything else this deep in the safety logic has a test with a
   deliberately-reintroduced-bug check behind it; this should too. Not
   active: pass the exercise through unchanged. Active: existing ~60% set
   reduction (floor 1-2, protecting compounds) plus the scheme strip —
   bolted onto the one mechanism rather than two, so recommend(),
   session-card rendering, and duration estimation never need their own
   deload awareness; they just never see a non-straight scheme that week. */
function deloadScale(ex, isDeload) {
  if (!isDeload) return ex;
  return {
    ...ex,
    sets: Math.max(isCompound(ex) ? 2 : 1, Math.round(ex.sets * 0.6)),
    scheme: { type: "straight" },
  };
}

/* Task 6, Section 1: resolves one `data.plan.days[]` entry's exercise
   into the same {slot, ex} shape resolveDayExercises builds for a
   generator slot, so every downstream consumer (capAndSplitMovement,
   weeklySetsByGroup, the swap picker, ExerciseCard's gate2Injury warn
   calls) needs zero authored-day-awareness of its own.

   Routes through the EXISTING resolveSlot rather than a parallel
   resolver — `pseudoSlot` spreads the real EX_BY_ID entry (not a bare
   {id,cat,sets} literal) so pool/rank/attributes/romProfile/
   contraindications/tagSource all carry onto the resolved `ex` exactly
   as they do for a generator slot, which is what capAndSplitMovement's
   spawn candidates and the swap picker's `alternates` pool filter both
   need. Passing `focus: null` deliberately skips resolveSlot's
   emphasis-rescaling branch (`base.sets = focus ? adjustSets(...) :
   baseSets`) — an authored `sets` count is the coach's own considered
   number, not something the day's focus sliders should silently
   rescale a second time. resolveSlot's swap-lookup keeps working
   unmodified: a user can still swap an authored exercise out via the
   normal picker, keyed by `ae.exerciseId` as the pseudo-slot's `id`. */
function resolveAuthoredExercise(ae, data) {
  const authoredBase = EX_BY_ID[ae.exerciseId];
  if (!authoredBase) return null; // Gate 9/1 rejects this at apply time; defensive here only
  const pseudoSlot = {
    ...authoredBase, id: ae.exerciseId,
    sets: ae.sets, repMin: ae.repMin ?? authoredBase.repMin, repMax: ae.repMax ?? authoredBase.repMax,
  };
  const resolved = resolveSlot(pseudoSlot, data.swaps, null);
  return {
    ...resolved,
    restSec: ae.restSec, prescribedLoad: ae.load, scheme: ae.scheme,
    order: ae.order ?? 0, rationale: ae.rationale, substitutedFor: ae.substitutedFor,
    authored: true,
  };
}

function resolveDayExercises(day, data) {
  const focus = data.focus || DEFAULT_FOCUS;
  const program = getProgram(data);
  // Task 6, Section 1: an authored day fully REPLACES generator selection
  // for this dayKey — checked first, before any generator/swap/bonus/
  // prescription-reconciliation logic runs. Prescriptions (Task 2) are a
  // PARTIAL-override mechanism against generator output; they don't
  // compose with full day authorship, so a prescription targeting an
  // authored dayKey is simply never reached below (this branch returns
  // before that filter runs).
  const authoredDay = data.plan && Array.isArray(data.plan.days) && data.plan.days.find((d) => d.dayKey === day.id);
  if (authoredDay) {
    const list = authoredDay.exercises
      .map((ae) => ({ slot: ae, ex: resolveAuthoredExercise(ae, data) }))
      .filter((entry) => entry.ex)
      .sort((a, b) => (a.ex.order ?? 0) - (b.ex.order ?? 0));
    list.forEach((entry) => { entry.ex.sets = hardSetsFor(entry.ex); });
    const cap = (data.plan && data.plan.sessionRules && data.plan.sessionRules.maxSetsPerMovement) ?? DEFAULT_MAX_SETS_PER_MOVEMENT;
    const injuryProfile = data.injuryProfile || DEFAULT_INJURY_PROFILE;
    const { list: splitList, notes } = capAndSplitMovement(list, cap, injuryProfile);
    splitList.maxSetsNotes = notes;
    return splitList;
  }
  const generatorList = [
    ...day.exercises.map((s) => ({ slot: s, ex: resolveSlot(s, data.swaps, focus) })),
    ...bonusForDay(day, focus, program).map((b) => ({ slot: b, ex: b })),
  ];
  // Task 6, Section 6 (pre-decision 6): default render order sorts by
  // emphasis rank DESCENDING — highest-focus group first — reusing
  // trimPriority (Fix 1's own emphasis+compound ranking) rather than a
  // second ordering scheme, so trim order and render order can't
  // disagree about which group is the day's priority. Fixes observed
  // failure #3 ("arms sequenced last, after 12 shoulder sets"):
  // generator slot declaration order used to be the ONLY thing driving
  // render order, unrelated to which group was actually focused.
  // Decorate-sort-undecorate on original index (not list.indexOf inside
  // the comparator, which would read a PARTIALLY-sorted array mid-sort
  // on some engines) keeps the tie-break stable. Authored days (above)
  // order by their own explicit `order` field instead; a prescription's
  // ADD is still appended after this sort, unchanged from before —
  // prescriptions carry no `order` field of their own to sort by today.
  const genOrder = generatorList.map((_, i) => i);
  genOrder.sort((i, j) => trimPriority(generatorList[j].ex, focus) - trimPriority(generatorList[i].ex, focus) || i - j);
  const list = genOrder.map((i) => generatorList[i]);
  const prescriptions = ((data.plan && data.plan.prescriptions) || []).filter((p) => p.dayKey === day.id);
  const OVERRIDE_FIELDS = ["sets", "repMin", "repMax", "restSec", "scheme"];
  prescriptions.forEach((p) => {
    const matchIdx = [];
    list.forEach((entry, i) => { if (entry.ex.id === p.exerciseId) matchIdx.push(i); });
    if (matchIdx.length > 1) return; // ambiguous — see comment above, skip defensively
    const overrides = {};
    OVERRIDE_FIELDS.forEach((k) => { if (p[k] !== undefined) overrides[k] = p[k]; });
    if (p.load !== undefined) overrides.prescribedLoad = p.load;
    if (matchIdx.length === 1) {
      const i = matchIdx[0];
      const mergedEx = { ...list[i].ex, ...overrides, prescribed: true, prescriptionApplied: "replace" };
      list[i] = { slot: list[i].slot, ex: mergedEx };
    } else {
      const base = EX_BY_ID[p.exerciseId];
      if (!base) return; // shouldn't happen — Gate 1 already validated existence at apply time
      const sets = overrides.sets ?? 3;
      const added = {
        ...base, sets, baseSets: sets,
        repMin: overrides.repMin ?? base.repMin ?? DEFAULT_REP_RANGE.min,
        repMax: overrides.repMax ?? base.repMax ?? DEFAULT_REP_RANGE.max,
        restSec: overrides.restSec, prescribedLoad: overrides.prescribedLoad,
        scheme: overrides.scheme,
        slotId: base.id, swapped: false, focusBoost: false,
        prescribed: true, prescriptionApplied: "add",
      };
      list.push({ slot: added, ex: added });
    }
  });
  // Normalize .sets to the hard-set count NOW, before capAndSplitMovement
  // (which must see a backoff's real total, not a possibly-mismatched
  // sets field — point 5) and before anything else in this file ever
  // reads .sets again.
  list.forEach((entry) => { entry.ex.sets = hardSetsFor(entry.ex); });
  // maxSetsPerMovement runs LAST, over the fully generator+bonus+
  // prescription-reconciled list — see capAndSplitMovement's own comment
  // for why it has to be here rather than only in the prescription-gate
  // path. The notes it produces have no natural "apply" moment to surface
  // through for generator-origin overflow (there's no paste involved at
  // all), so they're attached to the returned array itself — DayPage
  // reads `entries.maxSetsNotes` for its banner; every other caller
  // (weeklySetsByGroup, dayFittedMinutes, dayFocusSummary, lastDone) just
  // uses the array normally and never looks at this extra property.
  const cap = (data.plan && data.plan.sessionRules && data.plan.sessionRules.maxSetsPerMovement) ?? DEFAULT_MAX_SETS_PER_MOVEMENT;
  const injuryProfile = data.injuryProfile || DEFAULT_INJURY_PROFILE;
  const { list: splitList, notes } = capAndSplitMovement(list, cap, injuryProfile);
  splitList.maxSetsNotes = notes;
  return splitList;
}

/* Working weight = heaviest weight used in the most recent session of a lift */
function lastWorkingWeight(sessions, exId) {
  const hist = sessions.filter((s) => s.exerciseId === exId).sort((a, b) => (a.date < b.date ? -1 : 1));
  if (!hist.length) return null;
  return Math.max(...hist[hist.length - 1].sets.map((s) => Number(s.w) || 0));
}

/* Recommendation engine: double progression, plus cross-lift estimation for
   exercises you haven't logged yet (used when swapping something new in).
   ex.prescribedLoad (set by resolveDayExercises's reconciliation when a
   gated prescription supplied an explicit `load`) takes priority over
   every other branch below — it's already passed Gate 3/4/5's safety
   checks against logged history, so there's nothing left for this
   function's own history-driven logic to add. Checked BEFORE the deload
   branch, not after: deload still overrides a prescribed load exactly as
   it overrides everything else here (Gate 8), it just does so at render
   time now instead of being baked into the stored prescription — see the
   comment on applyGatedPrescriptions' deload handling for why. Omitting
   `load` on a prescription (ex.prescribedLoad left unset) means "keep
   using this engine," unaffected — the normal history-driven path below
   runs exactly as it does for a plain generator exercise. */
function recommend(ex, sessions, deload) {
  if (ex.prescribedLoad != null) {
    return deload
      ? { weight: round5(ex.prescribedLoad * 0.9), tag: "Deload", note: `Deload week: ~90% of your coach-prescribed ${ex.prescribedLoad} lb, reduced sets, stop 3-4 reps shy of failure. Recovery is the goal.` }
      : { weight: ex.prescribedLoad, tag: "Prescribed", note: "From your applied coach plan — verified against your logged history before it was applied." };
  }
  const hist = sessions
    .filter((s) => s.exerciseId === ex.id)
    .sort((a, b) => (a.date < b.date ? -1 : 1));

  if (hist.length === 0) {
    if (ex.basedOn) {
      const refW = lastWorkingWeight(sessions, ex.basedOn.ex);
      if (refW) {
        const refName = EX_BY_ID[ex.basedOn.ex]?.name || "a related lift";
        return {
          weight: round5(refW * ex.basedOn.ratio),
          tag: "Estimated",
          note: `Estimated from your ${refName} (${refW} lb). Treat set 1 as a feeler and adjust.`,
        };
      }
    }
    return {
      weight: ex.start,
      tag: "Start",
      note: ex.start === 0
        ? "Bodyweight to begin. Add load once you clear the top of the rep range."
        : "Conservative starting weight. Should feel easy — that's the point.",
    };
  }

  const last = hist[hist.length - 1];
  // Point 1, the important finding: the double-progression math below
  // (allTop/belowMin/decay) exists specifically to detect "reps
  // collapsing across sets = load too heavy" and prescribe a REDUCTION.
  // A deliberate backoff/drop set is, by design, a different (lower)
  // load with a different rep target — fed in unfiltered, it reads as
  // exactly that collapse on every single scheme'd session, compounding
  // a reduction on top of a reduction. Restrict this decision to the
  // working (top/straight) segment only. Exclusion form, not an
  // inclusion whitelist (segment !== "top"/"straight" would silently
  // exclude every pre-Task-3 row, which has no segment field at all —
  // see check-set-scheme-migration.js): a row counts unless it's
  // EXPLICITLY tagged backoff or drop.
  const workingOnly = last.sets.filter((s) => s.segment !== "backoff" && s.segment !== "drop");
  // Defensive: a session with no top/straight row at all (shouldn't
  // happen — a backoff/drop set presupposes a working set before it —
  // but falling back to every row beats Math.max(...[]) === -Infinity).
  const working = workingOnly.length ? workingOnly : last.sets;
  const reps = working.map((s) => Number(s.r) || 0);
  const w = Math.max(...working.map((s) => Number(s.w) || 0));
  if (deload) {
    return { weight: round5(w * 0.9), tag: "Deload", note: `Deload week: ~90% of your last working weight (${w} lb), reduced sets, stop 3-4 reps shy of failure. Recovery is the goal.` };
  }
  const inc = ex.inc ?? 5;
  const live = reps.filter((r) => r > 0);
  const allTop = live.length > 0 && live.every((r) => r >= ex.repMax);
  const belowMin = live.filter((r) => r < ex.repMin).length;
  const first = live[0] || 0;
  const worst = live.length ? Math.min(...live) : 0;
  // Inter-set rep decay: how much the last sets collapse vs the first.
  const decay = first > 0 ? (first - worst) / first : 0;

  /* Load selection is BIDIRECTIONAL. The target load is the one that keeps every
     prescribed set inside the rep range at ~1-3 reps in reserve. A large decay
     across sets (>=35%) means the load exceeds what can be repeated within the
     rest period: set 1 is productive, later sets fall out of the range and
     deliver less stimulus at higher joint cost. The fix is a step DOWN in load,
     or back-off sets after a heavy top set — not grinding the same weight. */
  if (belowMin >= 2 || (belowMin >= 1 && decay >= 0.5)) {
    const target = stepDown(w, inc);
    return {
      weight: target,
      tag: "Reduce",
      backoff: target,
      note: `Your reps fell from ${first} to ${worst} at ${w} lb — that's a ${Math.round(decay * 100)}% drop, and ${belowMin} set${belowMin > 1 ? "s" : ""} landed under ${ex.repMin}. The right load is one you can hold across all ${ex.sets || live.length} sets. Drop to ${target} lb. (Alternative: keep ${w} lb for set 1, then back off to ${target} for the rest.)`,
    };
  }
  if (belowMin >= 1) {
    return {
      weight: w,
      tag: "Back-off sets",
      backoff: stepDown(w, inc),
      note: `Only the last set slipped under ${ex.repMin}. Keep ${w} lb while reps are still in range, and drop to ${stepDown(w, inc)} lb on any set that would fall short — back-off loading keeps every set inside the range instead of grinding.`,
    };
  }
  if (allTop && inc > 0) {
    return { weight: w + inc, tag: "Add weight", note: `You hit ${ex.repMax}+ reps on every set at ${w} lb. Move up — and if the last set drops below ${ex.repMin} at the new load, back off rather than grinding.` };
  }
  return { weight: w, tag: "Add reps", note: `Same weight (${w} lb) — aim for +1 rep per set toward ${ex.repMax}.` };
}

/* Last logged session for an exercise, for the "last time" reference display. */
function lastSessionFor(sessions, exId) {
  const hist = sessions.filter((s) => s.exerciseId === exId).sort((a, b) => (a.date < b.date ? -1 : 1));
  return hist.length ? hist[hist.length - 1] : null;
}

/* painRule (Gate 4, Task 4) covers pain "during OR within 24h after" a lift.
   `pain` on the session row only ever captures the during-session half.
   This finds pending delayed-onset answers across ALL lifts, not gated on
   reopening the specific exercise trained — on a ~7-day split (the hip
