   lifts: RDL, goblet squat, hip thrust) that exercise-specific trigger would
   close its window six days before the user ever reopens it, so exactly the
   movements the labrum/hamstring constraints exist for would never get
   asked. Surfaced once per app-open/session-start via
   PendingPainRetroPrompts, dismissible (painRetroDismissed) so it doesn't
   re-nag once skipped.

   Three distinct states per session — NOT two — and Gate 5 (Task 4) must
   keep them distinct:
     - answered:   painRetro is a number (0 counts — "No pain" is a real,
                   explicit answer via its own one-tap button, distinct from
                   dismissing)
     - dismissed:  painRetroDismissed === true, painRetro stays null — the
                   user was asked and explicitly skipped
     - pending:    painRetro === null, painRetroDismissed !== true — not
                   yet asked/answered, may still be inside or past the window
   Gate 5 escalates on pain >3/10 in 2 of the last 4 sessions for a movement
   pattern. Dismissed and pending are both UNKNOWN, never a confirmed zero —
   treating either as "no pain" would silently fill Gate 5's denominator
   with silence and the escalation would never fire. Do not re-decide this:
   only an `answered` entry (including an explicit 0) may count toward that
   denominator. */
function findAllPendingPainRetros(sessions, injuryProfile, today) {
  if (!injuryProfile || !injuryProfile.recoveringMode) return [];
  const t = today || todayISO();
  const seen = new Set();
  const out = [];
  [...(sessions || [])]
    .filter((s) => s.date !== t && s.painRetro == null && s.painRetroDismissed !== true)
    .sort((a, b) => (a.date < b.date ? 1 : -1))
    .forEach((s) => {
      if (seen.has(s.exerciseId)) return; // most recent unanswered session per lift only
      seen.add(s.exerciseId);
      const days = Math.round((new Date(t) - new Date(s.date)) / 86400000);
      if (days >= 1 && days <= 3) out.push(s);
    });
  return out;
}

/* Silent non-reporting on a constrained lift is itself a signal, not a clean
   record — surfaced in InjuryProfileCard so it's visible even though it
   never blocks anything. 3+ consecutive dismissed-and-unanswered retros on
   the same lift, most-recent-first, trips this; a single answered session
   (including an explicit "No pain") resets the streak. */
function painReportingGaps(sessions, injuryProfile) {
  if (!injuryProfile || !injuryProfile.recoveringMode) return [];
  const byLift = {};
  [...(sessions || [])]
    .sort((a, b) => (a.date < b.date ? -1 : 1))
    .forEach((s) => { (byLift[s.exerciseId] = byLift[s.exerciseId] || []).push(s); });
  const gaps = [];
  Object.entries(byLift).forEach(([exId, hist]) => {
    let streak = 0;
    for (let i = hist.length - 1; i >= 0; i--) {
      if (hist[i].painRetroDismissed === true && hist[i].painRetro == null) { streak++; continue; }
      break;
    }
    if (streak >= 3) gaps.push({ exerciseId: exId, streak });
  });
  return gaps;
}

function trendPct(series) {
  if (series.length < 2) return null;
  const recent = series.slice(-4);
  const first = recent[0].e1, last = recent[recent.length - 1].e1;
  if (!first) return null;
  return { pct: ((last - first) / first) * 100, weeks: recent.length - 1 };
}

/* ===== Safety gates 1-8 (Task 4) =====
   Every gate is a pure function over (prescription, ctx) — a gate has no
   idea whether its prescription arrived via Task 2's `prescriptions` array
   or Task 6's `days` array; if a gate needed to know its caller, the
   boundary would be wrong. Gate 2 takes no bypass parameter anywhere,
   ever, and is reused verbatim as Gate 9 once Task 6 exists.

   Per-prescription gate contract:
     { reject: false }                     — passes unchanged
     { reject: false, value, note }        — passes, prescription modified
                                              (load/etc.), reason surfaced
     { reject: true, gate, reason }        — whole prescription dropped

   ctx = { injuryProfile, sessions, weeklyGroupSets, weeklyGroupSetCaps,
           sessionMin, deloadActive, escalatingPatterns }
   Gates 6-8 are inherently multi-prescription concerns (a volume cap, a
   session-length trim, and a deload override all only make sense across
   the whole accepted set) and are applied in applyGatedPrescriptions,
   not as isolated per-item gates like 1-5. */

const SQUAT_DEPTH_ORDER = ["above_parallel", "parallel", "below_parallel"];
const HINGE_ROM_ORDER = ["mid_shin", "below_knee", "floor"];
/* Ordinal comparison for the two romProfile dimensions
   movementConstraints.limited currently constrains. Returns false (does
   not exceed) for values on no recognized scale — an exercise's romProfile
   simply not carrying a given key means that dimension doesn't apply to
   its mechanics (e.g. leg press has no squatDepth — it isn't on the
   free-squat depth scale at all), which is a Task 1 tagging decision, not
   this gate's to relitigate. */
function exceedsDepthLimit(value, maxValue) {
  for (const order of [SQUAT_DEPTH_ORDER, HINGE_ROM_ORDER]) {
    const vi = order.indexOf(value), mi = order.indexOf(maxValue);
    if (vi !== -1 && mi !== -1) return vi > mi;
  }
  return false;
}

/* Gate 1 — unknown exerciseId. */
function gate1UnknownId(prescription) {
  if (!EX_BY_ID[prescription.exerciseId]) {
    return { reject: true, gate: 1, reason: `Unknown exercise id "${prescription.exerciseId}" — not in the library.` };
  }
  return { reject: false };
}

/* Gate 1b — checkin-tier scope. The checkin brief tells the model
   exerciseId must come from the user's current program (it isn't shown
   attributes/contraindications for anything else), but that's a prompt
   instruction, not an enforced boundary — nothing stops a pasted plan
   from naming an id outside that scope, seen or not. ctx.checkinScoped/
   checkinScopeIds come from buildGateContext, driven by data.briefTier
   (app-controlled state, set only by CoachCard's own Copy/Open actions —
   never read off the pasted plan itself, so a pasted plan can't claim
   "full" to escape this). Caller-agnostic like every other gate here:
   only reads prescription.exerciseId and ctx. */
function gate1bCheckinScope(prescription, ctx) {
  if (!ctx.checkinScoped || !ctx.checkinScopeIds) return { reject: false };
  if (!ctx.checkinScopeIds.has(prescription.exerciseId)) {
    const ex = EX_BY_ID[prescription.exerciseId];
    return { reject: true, gate: 1, reason: `"${ex ? ex.name : prescription.exerciseId}" isn't in your current program — this plan was generated at check-in scope, which can only reference existing program exercises. Ask for the full tagged library to propose something new.` };
  }
  return { reject: false };
}

/* Gate 1c — dayKey required and must name a day the CURRENT template
 * actually generates (Task 2 commit 3, TASK-2-RECONCILIATION-PROPOSAL.txt
 * section 2/Q2). dayKey is an identity field, not an omittable override
 * parameter like sets/repMin/load — without it there's no way to know
 * which day a REPLACE targets or an ADD lands on. Reject rather than
 * silently guess or silently drop, same as every other gate here.
 * ctx.programDayIds comes from buildGateContext (getProgram(data).map(d
 * => d.id)) — the current template's own day ids, so switching templates
 * makes a stale dayKey invalid here automatically, not just inert at
 * render time. */
function gate1cDayKey(prescription, ctx) {
  if (!prescription.dayKey) {
    return { reject: true, gate: 1, reason: `Prescription for "${(EX_BY_ID[prescription.exerciseId] || {}).name || prescription.exerciseId}" is missing dayKey — every prescription must name which day it applies to.` };
  }
  if (ctx.programDayIds && !ctx.programDayIds.has(prescription.dayKey)) {
    const valid = [...ctx.programDayIds].join(", ");
    return { reject: true, gate: 1, reason: `"${prescription.dayKey}" isn't a day in your current template — valid days are: ${valid}.` };
  }
  return { reject: false };
}

/* Gate 1d — ambiguous match. If the exerciseId this prescription names
 * already appears MORE THAN ONCE in that day's current rendered output,
 * there's no way to tell which occurrence it means to override — applying
 * it to both would double the volume it's trying to control, exactly the
 * failure this build exists to prevent (Q1, proposal section 3). This is
 * rare under the static generator alone (verified: no template's day list
 * repeats an exerciseId) — it only arises when two DIFFERENT slots have
 * independently been user-swapped to the same replacement exercise.
 * Reject rather than guess, naming both slot ids so the user can tell
 * which swap to undo. ctx.currentSlotFor is the same day-resolution
 * lookup applyGatedPrescriptions' tally subtraction uses — one predicate
 * answering "what does this match" for both the reject decision here and
 * the subtract-before-add arithmetic there, so they can't disagree. */
function gate1dAmbiguousMatch(prescription, ctx) {
  if (!ctx.currentSlotFor) return { reject: false };
  const matches = ctx.currentSlotFor(prescription.dayKey, prescription.exerciseId);
  if (matches.length > 1) {
    const slotIds = matches.map((m) => m.slot.id).join(", ");
    const ex = EX_BY_ID[prescription.exerciseId];
    return { reject: true, gate: 1, reason: `"${ex ? ex.name : prescription.exerciseId}" appears more than once on this day (slots: ${slotIds}) — likely two different exercises independently swapped to the same one. Can't tell which occurrence this prescription means; undo one of the swaps first.` };
  }
  return { reject: false };
}

/* Gate 1e — scheme/sets consistency (Task 3, decision 1). A backoff
 * scheme's own topSets+backoffSets IS the authoritative hard-set total
 * (hardSetsFor) — but if a prescription ALSO specifies a bare `sets`
 * field that disagrees with that total, silently picking one and
 * ignoring the other would hide that the author was confused about which
 * contract they were writing to. Reject instead: cheap to check, and it
 * surfaces malformed output (from a coach paste today, from Task 6/7
 * authoring later) rather than quietly resolving it one way. Omitting
 * `sets` entirely and letting the scheme's own totals define it is not a
 * mismatch — only an explicit, disagreeing value is. */
function gate1eSchemeConsistency(prescription) {
  const scheme = prescription.scheme;
  if (!scheme || scheme.type !== "backoff" || prescription.sets === undefined) return { reject: false };
  const implied = (scheme.topSets || 0) + (scheme.backoffSets || 0);
  if (prescription.sets !== implied) {
    const ex = EX_BY_ID[prescription.exerciseId];
    return { reject: true, gate: 1, reason: `Prescription for "${ex ? ex.name : prescription.exerciseId}" specifies sets:${prescription.sets} but its backoff scheme implies ${implied} (topSets:${scheme.topSets || 0} + backoffSets:${scheme.backoffSets || 0}) — these must agree. Omit sets and let the scheme define the total, or fix the mismatch.` };
  }
  return { reject: false };
}

/* Gate 2 — the injury gate. Not overridable by a pasted plan under any
   circumstance: no bypass flag, no confirmation dialog, and — structurally
   — no parameter through which one could even be threaded. injuryProfile
   is destructured directly in the signature (not read off an opaque ctx
   blob) so this function stays visible to
   scripts/check-write-isolation.js's discovery scan, per Task 1's stated
   convention.

   Fix 3 (2026-09-20): this same function also backs a SECOND surface — a
   user's own exercise swap. The swap picker (ExerciseCard's alternates
   list), a swapped-in exercise's persistent card warning, and the Injury
   Profile card's summary list (contraindicatedInActiveProgram, below) all
   call gate2Injury directly and get exactly this result — but none of
   them reject on it. They warn: name the contraindication, never block
   the selection, never auto-remove or auto-swap it back (the user
   decides). This is a deliberate asymmetry, not an inconsistency for a
   future edit to "fix" by hard-blocking swaps too:
     - A pasted prescription is an LLM's proposal, evaluated with no human
       in the loop between the proposal and the write — Gate 2 rejecting
       it outright is Task 4's whole premise ("Claude proposes, the app
       disposes, and neither decides what is medically safe").
     - A swap is the user themself, in the room, deliberately choosing
       their own exercise — not an LLM's guess. Hard-blocking it would be
       the app overriding a person's real-time judgment about their own
       body, on the strength of a tag that — per contraindicationSourceNote
       below — is sometimes itself just an unverified guess. And per
       TASK-0-BACKUP-MIGRATION-REVIEW.txt's real data: the goblet-tagged
       squat this asymmetry was written against had +20% progress over 7
       weeks with zero logged pain before the tag even existed — exactly
       the kind of swap that can be working, that a hard block would have
       silently undone.
   gate2Injury itself never forks for this — one implementation, one
   reject/reason payload, every call site. Only what happens AFTER the
   call (reject-and-drop vs. warn-and-let-through) differs. */
function gate2Injury(prescription, { injuryProfile }) {
  if (!injuryProfile || !injuryProfile.recoveringMode) return { reject: false };
  const ex = EX_BY_ID[prescription.exerciseId];
  if (!ex) return { reject: false }; // Gate 1 already reports unknown ids
  if (!isExerciseTagged(ex)) {
    return { reject: true, gate: 2, reason: `"${ex.name}" is untagged — denied by default while recovering (untagged means unknown, and unknown near this injury means no).` };
  }
  const mc = injuryProfile.movementConstraints || DEFAULT_INJURY_PROFILE.movementConstraints;
  const forbiddenHit = ex.attributes.find((a) => (mc.forbidden || []).includes(a));
  if (forbiddenHit) {
    return { reject: true, gate: 2, reason: `"${ex.name}" carries attribute "${forbiddenHit}", which is forbidden while recovering.` };
  }
  for (const lim of (mc.limited || [])) {
    const key = lim.attribute === "squat_depth" ? "squatDepth" : lim.attribute === "hinge_rom" ? "hingeRom" : lim.attribute;
    const value = ex.romProfile && ex.romProfile[key];
    if (value != null && exceedsDepthLimit(value, lim.maxValue)) {
      return { reject: true, gate: 2, reason: `"${ex.name}"'s ${lim.attribute} (${value}) exceeds the ${lim.maxValue} limit while recovering.` };
    }
  }
  // Not in the spec's own illustrative gate-logic pseudocode (which only
  // shows the attributes/romProfile checks) — but the exercise schema
  // explicitly carries a `contraindications` field, Task 1's own worked
  // example populates it, and the goblet/boxsquat split depends entirely
  // on it being enforced (not just documentation). Without this check,
  // every contraindications tag from Task 1 (bbrow, trapdl, goblet) is
  // inert data. Only an active (non-resolved) injury counts.
  const activeInjuryIds = new Set((injuryProfile.injuries || []).filter((inj) => inj.status !== "resolved").map((inj) => inj.id));
  const ciHit = (ex.contraindications || []).find((id) => activeInjuryIds.has(id));
  if (ciHit) {
    const label = (INJURY_VOCABULARY && INJURY_VOCABULARY[ciHit]) || ciHit;
    return { reject: true, gate: 2, reason: `"${ex.name}" is contraindicated for ${label}, which is active while recovering.` };
  }
  return { reject: false };
}

/* Fix 3, point 4: an exercise's `tagSource` (see EXERCISE_ATTRS' own
   comment) records how confidently its WHOLE verdict — attributes,
   romProfile, and contraindications together, one tagSource per exercise,
   not one per field — was arrived at. "Tagged" is not the same claim as
   "clinically verified," and the warning copy must say so honestly
   rather than reading as a medical directive. goblet is
   conservative_default: no in-app or clinical signal existed either way,
   so the stricter guess was made rather than assuming safe — not a
   judgment call by anyone qualified to make one.

   Keyed on tagSource alone, not on which specific Gate 2 branch fired:
   goblet's own romProfile.squatDepth ("below_parallel") is what actually
   trips DEFAULT_INJURY_PROFILE's squat_depth limit before gate2Injury
   ever reaches the contraindications check below it — but that romProfile
   value came from the exact same conservative-default guess as its
   contraindications tag, so gating this note on "did contraindications
   specifically fire" would have silently dropped the disclosure for the
   one real exercise (goblet) this was written for. Caught by
   scripts/check-injury-swap-warnings.js against real data before this
   shipped — see that file's history for the reject-reason that surfaced
   it. "descriptive" (a mechanical fact, no verdict inference) and no
   tagSource at all (the exercise doesn't carry one, or Gate 2's own
   "untagged" reason already explains the unknown) both correctly return
   null: nothing to disclose beyond what's already said.

   Still deliberately NOT about the forbidden/limited THRESHOLD values
   themselves (injuryProfile.movementConstraints, entered by the user in
   Settings) — only about whether THIS EXERCISE's own tagged value is
   confidently correct. Those are two different uncertainties; this note
   only speaks to the second one.

   One function, reused by the swap picker, the persistent card warning,
   and the Injury Profile card's list — so the qualifier can't drift into
   reading differently in three places. */
const CONTRAINDICATION_SOURCE_NOTE = {
  conservative_default: {
    short: "unverified guess, not clinician-reviewed",
    long: "an unverified guess, not clinical judgment — no signal existed either way when this was tagged, so the stricter assumption was made rather than assuming it's safe",
  },
  from_app_caution: {
    short: "inferred from in-app notes, not clinician-reviewed",
    long: "inferred from caution notes already in this app's exercise library, not a clinician's direct review",
  },
  clinician_reviewed: {
    short: "clinician-reviewed",
    long: "confirmed by the clinician managing this injury",
  },
};
function contraindicationSourceNote(ex, variant) {
  const source = ex && ex.tagSource;
  if (!source || source === "descriptive") return null;
  const n = CONTRAINDICATION_SOURCE_NOTE[source];
  return n ? n[variant || "long"] : null;
}

/* Fix 3, point (d): every contraindicated exercise currently sitting in
   the active program (generator + swaps + bonus + reconciled
   prescriptions — the exact same resolveDayExercises every render path
   already agrees on), in one place, rather than only discoverable by
   opening each day's cards one at a time. Read-only: this never removes
   or changes anything (point c) — InjuryProfileCard just lists what
   gate2Injury, run in warn mode, already found. Deduped by exerciseId
   since the same swap can appear on more than one day. Empty while not
   recoveringMode, matching gate2Injury's own short-circuit — there's
   nothing to warn about when the gate itself is off. */
function contraindicatedInActiveProgram(data) {
  const injuryProfile = data.injuryProfile || DEFAULT_INJURY_PROFILE;
  if (!injuryProfile.recoveringMode) return [];
  const program = getProgram(data);
  const seen = new Map();
  program.forEach((day) => {
    resolveDayExercises(day, data).forEach(({ ex }) => {
      if (seen.has(ex.id)) return;
      const g2 = gate2Injury({ exerciseId: ex.id }, { injuryProfile });
      if (g2.reject) seen.set(ex.id, { ex, reason: g2.reason, sourceNote: contraindicationSourceNote(ex, "long") });
    });
  });
  return [...seen.values()];
}

/* Gate 3 — load sanity. Falls back to recommend()'s own safe-load
   computation rather than duplicating that logic — recommend() already IS
   "what's the safe load for this lift given its logged history." */
/* recommend() reads ex.repMin/ex.repMax to judge rep-range performance
   (belowMin/allTop) — those only exist on a slot()-merged exercise object,
   never on the bare EX_BY_ID entry a gate looks up by exerciseId. Calling
   recommend() with the bare entry silently breaks that logic (repMin/
   repMax undefined -> every rep-range comparison is false). Merge the
   prescription's own target rep range in first, the same way Insights and
   ExerciseCard already do before calling recommend() elsewhere. */
function exerciseForRecommend(ex, prescription) {
  return { ...ex, repMin: prescription.repMin ?? ex.repMin, repMax: prescription.repMax ?? ex.repMax };
}

/* ESCALATION IS A ONE-WAY RATCHET TOWARD CONSERVATIVE. NEVER THE REVERSE.
   Gates 3 and 4 exist to protect the user; a pattern showing escalating
   pain is the worst state that protection could possibly be needed in.
   Do not re-read "stop auto-adjusting" (Gate 5's spec line) as "stop
   protecting" — a prior version of this file did exactly that (suppressed
   Gates 3/4 entirely on escalation) and it was wrong: it removed the load
   sanity check and the forced pain-rule reduction from the one movement
   that needed them most. What escalation actually changes:
     - Gate 4's forced reduction still applies, unconditionally, exactly as
       it would without escalation — nothing below ever suppresses it.
     - Gate 3's ceiling TIGHTENS from +15% to "never above last logged" —
       no progression, not a relaxed check.
     - Gate 5 additionally caps SETS at the last logged count for that
       exercise — no added volume either.
   If you are reading this while changing Gate 3, 4, or 5: escalation may
   only ever make the result MORE conservative than the non-escalating
   case would have produced, never less. */

function gate3LoadSanity(prescription, ctx) {
  const ex = EX_BY_ID[prescription.exerciseId];
  if (!ex) return { reject: false };
  const lastW = lastWorkingWeight(ctx.sessions, prescription.exerciseId);
  const escalating = ctx.escalatingPatterns && ctx.escalatingPatterns.has(ex.painPattern);

  if (prescription.load == null) {
    // Omitted load normally means "let recommend() drive it at render
    // time" — untouched. Escalation must still block an increase that
    // would otherwise flow through recommend() later, not just one
    // explicitly prescribed here, or the ratchet has a hole in it.
    if (escalating && lastW != null) {
      const rec = recommend(exerciseForRecommend(ex, prescription), ctx.sessions, ctx.deloadActive);
      if (rec.weight > lastW) {
        return {
          reject: false,
          value: { ...prescription, load: lastW, loadUnverified: true },
          note: `"${ex.name}" is on an escalating pain pattern — load capped at your last logged ${lastW} lb; no progression until the pattern clears (Gate 5).`,
        };
      }
    }
    return { reject: false };
  }

  if (lastW == null) return { reject: false }; // no logged history to sanity-check against yet
  const ceiling = escalating ? lastW : lastW * 1.15;
  if (prescription.load > ceiling) {
    const rec = recommend(exerciseForRecommend(ex, prescription), ctx.sessions, ctx.deloadActive);
    const fallback = escalating ? Math.min(rec.weight, lastW) : rec.weight;
    return {
      reject: false,
      value: { ...prescription, load: fallback, loadUnverified: true },
      note: escalating
        ? `"${ex.name}" prescribed at ${prescription.load} lb, but this pattern is escalating — capped at your last logged ${lastW} lb; no progression until it clears (Gate 5).`
        : `"${ex.name}" prescribed at ${prescription.load} lb is more than 15% above your last logged ${lastW} lb — falling back to ${rec.weight} lb.`,
    };
  }
  return { reject: false };
}

/* Gate 4 — pain rule. injuryProfile destructured directly in the
   signature for the same check-write-isolation.js visibility reason as
   Gate 2 — ...ctx recovers the rest (sessions, deloadActive). Unconditional:
   nothing, including escalation, ever suppresses this. Escalation only
   ever adds MORE restriction on top (Gate 3's tightened ceiling, Gate 5's
   sets cap) — it never removes this one. */
function gate4PainRule(prescription, { injuryProfile, ...ctx }) {
  const ex = EX_BY_ID[prescription.exerciseId];
  if (!ex) return { reject: false };
  const last = lastSessionFor(ctx.sessions, prescription.exerciseId);
  if (!last) return { reject: false };
  // "during OR within 24h after" — both live on the same session row.
  // Neither being set means unknown, not zero; Math.max with a -1 floor
  // keeps an unanswered field from masquerading as "no pain reported."
  const painValue = Math.max(last.pain ?? -1, last.painRetro ?? -1);
  const rule = (injuryProfile && injuryProfile.movementConstraints && injuryProfile.movementConstraints.painRule) || DEFAULT_INJURY_PROFILE.movementConstraints.painRule;
  if (painValue > rule.threshold) {
    const baseline = prescription.load ?? recommend(exerciseForRecommend(ex, prescription), ctx.sessions, ctx.deloadActive).weight;
    const reduced = round5(baseline * (1 - rule.value / 100));
    return {
      reject: false,
      value: { ...prescription, load: reduced, painRuleApplied: true },
      note: `"${ex.name}" logged pain ${painValue}/10 last session (over the ${rule.threshold}/10 threshold) — load forced to ${reduced} lb (${rule.value}% reduction), regardless of the prescription.`,
    };
  }
  return { reject: false };
}

/* Gate 5 — pain escalation. Never rejects the prescription outright (the
   movement can still be trained) — it tightens Gates 3/4 (see the ratchet
   note above) and additionally caps SETS at the last logged count here, so
   no volume is added on this pattern either. Surfaces a persistent
   clinician-consult prompt (PainEscalationNotice) naming the pattern and
   its clearance condition. The app enforces rules; it does not assess
   whether an injury is worsening — that assessment is the clinician's. */
function gate5PainEscalation(prescription, ctx) {
  const ex = EX_BY_ID[prescription.exerciseId];
  if (!ex || !ctx.escalatingPatterns || !ctx.escalatingPatterns.has(ex.painPattern)) return { reject: false };
  const last = lastSessionFor(ctx.sessions, prescription.exerciseId);
  // AMENDMENT (Task 3, recorded in DEFERRED-TESTS.md as a Task 4
  // sign-off correction): this used to be last.sets.length — a raw
  // logged-row count. A drop segment is a continuation of an existing
  // set, not a separate one (see hardSetsFor); once drop segments are
  // logged as their own rows, raw .length over-counts (a 4-hard-set
  // session with one drop logs as 5 rows), which would silently let the
  // escalation cap admit MORE volume next time than it should. Segment
  // absent (every pre-Task-3 session) reads as a hard set, never as a
  // drop — the exclusion form, not an inclusion whitelist, is what keeps
  // that migration-safe (see check-set-scheme-migration.js).
  const lastSetCount = last ? last.sets.filter((s) => s.segment !== "drop").length : null;
  const requestedSets = prescription.sets || 3;
  const setsCapped = lastSetCount != null && requestedSets > lastSetCount;
  // ESCALATION RATCHET EXTENSION (Task 3, point 8 — see the governing
  // "ESCALATION IS A ONE-WAY RATCHET" comment above gate3LoadSanity for
  // the rule this follows). A drop set is an effort-to-failure-
  // maximizing intensity technique; prescribing one on a pattern that's
  // actively escalating runs directly against what this gate exists to
  // do. Strip ANY non-straight scheme unconditionally — same one-way,
  // tighter-never-looser treatment as the sets cap above, never
  // reversible by anything downstream.
  const schemeStripped = !!(prescription.scheme && prescription.scheme.type !== "straight");
  const patch = {};
  if (setsCapped) { patch.sets = lastSetCount; patch.setsCapped = true; }
  if (schemeStripped) patch.scheme = { type: "straight" };
  return {
    reject: false,
    value: Object.keys(patch).length ? { ...prescription, ...patch } : undefined,
    note: `Pain escalation on the ${PAIN_PATTERN_NAMES[ex.painPattern] || ex.painPattern} pattern — no progression in load or sets until this pattern clears (3 consecutive logged sessions with answered pain at or below threshold). See the persistent clinician-consult prompt.${setsCapped ? ` Sets capped at ${lastSetCount}.` : ""}${schemeStripped ? ` Backoff/drop scheme stripped to straight sets — an intensity technique has no place on an escalating pattern.` : ""}`,
  };
}

/* Escalation trigger AND clearance backing Gate 5, walked across the
   pattern's full session history in chronological order — "currently
   escalating" is a question about the sequence since the last trigger,
   not a snapshot of the last few entries.

   TRIGGER (fires once, sets escalating=true): at any point where the
   trailing 4-session window has >=4 sessions and >=2 of them logged
   answered pain over `threshold`, OR — the "trending upward" rule the
   spec names but does not define, so pin it here precisely as an
   EXPLICITLY CHOSEN HEURISTIC WITH NO CLINICAL BASIS, deliberately biased
   to over-trigger rather than under-trigger: among that same trailing
   4-session window, if at least 3 sessions have an answered pain value,
   and the most recent answered value is at least 2 points higher than the
   oldest answered value in the window.

   CLEARANCE (fires once escalating, sets escalating=false): 3 CONSECUTIVE
   sessions on the pattern with an ANSWERED pain value at or below
   threshold. Dismissed/unanswered sessions are skipped entirely while
   escalating — they neither advance nor reset the clean streak, they hold
   it. An answered value over threshold resets the streak to 0.

   Task 6, Section 5 (pre-decision 5): grouped by `painPattern`, not
   `cat`, as of this commit — `cat` was both too wide (any pain on ANY
   lift sharing a cat suppressed/tightened every other lift in that cat,
   regardless of mechanical relationship) and too narrow (a hip labral
   issue presents across BOTH the squat and hinge cats, which `cat`
   treated as two unrelated patterns, so neither alone reached the 2-of-4
   trigger — the concrete gap this profile was built around). See
   PAIN_PATTERNS/inferPainPattern's own comment for the full taxonomy and
   derivation rule. No stored escalation state to migrate — this function
   has always derived "currently escalating" fresh from session history
   on every call, never persisted a flag, so swapping the grouping key
   takes effect immediately and uniformly across all historical sessions
   the next time this runs; scripts/check-pain-pattern-migration.js
   verifies the swap doesn't invent or drop an escalation for any
   realistic real-data case. */
function isPainEscalating(sessions, painPattern, threshold) {
  const t = threshold ?? 3;
  const hist = (sessions || [])
    .filter((s) => (EX_BY_ID[s.exerciseId] || {}).painPattern === painPattern)
    .sort((a, b) => (a.date < b.date ? -1 : 1)); // oldest first
  const painOf = (s) => { const v = Math.max(s.pain ?? -1, s.painRetro ?? -1); return v >= 0 ? v : null; };
  let escalating = false;
  let cleanStreak = 0;
  for (let i = 0; i < hist.length; i++) {
    const window = hist.slice(Math.max(0, i - 3), i + 1);
    const answeredInWindow = window.map(painOf).filter((v) => v != null);
    const triggeredByCount = window.length >= 4 && answeredInWindow.filter((v) => v > t).length >= 2;
    const triggeredByTrend = answeredInWindow.length >= 3 && answeredInWindow[answeredInWindow.length - 1] - answeredInWindow[0] >= 2;
    if (!escalating && (triggeredByCount || triggeredByTrend)) {
      escalating = true;
      cleanStreak = 0;
    } else if (escalating) {
      const v = painOf(hist[i]);
      if (v == null) {
        // dismissed/unanswered — holds; neither clears nor extends
      } else if (v <= t) {
        cleanStreak++;
        if (cleanStreak >= 3) escalating = false;
      } else {
        cleanStreak = 0;
      }
    }
  }
  return escalating;
}

/* Gate 7 — duration. Trims the lowest-priority sets first (mirrors
   fitDayToTime's own heuristic: emphasis-level tiers first, floored
   per-group so a higher tier can't be cut to nothing while a lower one
   still has slack — see trimPriority/groupTrimFloors) rather than
   rejecting the whole plan. Shares those functions directly with
   fitDayToTime (Fix 1) rather than a second copy of the same ranking
   that could drift — a prescription doesn't carry a `.cat` of its own,
   so `exOf(p)` stands in for `ex` at every call. sessionRules.trimPriority
   is still not read here, same as fitDayToTime — see that function's
   comment. */
function gate7DurationTrim(prescriptions, sessionMin, focus, trimPriorityOrder) {
  const budget = Math.max(20, (sessionMin || 60) - 8) * 60;
  const items = prescriptions.map((p) => ({ ...p, sets: p.sets || 3 }));
  const exOf = (p) => EX_BY_ID[p.exerciseId];
  const shapeOf = (p) => ({ cat: (exOf(p) || {}).cat, sets: p.sets });
  // Point 4: same drop-time addition as fitDayToTime — a prescription
  // carries its own scheme/sets directly, so dropExtraSec/trimOneHardSet
  // work on it unchanged.
  const dur = (p) => p.sets * (40 + restFor(exOf(p)).sec) + dropExtraSec(p);
  const total = () => items.reduce((a, p) => a + dur(p), 0);
  const minSets = (p) => (isCompound(exOf(p)) ? 2 : 1);
  const floors = groupTrimFloors(items.map(shapeOf), focus, trimPriorityOrder);
  const groupOf = (p) => CAT_TO_GROUP[(exOf(p) || {}).cat];
  const groupTotal = (g) => items.reduce((a, p) => a + (groupOf(p) === g ? p.sets : 0), 0);
  let trimmedCount = 0;
  const dropped = [];
  let guard = 200;
  while (total() > budget && guard-- > 0) {
    let cands = items.filter((p) => {
      if (p.sets <= minSets(p)) return false;
      const g = groupOf(p);
      return !g || groupTotal(g) > (floors[g] ?? 0);
    });
    if (!cands.length) cands = items.filter((p) => p.sets > minSets(p));
    if (cands.length) {
      cands.sort((a, b) => trimPriority(shapeOf(a), focus, trimPriorityOrder) - trimPriority(shapeOf(b), focus, trimPriorityOrder) || items.indexOf(b) - items.indexOf(a));
      const idx = items.indexOf(cands[0]);
      items[idx] = trimOneHardSet(items[idx]);
      trimmedCount++;
      continue;
    }
    // Gate 13: maintain protected LAST for a full drop, not first — see
    // dropTierRank's comment. Must stay identical to fitDayToTime's own
    // drop-entirely sort (check-trim-priority.js asserts the two agree).
    const dropCands = items.filter((p) => !isCompound(exOf(p)));
    if (!dropCands.length) break;
    dropCands.sort((a, b) => dropTierRank(shapeOf(a), focus) - dropTierRank(shapeOf(b), focus) || items.indexOf(b) - items.indexOf(a));
    const idx = items.indexOf(dropCands[0]);
    dropped.push((exOf(items[idx]) || {}).name || items[idx].exerciseId);
    items.splice(idx, 1);
  }
  return { list: items, trimmedCount, dropped };
}

/* Gate 8 — deload overrides all prescriptions, unconditionally: ~60% sets
   (never below the same per-movement floor fitDayToTime uses), ~90% load.
   AMENDMENT (Task 2 commit 3, recorded in DEFERRED-TESTS.md): this used to
   be a function here that mutated a SURVIVING prescription's sets/load
   before storing it, baking deload scaling into data.plan.prescriptions
   at apply time. That was wrong once prescriptions actually render
   (Task 2): deload state can change AFTER a plan was applied (a deload
   week starting or ending doesn't re-trigger a paste), so a value frozen
   at apply time goes stale, and — worse — DayPage's own render-time
   deload scaling (its `isDeload` block) would then scale an
   already-scaled stored value a second time, silently compounding.
   Deload scaling is now render-time-only, applied uniformly to every
   entry resolveDayExercises produces (generator, bonus, AND
   prescription-reconciled alike) exactly once, by whichever caller
   already owns that job: DayPage's isDeload block for sets (unchanged —
   it already applied to every entry, this just means a reconciled entry
   is no exception), and recommend()'s ex.prescribedLoad branch for load
   (new — see the comment there). Stored prescriptions therefore always
   hold RAW values; see scripts/check-prescription-reconciliation.js's
   assertion that a stored prescription's load is never deload-scaled. */

/* Gate 6's default cap, absent a real sessionRules.weeklyGroupSetCaps
   override (Task 2 hasn't wired that up yet). MUSCLE_GROUPS[group].mav can
   be lower than what the CURRENT default program already prescribes for
   that group with zero focus adjustment (legs: mav=20 vs. the balanced
   template's own ~26) — a gate that rejects the app's own unprompted
   output trains the user to ignore rejections, so the default cap is never
   allowed to sit below that baseline.
   Known residual limitation, not fixed here: this removes the false
   rejection of the baseline itself, but a prescription that's meant to
   REPLACE an exercise the baseline already counts (rather than add to it)
   still gets evaluated as pure addition, since Task 4 has no concept of
   "this prescription supersedes that generator slot" — that reconciliation
   is Task 2's job once prescriptions actually wire into day generation. */
function defaultGroupCap(group, weeklyGroupSets) {
  const mav = (MUSCLE_GROUPS[group] && MUSCLE_GROUPS[group].mav) || 0;
  const baseline = (weeklyGroupSets && weeklyGroupSets[group]) || 0;
  return Math.max(mav, baseline);
}

/* Runs gates 1/1b/1c/1d/2-5 for a single prescription in order;
   short-circuits on the first outright rejection (everything in the 1
   family, plus 2 — 3/4/5 only ever modify-and-continue, never reject
   outright, so there's nothing to short-circuit past them). */
/* Point 6/7's fix, decision 3 (approved with change: always note, never
 * silent). A scheme's derived loads must never exceed the scheme's own
 * approved top load (value.load) — which has already passed gates
 * 3/4/5 by the time this runs. Two smuggling vectors closed: an absolute
 * backoffLoad exceeding the top (never validated by anything before
 * this), and a backoffLoadPct over 100% (mathematically bounded, but
 * makes the "backoff" heavier than the top set it's supposed to be
 * lighter than — not arithmetic drift, an author writing something
 * incoherent). dropPct >= 100% (zero or negative weight) gets the same
 * treatment. Clamp and note — never reject: this is arithmetic derived
 * from an already-approved number, not a fresh safety judgment, but per
 * decision 3 the clamp itself must always be visible, same as every
 * other modify-and-continue gate here. Runs LAST, after value.load has
 * settled through gates 3/4/5, so a pain-rule reduction or escalation
 * cap on the top load automatically cascades to the derived numbers. */
function clampSchemeToTopLoad(value) {
  const scheme = value.scheme;
  if (!scheme) return { value, note: null };
  // backoffLoadPct/dropPct > 100 is incoherent regardless of whether an
  // explicit top `load` was even prescribed — "80% of whatever the top
  // ends up being" (load omitted, recommend() drives it) is just as
  // nonsensical at 150% as an absolute backoffLoad exceeding a KNOWN top.
  // Found while building the end-to-end verification for this round:
  // the original version only ran this whole function when value.load !=
  // null, which meant a scheme attached to a load-omitted prescription
  // (spec: omitting load means "let recommend() drive it") skipped this
  // clamp ENTIRELY — the exact smuggling vector point 6 exists to close,
  // just reachable through a different door. The one check that
  // genuinely needs a known top number — an ABSOLUTE backoffLoad
  // exceeding it — is the only piece still gated on value.load != null;
  // there's nothing concrete to compare an absolute number against
  // otherwise (buildSegmentRows resolves that relative to whatever
  // recommend() decides at render time instead, visible to the user
  // before they save).
  if (scheme.type === "backoff") {
    const notes = [];
    let pct = scheme.backoffLoadPct;
    if (pct != null && pct > 100) { notes.push(`backoffLoadPct ${pct}% is heavier than the top set — clamped to 100%`); pct = 100; }
    let load = scheme.backoffLoad;
    if (value.load != null && load != null && load > value.load) {
      const fallback = round5(value.load * ((pct ?? 80) / 100));
      notes.push(`backoffLoad ${load} lb is heavier than the ${value.load} lb top set — replaced with ${fallback} lb`);
      load = fallback;
    }
    if (!notes.length) return { value, note: null };
    const newScheme = { ...scheme };
    if (pct !== scheme.backoffLoadPct) newScheme.backoffLoadPct = pct;
    if (load !== scheme.backoffLoad) newScheme.backoffLoad = load;
    return { value: { ...value, scheme: newScheme }, note: notes.join("; ") };
  }
  if (scheme.type === "drop" && scheme.dropPct != null && scheme.dropPct >= 100) {
    return {
      value: { ...value, scheme: { ...scheme, dropPct: 50 } },
      note: `dropPct ${scheme.dropPct}% would mean zero or negative weight on the drop segment — clamped to 50%`,
    };
  }
  return { value, note: null };
}

function runPrescriptionGates(prescription, ctx) {
  const g1 = gate1UnknownId(prescription);
  if (g1.reject) return { accepted: false, gate: g1.gate, reason: g1.reason };

  const g1b = gate1bCheckinScope(prescription, ctx);
  if (g1b.reject) return { accepted: false, gate: g1b.gate, reason: g1b.reason };

  const g1c = gate1cDayKey(prescription, ctx);
  if (g1c.reject) return { accepted: false, gate: g1c.gate, reason: g1c.reason };

  const g1d = gate1dAmbiguousMatch(prescription, ctx);
  if (g1d.reject) return { accepted: false, gate: g1d.gate, reason: g1d.reason };

  const g1e = gate1eSchemeConsistency(prescription);
  if (g1e.reject) return { accepted: false, gate: g1e.gate, reason: g1e.reason };

  const g2 = gate2Injury(prescription, ctx);
  if (g2.reject) return { accepted: false, gate: g2.gate, reason: g2.reason };

  let value = prescription;
  const notes = [];

  const g3 = gate3LoadSanity(value, ctx);
  if (g3.value) value = g3.value;
  if (g3.note) notes.push({ gate: 3, note: g3.note });

  const g4 = gate4PainRule(value, ctx);
  if (g4.value) value = g4.value;
  if (g4.note) notes.push({ gate: 4, note: g4.note });

  const g5 = gate5PainEscalation(value, ctx);
  if (g5.value) value = g5.value;
  if (g5.note) notes.push({ gate: 5, note: g5.note });

  const clamped = clampSchemeToTopLoad(value);
  value = clamped.value;
  if (clamped.note) notes.push({ gate: "scheme", note: clamped.note });

  return { accepted: true, value, notes };
}

/* Batch entry point: gates 1-5 per prescription, then 6 (volume, needs a
   running tally across the batch), then 7 (duration, needs the whole
   survivor set), then 8 (deload, overrides everything that's left). This
   is the one place that knows about a LIST of prescriptions — the gates
   themselves stay single-item and caller-agnostic. */
function applyGatedPrescriptions(prescriptions, ctx) {
  const rejections = [];
  const notes = [];
  const runningGroupSets = { ...(ctx.weeklyGroupSets || {}) };
  const survivors = [];
  // Within-batch collision guard (Task 2 commit 3): two prescriptions in
  // the SAME paste naming the same (dayKey, exerciseId) pair would each
  // independently subtract the same baseline slot's sets below — first
  // one subtracts correctly, second one subtracts again from an already-
  // adjusted tally. Deterministic first-wins by array order (the order
  // `prescriptions` arrives in) — the first claims the slot, every later
  // one targeting the same pair is rejected, naming which one was kept.
  const claimed = new Map(); // "dayKey::exerciseId" -> the exerciseId's display name

  prescriptions.forEach((p) => {
    const result = runPrescriptionGates(p, ctx);
    if (!result.accepted) {
      rejections.push({ exerciseId: p.exerciseId, gate: result.gate, reason: result.reason });
      return;
    }
    const ex = EX_BY_ID[result.value.exerciseId];
    const key = `${result.value.dayKey}::${result.value.exerciseId}`;
    if (claimed.has(key)) {
      rejections.push({
        exerciseId: result.value.exerciseId, gate: 1,
        reason: `A prescription for "${ex.name}" on this day was already applied earlier in this same plan — the first one (in the order Claude's reply listed them) wins; this duplicate is dropped.`,
      });
      return;
    }
    const group = CAT_TO_GROUP[ex.cat];
    const addedSets = result.value.sets || 3;
    // Reconciliation-aware tally (Task 2 commit 3, closes the legs-cap
    // headroom gap from DEFERRED-TESTS.md's handoff note): ctx.
    // currentSlotFor is built from the exact same resolveDayExercises
    // this prescription will be spliced into at render time — one
    // predicate answers both "does this replace something" (render) and
    // "how much do I subtract before adding" (here), so they can't drift
    // apart. gate1dAmbiguousMatch already rejected the >1-match case
    // upstream, so this is always 0 (ADD) or 1 (REPLACE) here.
    const matches = ctx.currentSlotFor ? ctx.currentSlotFor(result.value.dayKey, result.value.exerciseId) : [];
    const isReplace = matches.length === 1;
    let current = (group && runningGroupSets[group]) || 0;
    if (isReplace && group) {
      current = Math.max(0, current - (matches[0].ex.sets || 0));
    }
    const cap = group ? ((ctx.weeklyGroupSetCaps && ctx.weeklyGroupSetCaps[group]) ?? defaultGroupCap(group, ctx.weeklyGroupSets)) : null;
    if (group && cap != null && current + addedSets > cap) {
      rejections.push({
        exerciseId: result.value.exerciseId, gate: 6,
        reason: `"${ex.name}" would push ${(MUSCLE_GROUPS[group] || {}).name || group} to ${current + addedSets} weekly sets, above the ${cap}-set cap.`,
      });
      return;
    }
    if (group) runningGroupSets[group] = current + addedSets;
    claimed.set(key, ex.name);
    (result.notes || []).forEach((n) => notes.push({ exerciseId: result.value.exerciseId, ...n }));
    notes.push({
      exerciseId: result.value.exerciseId, gate: "reconcile",
      note: isReplace ? `Replaces the existing "${ex.name}" on this day.` : `Adds "${ex.name}" as a new exercise on this day.`,
    });
    survivors.push(result.value);
  });

  const trimmed = gate7DurationTrim(survivors, ctx.sessionMin, ctx.focus, ctx.trimPriorityOrder);
  if (trimmed.trimmedCount > 0 || trimmed.dropped.length > 0) {
    notes.push({ gate: 7, note: `Fitted to your ${ctx.sessionMin || 60}-minute session: trimmed ${trimmed.trimmedCount} set${trimmed.trimmedCount !== 1 ? "s" : ""}${trimmed.dropped.length ? `, dropped ${trimmed.dropped.join(", ")}` : ""}.` });
  }

  // Gate 8: deload no longer mutates what's stored here — see the amended
  // comment above where gate8DeloadOverride used to be. Still worth
  // telling the user it's in effect; the actual scaling happens at render
  // time now (recommend()'s ex.prescribedLoad branch for load, DayPage's
  // isDeload block for sets), uniformly across every rendered entry.
  const final = trimmed.list;
  if (ctx.deloadActive) notes.push({ gate: 8, note: "Deload week active — sets and loads will be scaled down wherever this plan renders, regardless of what's prescribed here." });

  return { accepted: final, rejections, notes };
}

/* Assembles the read-only ctx every gate above operates over. Not itself
   gate logic — just packaging — so it isn't in
   scripts/check-write-isolation.js's discovery scan; nothing here decides
   accept/reject. */
function buildGateContext(data, plan) {
  const injuryProfile = deepFreeze(data.injuryProfile || DEFAULT_INJURY_PROFILE);
  const threshold = (injuryProfile.movementConstraints && injuryProfile.movementConstraints.painRule && injuryProfile.movementConstraints.painRule.threshold) ?? 3;
  // data.briefTier is set only by CoachCard's own Copy/Open actions when a
  // brief is generated — never read off the pasted plan text, so a pasted
  // plan can't self-declare "full" to escape checkin scoping (gate1b
  // above). Absent/unrecognized defaults to scoped (checkin is the
  // default tier and the more conservative assumption — same fail-safe
  // pattern as recoveringMode's migration default).
  const checkinScoped = data.briefTier !== "full";
  // Reconciliation lookups (Task 2 commit 3): both dayKey validity (Gate
  // 1c) and "does this exerciseId already exist on this day" (Gate 1d,
  // and the tally subtraction in applyGatedPrescriptions) need to agree
  // with what resolveDayExercises will actually splice this batch's
  // survivors into at render time — so both read through it directly
  // rather than re-deriving the day's contents their own way. Memoized
  // per dayKey: several prescriptions in one batch commonly target the
  // same day. Built from `data` as it stands BEFORE this batch is
  // applied — that's the correct "current baseline" Gate 6 compares
  // against; the batch's own survivors are added on top by
  // applyGatedPrescriptions as they're accepted, not visible here.
  const program = getProgram(data);
  const dayCache = {};
  const currentSlotFor = (dayKey, exerciseId) => {
    if (!dayKey) return [];
    if (!(dayKey in dayCache)) {
      const day = program.find((d) => d.id === dayKey);
      dayCache[dayKey] = day ? resolveDayExercises(day, data) : [];
    }
    return dayCache[dayKey].filter((entry) => entry.ex.id === exerciseId);
  };
  return {
    injuryProfile,
    sessions: data.sessions || [],
    weeklyGroupSets: weeklySetsByGroup(data),
    weeklyGroupSetCaps: (plan && plan.sessionRules && plan.sessionRules.weeklyGroupSetCaps) || {},
    // Task 6, Section 6 (pre-decision 4): Gate 7's own trim, wired the
    // same way fitDayToTime is — see trimPriorityOf's comment.
    trimPriorityOrder: (plan && plan.sessionRules && plan.sessionRules.trimPriority) || undefined,
    sessionMin: (plan && plan.sessionMin) || (data.plan && data.plan.sessionMin) || 60,
    // Gate 7's trim priority (Fix 1) needs the real focus levels, not just
    // sessionMin — same data.focus DayPage/fitDayToTime already read, so a
    // pasted plan trims by the same emphasis tiers a generator day would.
    focus: data.focus || DEFAULT_FOCUS,
    deloadActive: deloadActive(data),
    escalatingPatterns: new Set(PAIN_PATTERNS.filter((p) => isPainEscalating(data.sessions, p, threshold))),
    checkinScoped,
    checkinScopeIds: checkinScoped ? checkInExerciseIds(data) : null,
    programDayIds: new Set(program.map((d) => d.id)),
    currentSlotFor,
    // Task 6, Gates 9-13: the day-gate orchestrator needs the raw program
    // array itself (to find a dayKey's base template day for Gate 12/13's
    // comparisons) and the pre-this-plan `data` (to compute a day's OLD
    // per-group contribution for Gate 11's tally subtraction — the same
    // subtract-before-add shape Gate 6 already uses via currentSlotFor).
    program,
    data,
  };
}

/* ===== Gates 9-13 (Task 6, Section 2) =====
   Authored days (data.plan.days[]) are Claude designing a session
   directly, not overriding one generator slot — the highest-trust
   surface this app has, and the one Task 4's premise ("Claude proposes,
   the app disposes, and neither decides what is medically safe") most
   needs a full gate stack in front of.

   Day-level rejection, not per-exercise (BUILD-LOG.md's pre-flight
   note): the spec's partial-application requirement ("if one day fails
   validation, apply the others") is about DAYS, not exercises within a
   day. Gates 10-13 are day-level self-consistency checks that only mean
   anything against a day's COMPLETE exercise list — silently dropping
   one exercise from a coach-authored day would invalidate the coach's
   own self-reported totals (estimatedMin, weeklyGroupSets) and
   specialize coverage in ways the coach never intended. One bad
   exercise anywhere in a day fails that day's Gate 9, and a day that
   fails any gate 9-13 is simply absent from the accepted set — no
   partial exercise list is ever stored. resolveDayExercises then finds
   no override for that dayKey and falls through to the tested
   generator path — a known-safe fallback, never "no day at all". */

/* Gate 9 — every exerciseId in a day exists and passes Gates 1-8's
   per-item logic. Reuses gate1UnknownId / gate1bCheckinScope /
   gate1eSchemeConsistency / gate2Injury / gate3LoadSanity /
   gate4PainRule / gate5PainEscalation / clampSchemeToTopLoad VERBATIM —
   same functions runPrescriptionGates calls, no fork, asserted by
   scripts/check-authored-day-gates.js (every gate2Injury call site
   grepped). Skips gate1d (ambiguous match): that gate compares against
   the CURRENTLY RENDERED day via ctx.currentSlotFor — meaningless for a
   day being authored from scratch; a duplicate exerciseId WITHIN one
   authored day's own list is checked once, day-level, in
   applyAuthoredDays below, since it's a property of the day's own list,
   not a comparison against pre-existing state. Skips gate1c (dayKey
   validity): checked once per DAY below, not once per exercise — a
   day-level property. Adds one check neither gate1-8 nor the spec's own
   pseudocode has an equivalent for: `rationale` is required per the
   spec's own text ("Rationale required... an unexplained prescription
   is one you cannot audit") — a missing one is invalid input, same
   severity as an unknown id. */
function gate9AuthoredExercise(ae, dayKey, ctx) {
  if (!ae.rationale || !String(ae.rationale).trim()) {
    const ex = EX_BY_ID[ae.exerciseId];
    return { accepted: false, gate: 9, reason: `"${ex ? ex.name : ae.exerciseId}" has no rationale — every authored exercise must carry one (an unexplained prescription can't be audited).` };
  }
  const prescription = { ...ae, dayKey };
  const g1 = gate1UnknownId(prescription);
  if (g1.reject) return { accepted: false, gate: g1.gate, reason: g1.reason };
  const g1b = gate1bCheckinScope(prescription, ctx);
  if (g1b.reject) return { accepted: false, gate: g1b.gate, reason: g1b.reason };
  const g1e = gate1eSchemeConsistency(prescription);
  if (g1e.reject) return { accepted: false, gate: g1e.gate, reason: g1e.reason };
  const g2 = gate2Injury(prescription, ctx);
  if (g2.reject) return { accepted: false, gate: g2.gate, reason: g2.reason };
  let value = prescription;
  const notes = [];
  const g3 = gate3LoadSanity(value, ctx);
  if (g3.value) value = g3.value;
  if (g3.note) notes.push({ gate: 3, note: g3.note });
  const g4 = gate4PainRule(value, ctx);
  if (g4.value) value = g4.value;
  if (g4.note) notes.push({ gate: 4, note: g4.note });
  const g5 = gate5PainEscalation(value, ctx);
  if (g5.value) value = g5.value;
  if (g5.note) notes.push({ gate: 5, note: g5.note });
  const clamped = clampSchemeToTopLoad(value);
  value = clamped.value;
  if (clamped.note) notes.push({ gate: "scheme", note: clamped.note });
  return { accepted: true, value, notes };
}

/* Gate 10 — recomputed duration within 10% of the day's self-reported
   estimatedMin. estimateDurationSec is the exact formula fitDayToTime
   itself uses (shared, not a separate approximation) — "the model's own
   arithmetic is checked, not trusted" means checked against the app's
   real math, not a rough guess at it. No estimatedMin declared: nothing
   to verify against, passes (a day entry omitting it isn't claiming
   anything false). */
function gate10Duration(dayEntry, resolvedList) {
  if (dayEntry.estimatedMin == null) return { reject: false };
  const recomputedMin = Math.round(estimateDurationSec(resolvedList) / 60) + 8;
  const claimed = dayEntry.estimatedMin;
  const diffPct = claimed > 0 ? Math.abs(recomputedMin - claimed) / claimed : 1;
  if (diffPct > 0.1) {
    return { reject: true, gate: 10, reason: `"${dayEntry.label || dayEntry.dayKey}" claims estimatedMin ${claimed}, recomputed ${recomputedMin} — off by ${Math.round(diffPct * 100)}%, above the 10% tolerance.` };
  }
  return { reject: false };
}

/* Gate 11 — two checks: (a) the day's self-reported weeklyGroupSets is
   within 10% of what's actually in the authored list (same
   verify-don't-trust framing as Gate 10), and (b) this day's new
   per-group contribution, swapped in for whatever it contributed
   BEFORE (subtract old, add new — same shape Gate 6 already uses via
   ctx.currentSlotFor for prescriptions), stays under each group's cap.
   `oldContribution` comes from resolveDayExercises against ctx.data —
   the pre-this-plan state, i.e. the day as it renders today, generator
   path included (this dayKey has no data.plan.days entry yet at the
   point ctx was built). */
function gate11WeeklyGroupSets(dayEntry, resolvedList, templateDay, ctx) {
  const newContribution = {};
  resolvedList.forEach((ex) => {
    const g = CAT_TO_GROUP[ex.cat];
    if (g) newContribution[g] = (newContribution[g] || 0) + ex.sets;
  });
  if (dayEntry.weeklyGroupSets) {
    for (const g of Object.keys(dayEntry.weeklyGroupSets)) {
      const claimed = dayEntry.weeklyGroupSets[g];
      const recomputed = newContribution[g] || 0;
      const diffPct = claimed > 0 ? Math.abs(recomputed - claimed) / claimed : (recomputed > 0 ? 1 : 0);
      if (diffPct > 0.1) {
        return { reject: true, gate: 11, reason: `"${dayEntry.label || dayEntry.dayKey}" claims ${claimed} weekly sets for ${(MUSCLE_GROUPS[g] || {}).name || g}, recomputed ${recomputed} — off by ${Math.round(diffPct * 100)}%, above the 10% tolerance.` };
      }
    }
  }
  const oldList = templateDay ? resolveDayExercises(templateDay, ctx.data) : [];
  const oldContribution = {};
  oldList.forEach(({ ex }) => {
    const g = CAT_TO_GROUP[ex.cat];
    if (g) oldContribution[g] = (oldContribution[g] || 0) + ex.sets;
  });
  const groups = new Set([...Object.keys(newContribution), ...Object.keys(oldContribution)]);
  for (const g of groups) {
    const adjusted = (ctx.weeklyGroupSets[g] || 0) - (oldContribution[g] || 0) + (newContribution[g] || 0);
    const cap = ctx.weeklyGroupSetCaps[g] ?? defaultGroupCap(g, ctx.weeklyGroupSets);
    if (adjusted > cap) {
      return { reject: true, gate: 11, reason: `"${dayEntry.label || dayEntry.dayKey}" would push ${(MUSCLE_GROUPS[g] || {}).name || g} to ${adjusted} weekly sets, above the ${cap}-set cap.` };
    }
  }
  return { reject: false };
}

/* Gate 12 — a day must retain at least one exercise per group the
   TEMPLATE'S OWN base day for this dayKey already represents at
   specialize/emphasize focus. Compared against the template's base day,
   not "every specialize/emphasize group globally": a Push day under an
   upperFocus split was never going to train a specialized BACK muscle,
   so its absence there isn't a violation — only a group the day's own
   role already carries can be dropped out from under it. */
function gate12SpecializeCoverage(dayEntry, resolvedList, templateDay, focus) {
  if (!templateDay) return { reject: false };
  const templateGroups = new Set(templateDay.exercises.map((s) => CAT_TO_GROUP[(EX_BY_ID[s.id] || {}).cat]).filter(Boolean));
  const focusedTemplateGroups = [...templateGroups].filter((g) => ["specialize", "emphasize"].includes((focus && focus[g]) || "normal"));
  if (!focusedTemplateGroups.length) return { reject: false };
  const authoredGroups = new Set(resolvedList.map((ex) => CAT_TO_GROUP[ex.cat]).filter(Boolean));
  const missing = focusedTemplateGroups.filter((g) => !authoredGroups.has(g));
  if (missing.length) {
    const names = missing.map((g) => (MUSCLE_GROUPS[g] || {}).name || g).join(", ");
    return { reject: true, gate: 12, reason: `"${dayEntry.label || dayEntry.dayKey}" drops ${names} entirely — this day's own template trains it at ${missing.map((g) => (focus && focus[g]) || "normal").join("/")} focus; a specialized/emphasized group can't be omitted from the day that's supposed to carry it.` };
  }
  return { reject: false };
}

/* Gate 13 — maintain floor, per-movement (pre-decision 3;
   DEFERRED-TESTS.md row 9). A maintain-tier movement the template's own
   base day for this dayKey already includes cannot be dropped entirely
   by an authored day unless a pool-equivalent replacement is present —
   maintenance volume for a rehab-relevant movement (RDL, goblet squat,
   hip thrust, per the spec's own naming) is not a source of trimmable
   volume. Same "compare against the template's base day" shape as Gate
   12, and the same underlying idea the generator-side trim fix
   (dropTierRank, above) now enforces for the identical reason — one
   invariant, two enforcement points, not two different rules that could
   drift apart. */
function gate13MaintainFloor(dayEntry, resolvedList, templateDay, focus) {
  if (!templateDay) return { reject: false };
  const maintainBase = templateDay.exercises
    .map((s) => EX_BY_ID[s.id])
    .filter((ex) => ex && ((focus && focus[CAT_TO_GROUP[ex.cat]]) || "normal") === "maintain");
  if (!maintainBase.length) return { reject: false };
  const authoredPools = new Set(resolvedList.map((ex) => ex.pool));
  const missing = maintainBase.filter((ex) => !authoredPools.has(ex.pool));
  if (missing.length) {
    const names = missing.map((ex) => ex.name).join(", ");
    return { reject: true, gate: 13, reason: `"${dayEntry.label || dayEntry.dayKey}" drops ${names} (maintain-tier) with no pool-equivalent substitute — maintenance volume for a rehab-relevant movement can't be trimmed away entirely.` };
  }
  return { reject: false };
}

/* Batch entry point for data.plan.days — the Task 6 analogue of
   applyGatedPrescriptions. Runs Gate 9 per exercise (short-circuits the
   whole day on the first per-exercise reject), then resolves the
   gate-9-accepted (already load/pain-adjusted) exercises into real
   exercise shapes and runs gates 10-13 against the complete day. A
   checkin-tier plan (ctx.checkinScoped) rejects every day outright
   before Gate 9 even runs — day authorship is a full-tier feature (Task
   7, Section 7); nothing about scope-checking individual exercises
   would be meaningful if the day itself shouldn't have been proposed at
   this tier at all. */
function applyAuthoredDays(days, ctx) {
  const accepted = [];
  const rejections = [];
  const notes = [];
  (days || []).forEach((dayEntry) => {
    if (ctx.checkinScoped) {
      rejections.push({ dayKey: dayEntry.dayKey, gate: "days", reason: `"${dayEntry.label || dayEntry.dayKey || "(day)"}" was dropped — full day authorship requires a full-tier brief; this plan was generated at check-in scope.` });
      return;
    }
    if (!dayEntry.dayKey || !ctx.programDayIds.has(dayEntry.dayKey)) {
      rejections.push({ dayKey: dayEntry.dayKey, gate: 9, reason: `"${dayEntry.dayKey || "(missing dayKey)"}" isn't a day in your current template — valid days are: ${[...ctx.programDayIds].join(", ")}.` });
      return;
    }
    if (!Array.isArray(dayEntry.exercises) || !dayEntry.exercises.length) {
      rejections.push({ dayKey: dayEntry.dayKey, gate: 9, reason: `"${dayEntry.label || dayEntry.dayKey}" has no exercises.` });
      return;
    }
    const seenIds = new Set();
    const dupId = dayEntry.exercises.map((ae) => ae.exerciseId).find((id) => (seenIds.has(id) ? true : (seenIds.add(id), false)));
    if (dupId) {
      rejections.push({ dayKey: dayEntry.dayKey, gate: 9, reason: `"${dayEntry.label || dayEntry.dayKey}" lists "${(EX_BY_ID[dupId] || {}).name || dupId}" more than once — can't tell which entry is authoritative.` });
      return;
    }

    const gatedExercises = [];
    let dayRejectReason = null;
    for (const ae of dayEntry.exercises) {
      const result = gate9AuthoredExercise(ae, dayEntry.dayKey, ctx);
      if (!result.accepted) {
        dayRejectReason = `"${dayEntry.label || dayEntry.dayKey}" rejected — ${result.reason}`;
        break;
      }
      gatedExercises.push(result.value);
      (result.notes || []).forEach((n) => notes.push({ dayKey: dayEntry.dayKey, exerciseId: ae.exerciseId, ...n }));
    }
    if (dayRejectReason) {
      rejections.push({ dayKey: dayEntry.dayKey, gate: 9, reason: dayRejectReason });
      return;
    }

    // Real exercise shapes for gates 10-13 (and for what's actually
    // stored/rendered) — same fields resolveAuthoredExercise produces,
    // built directly here since these are gate-9-MODIFIED values
    // (post load/pain adjustment), not the raw pasted entries.
    const resolvedList = gatedExercises
      .map((ge) => {
        const base = EX_BY_ID[ge.exerciseId];
        return {
          ...base, sets: ge.sets, repMin: ge.repMin ?? base.repMin, repMax: ge.repMax ?? base.repMax,
          restSec: ge.restSec, prescribedLoad: ge.load, scheme: ge.scheme,
        };
      })
      .map((ex) => ({ ...ex, sets: hardSetsFor(ex) }));

    const templateDay = ctx.program.find((d) => d.id === dayEntry.dayKey);

    const g10 = gate10Duration(dayEntry, resolvedList);
    if (g10.reject) { rejections.push({ dayKey: dayEntry.dayKey, gate: 10, reason: g10.reason }); return; }

    const g11 = gate11WeeklyGroupSets(dayEntry, resolvedList, templateDay, ctx);
    if (g11.reject) { rejections.push({ dayKey: dayEntry.dayKey, gate: 11, reason: g11.reason }); return; }

    const g12 = gate12SpecializeCoverage(dayEntry, resolvedList, templateDay, ctx.focus);
    if (g12.reject) { rejections.push({ dayKey: dayEntry.dayKey, gate: 12, reason: g12.reason }); return; }

    const g13 = gate13MaintainFloor(dayEntry, resolvedList, templateDay, ctx.focus);
    if (g13.reject) { rejections.push({ dayKey: dayEntry.dayKey, gate: 13, reason: g13.reason }); return; }

    accepted.push({ ...dayEntry, exercises: gatedExercises });
    notes.push({ dayKey: dayEntry.dayKey, gate: "days", note: `"${dayEntry.label || dayEntry.dayKey}" authored and accepted.` });
  });
  return { accepted, rejections, notes };
}

/* ===== Task 6, Section 3: diff, versioning, revert =====
   "Never auto-apply an authored plan" — diffAuthoredDay/diffAuthoredPlan
   are pure and side-effect-free specifically so the diff can be computed
   for PREVIEW without persisting anything; the mandatory confirm step
   this exists for would be meaningless if computing the diff itself
   changed data. Diffs the day's CURRENT rendered exercise list (whatever
   resolveDayExercises produces against `data` as it stands right now —
   generator, or a previously-authored day, whichever currently applies)
   against the NEWLY gated exercise list for the same dayKey. */
function diffAuthoredDay(dayKey, newExercises, data) {
  const program = getProgram(data);
  const templateDay = program.find((d) => d.id === dayKey);
  const currentList = templateDay ? resolveDayExercises(templateDay, data).map((e) => e.ex) : [];
  const currentById = new Map(currentList.map((ex, i) => [ex.id, { ex, order: i }]));
  const newIds = new Set(newExercises.map((ne) => ne.exerciseId));
  const added = [], changed = [], reordered = [];
  newExercises.forEach((ne, i) => {
    const name = (EX_BY_ID[ne.exerciseId] || {}).name || ne.exerciseId;
    const prev = currentById.get(ne.exerciseId);
    if (!prev) { added.push({ exerciseId: ne.exerciseId, name, sets: ne.sets, load: ne.load ?? null, rationale: ne.rationale }); return; }
    const fromLoad = prev.ex.prescribedLoad ?? null;
    const toLoad = ne.load ?? null;
    if (prev.ex.sets !== ne.sets || fromLoad !== toLoad) {
      changed.push({ exerciseId: ne.exerciseId, name, fromSets: prev.ex.sets, toSets: ne.sets, fromLoad, toLoad });
    }
    if (prev.order !== i) reordered.push({ exerciseId: ne.exerciseId, name, fromOrder: prev.order, toOrder: i });
  });
  const removed = currentList.filter((ex) => !newIds.has(ex.id)).map((ex) => ({ exerciseId: ex.id, name: ex.name }));
  return { added, removed, changed, reordered };
}
function diffAuthoredPlan(days, data) {
  return (days || []).map((d) => ({ dayKey: d.dayKey, label: d.label || d.dayKey, diff: diffAuthoredDay(d.dayKey, d.exercises, data) }));
}

/* Immutable, append-only plan version history. Every applied plan —
   days-authored or the legacy four-field/prescriptions shape alike —
   gets a new record; nothing already written is ever mutated. `plan` is
   the FULL applied snapshot (everything data.plan carries), not a diff —
   a revert needs to restore the whole thing, not reconstruct it. Capped
   at the last 25, same bounded-history pattern injuryProfileHistory
   already uses (there at 50) so this doesn't grow unbounded in
   localStorage forever. */
function pushPlanVersion(data, plan, brief, source, revertedFrom) {
  const entry = { id: `${Date.now()}_${Math.random().toString(36).slice(2, 8)}`, at: new Date().toISOString(), brief: brief || null, plan, source: source || "paste" };
  if (revertedFrom) entry.revertedFrom = revertedFrom;
  return [...(data.planVersions || []), entry].slice(-25);
}


/* Task 3, logger UI round. Every row this produces gets an EXPLICIT
   segment — "top" for a plain/no-scheme exercise too, not omitted —
   simpler than two representations of the same thing floating around,
   and harmless: every exclusion predicate in this file already treats
   "top" and undefined identically. Only "backoff" and "drop" are ever
   distinguished; there is no third stored value, "straight" stays a
   SCHEME type (ex.scheme.type), never a row's own segment tag, since
   nothing anywhere needs to tell "top" and "straight" apart on a row.
   Pure and testable on its own — no React, no persist — so the pre-fill
   logic itself is covered the same way everything else in this build is. */
function buildSegmentRows(ex, rec) {
  const topWeight = (w) => (w === 0 ? "" : String(w));
  const scheme = ex.scheme;
  // round5's floor of 5 makes sense for a real load, not for "80% of
  // bodyweight" — a pure-bodyweight top (rec.weight === 0) stays 0 for
  // every segment rather than manufacturing a nonsensical "5 lb".
  if (scheme && scheme.type === "backoff") {
    const backoffLoad = rec.weight === 0 ? 0 : scheme.backoffLoad ?? round5(rec.weight * ((scheme.backoffLoadPct ?? 80) / 100));
    const rows = [];
    for (let i = 0; i < (scheme.topSets || 0); i++) rows.push({ w: topWeight(rec.weight), r: "", segment: "top" });
    for (let i = 0; i < (scheme.backoffSets || 0); i++) rows.push({ w: topWeight(backoffLoad), r: "", segment: "backoff" });
    return rows;
  }
  if (scheme && scheme.type === "drop") {
    const dropWeight = rec.weight === 0 ? 0 : round5(rec.weight * (1 - (scheme.dropPct ?? 20) / 100));
    const total = ex.sets || 0;
    const rows = [];
    for (let i = 0; i < total; i++) {
      rows.push({ w: topWeight(rec.weight), r: "", segment: "top" });
      const isLast = i === total - 1;
      if (scheme.appliesTo === "allSets" || isLast) {
        for (let d = 0; d < (scheme.drops || 1); d++) rows.push({ w: topWeight(dropWeight), r: "", segment: "drop" });
      }
    }
    return rows;
  }
  return Array.from({ length: ex.sets || 0 }, () => ({ w: topWeight(rec.weight), r: "", segment: "top" }));
}

/* Requirement 3, matching the spec's own example exactly: "2 x 15 @ 12.5
   lb, then 2 x 15 @ 10 lb" — no parenthetical segment label. The
   "then"-separated grouping plus the differing numbers already convey the
   structure; scannable on a phone mid-workout means fewer words, not
   more. Groups CONSECUTIVE same-segment rows (order preserved — a
   scheme's segments are always contiguous by construction, but this
   doesn't assume it, it just groups whatever's actually there). Real
   logged data isn't always perfectly uniform within a group (fatigue, a
   missed rep) — falls back to a slash-joined list for weight or reps
   that differ within one group rather than silently picking one number
   and hiding the rest. The unscemed case reads exactly as it always did:
   "3 x 8 @ 95 lb", one group, no "then". */
function formatSchemeSets(sets) {
  if (!sets || !sets.length) return "";
  const groups = [];
  sets.forEach((s) => {
    const seg = s.segment === "backoff" || s.segment === "drop" ? s.segment : "top";
    const last = groups[groups.length - 1];
    if (last && last.segment === seg) last.rows.push(s); else groups.push({ segment: seg, rows: [s] });
  });
  const joinVaried = (vals) => {
    const uniq = [...new Set(vals)];
    return uniq.length === 1 ? String(uniq[0]) : vals.join("/");
  };
  return groups.map((g) => {
    const wLabel = joinVaried(g.rows.map((r) => r.w || "BW"));
    const rLabel = joinVaried(g.rows.map((r) => r.r));
    return `${g.rows.length} × ${rLabel} @ ${wLabel} lb`;
  }).join(", then ");
}

function formatRestSeconds(sec) {
  if (sec < 60) return `${sec} s`;
  const min = sec / 60;
  return `${Number.isInteger(min) ? min : min.toFixed(1)} min`;
}

/* Rest recommendations: heavier compounds recover better with 2–3 min
   (rest-interval literature favors >=2 min for hypertrophy on big lifts);
   isolation work is productive at 60–90 s. ex.restSec (a gated
   prescription's own restSec, reconciled onto the exercise by
   resolveDayExercises — Task 2) overrides the category default: a coach
   explicitly dialing in rest is a deliberate choice, not a generic
   fallback, and this is the one function both the display text and the
   duration/trim math (fitDayToTime, gate7DurationTrim, dayDurationMin)
   read rest from — overriding here is what makes a prescribed restSec
   visible AND correctly estimated everywhere, not just one of the two. */
function restFor(ex) {
  if (ex.restSec != null) return { sec: ex.restSec, label: formatRestSeconds(ex.restSec) };
  if (["squat", "hinge", "glute"].includes(ex.cat)) return { sec: 180, label: "2–3 min" };
  if (["hpress", "vpress", "hpull", "vpull"].includes(ex.cat)) return { sec: 120, label: "~2 min" };
  return { sec: 90, label: "60–90 s" };
}

function dayDurationMin(day, swaps, focus) {
  let total = 0;
  day.exercises.forEach((slot) => {
    const ex = resolveSlot(slot, swaps, focus);
    total += ex.sets * (40 + restFor(ex).sec);
  });
  return Math.round(total / 60 / 5) * 5;
}

/* Nutrition math: Mifflin-St Jeor BMR + additive activity model
   (base occupational multiplier + step count + training sessions). */
function computeNutrition(n, latestBw) {
  const lbs = latestBw || 146;
  const kg = lbs / 2.2046;
  const cm = (Number(n.heightIn) || 67) * 2.54;
  const age = Number(n.age) || 35;
  const bmr = Math.round(10 * kg + 6.25 * cm - 5 * age + (n.sex === "female" ? -161 : 5));
  const baseMult = n.deskJob ? 1.1 : 1.28;
  const stepsKcal = (Number(n.steps) || 0) * 0.045 * (lbs / 150);
  const trainKcal = ((Number(n.workouts) || 0) * 300) / 7;
  const tdee = Math.round(bmr * baseMult + stepsKcal + trainKcal);
  const target = Math.round((tdee - 350) / 10) * 10;
  return { lbs, bmr, tdee, target, stepsKcal: Math.round(stepsKcal), trainKcal: Math.round(trainKcal) };
}
