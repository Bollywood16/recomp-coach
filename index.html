/* ============================ APP ============================ */

function App() {
  const [tab, setTab] = useState("today");
  const [data, setData] = useState({ ...DEFAULT_DATA, focus: DEFAULT_FOCUS, plan: DEFAULT_PLAN, phase: {}, injuryProfile: DEFAULT_INJURY_PROFILE });
  const [loaded, setLoaded] = useState(false);
  const [sbUser, setSbUser] = useState(null);
  const [syncStatus, setSyncStatus] = useState("");

  useEffect(() => {
    (async () => {
      let found = null;
      try {
        const res = await window.storage.get(STORAGE_KEY);
        if (res && res.value) found = JSON.parse(res.value);
      } catch (e) { /* no v2 data yet */ }
      if (!found) {
        try {
          const old = await window.storage.get(OLD_KEY);
          if (old && old.value) found = JSON.parse(old.value); // migrate v1 logs
        } catch (e) { /* no v1 data either */ }
      }
      if (found) {
        // goalProfile.injuryRecovery -> injuryProfile.recoveringMode fail-safe,
        // the one-time migration notice, and the goblet -> boxsquat session
        // rename all live in migrateInjuryAndGobletData — shared with
        // BackupCard's import path, see that function's comment. `existing`
        // is null here: nothing is loaded yet for this record to fall back
        // onto.
        const migration = migrateInjuryAndGobletData(found, null);
        const stamped = {
          ...DEFAULT_DATA, ...found,
          sessions: migration.sessions,
          swaps: found.swaps || {},
          nutrition: { ...DEFAULT_NUTRITION, ...(found.nutrition || {}) },
          focus: { ...DEFAULT_FOCUS, ...(found.focus || {}) },
          plan: { ...DEFAULT_PLAN, ...(found.plan || {}) },
          phase: found.phase || {},
          injuryProfile: migration.injuryProfile,
          injuryProfileHistory: migration.injuryProfileHistory,
          injuryProfileMigration: migration.injuryProfileMigration,
          gobletBoxSquatMigration: migration.gobletBoxSquatMigration,
        };
        setData(stamped);
        // Persist either migration immediately — neither should depend on the
        // user happening to trigger some other write before becoming durable.
        if (migration.migrated) {
          try { await window.storage.set(STORAGE_KEY, JSON.stringify({ ...stamped, _updatedAt: new Date().toISOString() })); } catch (e) { /* saved in memory at least */ }
        }
      }
      setLoaded(true);
    })();
  }, []);

  const persist = async (next) => {
    const stamped = { ...next, _updatedAt: new Date().toISOString() };
    setData(stamped);
    try {
      await window.storage.set(STORAGE_KEY, JSON.stringify(stamped));
    } catch (e) {
      console.error("Save failed", e);
    }
    const client = getSbClient();
    if (client && sbUser) {
      if (_pushTimer) clearTimeout(_pushTimer);
      _pushTimer = setTimeout(async () => {
        try {
          setSyncStatus("Syncing…");
          const merged = await safeCloudSync(client, sbUser.id, stamped);
          // If the cloud held sessions this device didn't (fresh/evicted
          // container), adopt the merged copy locally too.
          if ((merged.sessions || []).length > (stamped.sessions || []).length) {
            setData(merged);
            try { await window.storage.set(STORAGE_KEY, JSON.stringify(merged)); } catch (e2) {}
          }
          setSyncStatus("Synced");
          setTimeout(() => setSyncStatus(""), 1500);
        } catch (e) {
          setSyncStatus("Sync failed — saved locally");
        }
      }, 1200);
    }
  };

  // Pull + merge cloud data on login; expose a manual sign-in handler to SyncCard.
  const onSignedIn = async (user) => {
    setSbUser(user);
    const client = getSbClient();
    if (!client || !user) return;
    try {
      setSyncStatus("Syncing…");
      // Read freshest local state directly from storage to avoid stale-closure
      // pushes from a component that mounted before local data finished loading.
      let localNow = data;
      try {
        const r = await window.storage.get(STORAGE_KEY);
        if (r && r.value) localNow = JSON.parse(r.value);
      } catch (e2) { /* keep in-memory state */ }
      const merged = await safeCloudSync(client, user.id, localNow);
      setData(merged);
      await window.storage.set(STORAGE_KEY, JSON.stringify(merged));
      setSyncStatus("Synced");
      setTimeout(() => setSyncStatus(""), 1500);
    } catch (e) {
      setSyncStatus("Sync failed — saved locally");
    }
  };
  const onSignedOut = () => { setSbUser(null); setSyncStatus(""); };

  // Restore an existing Supabase session on load (keeps you logged in).
  useEffect(() => {
    const client = getSbClient();
    if (!client) return;
    client.auth.getSession().then(({ data: d }) => {
      if (d && d.session && d.session.user) onSignedIn(d.session.user);
    });
    const { data: sub } = client.auth.onAuthStateChange((_e, session) => {
      if (session && session.user) setSbUser(session.user); else setSbUser(null);
    });
    return () => { if (sub && sub.subscription) sub.subscription.unsubscribe(); };
  }, [loaded]); // eslint-disable-line

  return (
    <div style={S.app}>
      {tab === "today" && <WorkoutFlow data={data} persist={persist} />}
      {tab === "log" && <Log data={data} persist={persist} loaded={loaded} sbUser={sbUser} syncStatus={syncStatus} onSignedIn={onSignedIn} onSignedOut={onSignedOut} />}
      {tab === "progress" && <Progress data={data} />}
      {tab === "insights" && <Insights data={data} persist={persist} />}
      {tab === "fuel" && <Fuel data={data} persist={persist} />}
      {tab === "focus" && <Focus data={data} persist={persist} />}

      <nav style={S.tabBar}>
        <TabBtn icon={Dumbbell} label="Workout" id="today" tab={tab} setTab={setTab} />
        <TabBtn icon={ClipboardList} label="Log" id="log" tab={tab} setTab={setTab} />
        <TabBtn icon={TrendingUp} label="Progress" id="progress" tab={tab} setTab={setTab} />
        <TabBtn icon={Target} label="Focus" id="focus" tab={tab} setTab={setTab} />
        <TabBtn icon={Sparkles} label="Insights" id="insights" tab={tab} setTab={setTab} />
        <TabBtn icon={Flame} label="Fuel" id="fuel" tab={tab} setTab={setTab} />
      </nav>
    </div>
  );
}

/* Summary of Focus effects on a given day: which muscles are emphasized here,
   how many sets were added vs base, and how many bonus lifts were injected. */
function dayFocusSummary(day, data) {
  let added = 0, bonusCount = 0;
  const groups = new Set();
  resolveDayExercises(day, data).forEach(({ ex }) => {
    const g = CAT_TO_GROUP[ex.cat];
    if (ex.isBonus) {
      bonusCount++;
      if (g) groups.add(MUSCLE_GROUPS[g]?.name);
      return;
    }
    const delta = (ex.sets || 0) - (ex.baseSets || ex.sets || 0);
    if (delta > 0 && g) { added += delta; groups.add(MUSCLE_GROUPS[g]?.name); }
    if (delta < 0 && g) { groups.add(MUSCLE_GROUPS[g]?.name); }
  });
  return { added, bonusCount, groups: [...groups] };
}

function ExerciseCard({ slot, ex, data, persist, open, onToggle, done }) {
  const rec = recommend(ex, data.sessions, deloadActive(data));
  const rest = restFor(ex);
  const [sets, setSets] = useState(null);
  const [swapMode, setSwapMode] = useState(false);
  const [timer, setTimer] = useState(null);
  const [flash, setFlash] = useState(false);
  const [assist, setAssist] = useState(true); // for assistable lifts: enter machine assist
  const [pain, setPain] = useState("");
  const bw = currentBodyweight(data);
  const injuryProfile = data.injuryProfile || DEFAULT_INJURY_PROFILE;
  // Fix 3 — Gate 2, run in WARN mode against the exercise currently
  // rendered (post-swap). Same gate2Injury call the reject path uses; see
  // its comment for why this never blocks the card or reverts the swap.
  const contraGate = gate2Injury({ exerciseId: ex.id }, { injuryProfile });

  useEffect(() => {
    if (timer === null || timer <= 0) return;
    const t = setTimeout(() => setTimer(timer - 1), 1000);
    return () => clearTimeout(t);
  }, [timer]);

  // Prefill the form with the recommended weight when opened — one row
  // per totalSegmentsFor(ex), each pre-loaded with its own segment's
  // default weight (top/backoff/drop), not a flat ex.sets copies of the
  // same number (point 1 of this round).
  useEffect(() => {
    if (open && sets === null) {
      setSets(buildSegmentRows(ex, rec));
    }
    if (!open) { setSets(null); setSwapMode(false); setTimer(null); setPain(""); }
  }, [open]); // eslint-disable-line

  const hasNonTrivialScheme = ex.scheme && ex.scheme.type !== "straight";

  const saveSession = () => {
    const assistMode = ex.assistable && assist;
    // Point 2: each row's segment rides straight through to the stored
    // row. Point 4 (Addition B): the existing r>0 filter already drops
    // any row nobody filled in — a pre-filled drop/backoff segment the
    // user skipped just never gets persisted, not saved as a phantom
    // zero-rep row. That's unchanged; segment tagging doesn't touch it.
    const clean = (sets || [])
      .map((s) => {
        const raw = Number(s.w) || 0;
        const r = Number(s.r) || 0;
        const segment = s.segment || "top";
        if (assistMode) {
          // Entered value is machine assistance; store what was actually lifted.
          const eff = Math.max(1, Math.round(bw - raw));
          return { w: eff, r, assist: raw, bw, segment };
        }
        return { w: raw, r, segment };
      })
      .filter((s) => s.r > 0);
    if (clean.length === 0) return;
    // Delayed-onset pain (painRetro) is asked for separately, across all lifts,
    // by PendingPainRetroPrompts — not gated on reopening this specific
    // exercise, which on a ~7-day split would close the window long before
    // the user ever comes back to it. See findAllPendingPainRetros.
    const session = {
      id: Date.now(), date: todayISO(), exerciseId: ex.id, sets: clean,
      pain: pain === "" ? null : Math.max(0, Math.min(10, Number(pain) || 0)),
      painRetro: null, painRetroAt: null, painRetroDismissed: false,
    };
    persist({ ...data, sessions: [...data.sessions, session] });
    setFlash(true);
    setTimeout(() => { setFlash(false); onToggle(); }, 900);
  };

  const setSwap = (newExId) => {
    const swaps = { ...data.swaps };
    if (newExId) swaps[slot.id] = newExId; else delete swaps[slot.id];
    persist({ ...data, swaps });
    setSwapMode(false);
    setSets(null); // re-prefill with the new exercise's recommendation
  };

  const alternates = [
    ...(ex.swapped ? [{ ...slot, isOriginal: true }] : []),
    ...ALL_KNOWN.filter((a) => a.cat === slot.cat && a.id !== ex.id && a.id !== slot.id)
      .sort((a, b) => (a.rank || 4) - (b.rank || 4)),
  ];

  const tagStyle =
    rec.tag === "Add weight" ? S.tag("#E8F8EE", C.green)
    : rec.tag === "Hold" ? S.tag("#FFF1E5", C.orange)
    : rec.tag === "Start" || rec.tag === "Estimated" ? S.tag("#EAF3FF", C.blue)
    : S.tag("#F0F0F3", C.sub);

  const mmss = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  const setDelta = (ex.sets || 0) - (ex.baseSets || ex.sets || 0);
  const isBonus = !!slot.isBonus;
  const lastSess = lastSessionFor(data.sessions || [], ex.id);

  return (
    <div style={{ ...S.card, borderLeft: done ? `4px solid ${C.green}` : "none" }}>
      {/* Collapsed header — always visible, tap to open/close */}
      <button
        onClick={onToggle}
        style={{ ...font, display: "flex", justifyContent: "space-between", alignItems: "center", width: "100%", background: "transparent", border: "none", cursor: "pointer", textAlign: "left", padding: 0 }}
      >
        <div>
          <div style={{ fontSize: 16, fontWeight: 700, color: C.text, display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>
            <span>{done && <span style={{ color: C.green }}>✓ </span>}{ex.name}</span>
            {isBonus && <span style={S.tag("#EAF3FF", C.blue)}>Focus bonus</span>}
            {!isBonus && setDelta > 0 && <span style={S.tag("#E8F8EE", C.green)}>+{setDelta} set{setDelta > 1 ? "s" : ""}</span>}
            {!isBonus && setDelta < 0 && <span style={S.tag("#F0F0F3", C.sub)}>maintain</span>}
            {/* Fix 3, point (b): visible collapsed too, every time this
                card appears in the day — not only after opening it. */}
            {contraGate.reject && <span style={S.tag("#FDECEC", C.red)}>⚠ Contraindicated</span>}
          </div>
          <div style={{ color: C.sub, fontSize: 13, marginTop: 3 }}>
            {ex.sets} × {ex.repMin}–{ex.repMax} at {rec.weight === 0 ? "BW" : `${rec.weight} lb${ex.perHand ? "/hand" : ""}`} · rest {rest.label}
          </div>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <span style={tagStyle}>{rec.tag}</span>
          <ChevronRight size={18} color={C.sub} style={{ transform: open ? "rotate(90deg)" : "none", transition: "transform .15s" }} />
        </div>
      </button>

      {open && (
        <div style={{ marginTop: 14, borderTop: `1px solid ${C.line}`, paddingTop: 14 }}>
          <div style={{ color: C.sub, fontSize: 13, lineHeight: 1.45, marginBottom: 10 }}>{rec.note}</div>

          {/* Fix 3, point (b): persistent, not a one-time dismissible
              notice — renders every time this card is opened for as long
              as the contraindication is active, same pattern as
              ClinicianReviewNotice / PainEscalationNotice. Point (c):
              informational only, no action buttons here — nothing removes
              or changes the swap. */}
          {contraGate.reject && (() => {
            const note = contraindicationSourceNote(ex, "long");
            return (
              <div style={{ ...S.card, background: "#FDECEC", display: "flex", gap: 10, alignItems: "flex-start", margin: "0 0 12px" }}>
                <Flame size={18} color={C.red} style={{ marginTop: 1, flexShrink: 0 }} />
                <div style={{ fontSize: 12.5, color: "#3A3A3C", lineHeight: 1.45 }}>
                  <b style={{ color: C.red }}>Contraindicated while recovering:</b> {contraGate.reason}
                  {note ? ` This flag is ${note}.` : ""}
                  {" "}It won't be swapped or removed automatically — change it yourself under Swap below if you'd
                  rather not use it, or confirm with your clinician that it's fine as-is.
                </div>
              </div>
            );
          })()}

          {lastSess && (
            <div style={{ background: "#F7F7FA", borderRadius: 12, padding: "10px 12px", marginBottom: 12 }}>
              <div style={{ fontSize: 11.5, fontWeight: 700, color: C.sub, letterSpacing: 0.4 }}>
                LAST TIME · {shortDate(lastSess.date)}
              </div>
              {/* Requirement 3: the scannable one-liner first ("2 x 15 @
                  12.5 lb, then 2 x 15 @ 10 lb") — this is the thing meant
                  to be read at a glance mid-workout. The per-set S1/S2/S3
                  breakdown below stays for anyone who wants the detail. */}
              <div style={{ fontSize: 14, fontWeight: 700, marginTop: 4 }}>{formatSchemeSets(lastSess.sets)}</div>
              <div style={{ display: "flex", gap: 14, marginTop: 6, flexWrap: "wrap" }}>
                {lastSess.sets.map((s, i) => (
                  <div key={i} style={{ fontSize: 14 }}>
                    <span style={{ color: C.sub, fontSize: 11.5 }}>S{i + 1} </span>
                    <b>{s.w || "BW"}</b>
                    <span style={{ color: C.sub }}> × </span>
                    {/* A backoff/drop segment is deliberately at a different
                        (lower) rep target than ex.repMin — flagging it
                        orange here would mark correct execution of the
                        scheme as a shortfall. Only warn on the working
                        (top/straight) segments the target actually applies to. */}
                    <b style={{ color: (s.r < ex.repMin && s.segment !== "backoff" && s.segment !== "drop") ? C.orange : C.text }}>{s.r}</b>
                  </div>
                ))}
              </div>
              {rec.backoff && rec.backoff !== rec.weight && (
                <div style={{ fontSize: 12, color: C.blue, marginTop: 8, lineHeight: 1.4 }}>
                  Back-off option: {rec.weight} lb on set 1, then {rec.backoff} lb to keep every set in range.
                </div>
              )}
            </div>
          )}

          {ex.assistable && (
            <div style={{ marginBottom: 12 }}>
              <div style={{ display: "flex", gap: 6 }}>
                <button style={{ ...S.chip(assist), flex: 1 }} onClick={() => setAssist(true)}>Machine assist</button>
                <button style={{ ...S.chip(!assist), flex: 1 }} onClick={() => setAssist(false)}>Bodyweight / +weight</button>
              </div>
              {assist && (
                <div style={{ fontSize: 12.5, color: C.sub, marginTop: 8, lineHeight: 1.45 }}>
                  Enter the <b>assistance</b> the machine gives. It's logged as effective weight
                  (your bodyweight {Math.round(bw)} lb − assist), so the number climbs as you get stronger.
                </div>
              )}
            </div>
          )}

          {(sets || []).map((s, i) => (
            <div key={i} style={{ marginBottom: 8 }}>
              <div style={S.row}>
                <span style={{ width: 44, color: C.sub, fontSize: 13, fontWeight: 600 }}>Set {i + 1}</span>
                <input
                  style={S.input} type="number" inputMode="decimal"
                  placeholder={ex.assistable && assist ? "assist lbs" : "lbs"}
                  value={s.w} onChange={(e) => setSets(sets.map((x, j) => (j === i ? { ...x, w: e.target.value } : x)))}
                />
                <input
                  style={S.input} type="number" inputMode="numeric" placeholder="reps"
                  value={s.r} onChange={(e) => setSets(sets.map((x, j) => (j === i ? { ...x, r: e.target.value } : x)))}
                />
              </div>
              {hasNonTrivialScheme && (
                <div style={{ marginTop: 4, marginLeft: 54 }}>
                  <SegmentPicker value={s.segment || "top"} onChange={(seg) => setSets(sets.map((x, j) => (j === i ? { ...x, segment: seg } : x)))} />
                </div>
              )}
            </div>
          ))}

          {injuryProfile.recoveringMode && (
            <div style={{ ...S.row, marginTop: 4, marginBottom: 10 }}>
              <span style={{ fontSize: 12.5, color: C.sub }}>Pain during this session (0–10, optional)</span>
              <input
                style={{ ...S.input, width: 60 }} type="number" inputMode="numeric" min="0" max="10"
                placeholder="0" value={pain} onChange={(e) => setPain(e.target.value)}
              />
            </div>
          )}
          {ex.assistable && assist && (sets || []).some((s) => Number(s.w) > 0) && (
            <div style={{ fontSize: 12, color: C.blue, marginBottom: 4 }}>
              Will log: {(sets || []).filter((s) => Number(s.w) > 0 || Number(s.r) > 0).map((s, i) =>
                `${Math.max(1, Math.round(bw - (Number(s.w) || 0)))}×${Number(s.r) || 0}`).join("  ")} (effective lb)
            </div>
          )}

          <div style={{ ...S.row, marginTop: 4, flexWrap: "wrap", gap: 8 }}>
            {/* Point 4: an over-logged extra row defaults to the SAME
                segment and weight as the row above it, not "straight"/
                the top weight regardless of context — "one more like the
                last one" matches what a user adding an extra set mid-
                scheme almost always means. */}
            <button style={S.smallPill()} onClick={() => {
              const prior = sets && sets.length ? sets[sets.length - 1] : null;
              setSets([...(sets || []), { w: prior ? prior.w : (rec.weight === 0 ? "" : String(rec.weight)), r: "", segment: prior ? (prior.segment || "top") : "top" }]);
            }}>
              <Plus size={13} /> Add set
            </button>
            {!slot.isBonus && (
              <button style={S.smallPill(swapMode ? "#DCEBFF" : "#E9E9EB", swapMode ? C.blue : C.text)} onClick={() => setSwapMode(!swapMode)}>
                {swapMode ? <X size={13} /> : <Repeat size={13} />} {swapMode ? "Close" : "Swap"}
              </button>
            )}
            {timer === null ? (
              <button style={S.smallPill("#FFF1E5", C.orange)} onClick={() => setTimer(rest.sec)}>
                Start {rest.label} rest
              </button>
            ) : timer > 0 ? (
              <button style={S.smallPill("#FFF1E5", C.orange)} onClick={() => setTimer(null)}>
                Rest {mmss(timer)} · tap to skip
              </button>
            ) : (
              <button style={S.smallPill("#E8F8EE", C.green)} onClick={() => setTimer(null)}>
                Rest done — go
              </button>
            )}
          </div>

          {swapMode && (
            <div style={{ marginTop: 12, borderTop: `1px solid ${C.line}`, paddingTop: 12 }}>
              <div style={{ fontSize: 12, fontWeight: 700, color: C.sub, textTransform: "uppercase", letterSpacing: 0.4, marginBottom: 8 }}>
                {CAT_NAMES[slot.cat] || "Alternates"}
              </div>
              {/* Fix 3, point (a): flagged-but-selectable, not filtered out.
                  Filtering would hide the option and the reason together —
                  prevention here means surfacing the contraindication AT
                  selection time, not deciding for the user which exercises
                  they're allowed to see. Same gate2Injury call as the
                  reject path (see its comment); the button's onClick below
                  is untouched — nothing here blocks the click. */}
              {alternates.map((alt) => {
                const preview = recommend(
                  { ...alt, sets: slot.sets, repMin: slot.repMin, repMax: slot.repMax },
                  data.sessions
                );
                const altGate = gate2Injury({ exerciseId: alt.id }, { injuryProfile });
                const altNote = altGate.reject ? contraindicationSourceNote(alt, "short") : null;
                return (
                  <button
                    key={alt.id}
                    onClick={() => setSwap(alt.isOriginal ? null : alt.id)}
                    style={{
                      ...font, display: "flex", justifyContent: "space-between", alignItems: "center",
                      width: "100%", background: "#F7F7FA", border: `1px solid ${altGate.reject ? C.red : C.line}`,
                      borderRadius: 12, padding: "10px 12px", marginBottom: 8, cursor: "pointer", textAlign: "left",
                    }}
                  >
                    <div>
                      <div style={{ fontSize: 14, fontWeight: 600 }}>
                        {alt.isOriginal ? `Back to program: ${alt.name}` : alt.name}
                      </div>
                      {alt.why && (
                        <div style={{ fontSize: 12, color: C.sub, marginTop: 3, lineHeight: 1.4 }}>{alt.why}</div>
                      )}
                      {alt.caution && (
                        <div style={{ fontSize: 12, color: C.orange, marginTop: 3 }}>{alt.caution}</div>
                      )}
                      {altGate.reject && (
                        <div style={{ fontSize: 12, color: C.red, marginTop: 3, lineHeight: 1.4 }}>
                          ⚠ {altGate.reason}{altNote ? ` (${altNote})` : ""}
                        </div>
                      )}
                    </div>
                    <div style={{ color: C.blue, fontWeight: 700, fontSize: 13, whiteSpace: "nowrap", marginLeft: 8 }}>
                      {preview.weight === 0 ? "BW" : `${preview.weight} lb`}
                    </div>
                  </button>
                );
              })}
            </div>
          )}

          <button
            style={{ ...S.pillBtn(flash ? C.green : C.blue), width: "100%", marginTop: 12 }}
            onClick={saveSession}
          >
            {flash ? "Saved ✓" : "Save session"}
          </button>
        </div>
      )}
    </div>
  );
}

/* ============================ SYNC (Supabase cloud) ============================ */

function SyncCard({ data, sbUser, syncStatus, onSignedIn, onSignedOut }) {
  const cfg = getSbConfig();
  const [url, setUrl] = useState(cfg ? cfg.url : "");
  const [key, setKey] = useState(cfg ? cfg.key : "");
  const [email, setEmail] = useState("");
  const [pw, setPw] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const [showSetup, setShowSetup] = useState(!cfg);

  const saveConfig = () => {
    if (!url.trim() || !key.trim()) { setErr("Paste both the Project URL and the anon key."); return; }
    setSbConfig({ url: url.trim(), key: key.trim() });
    resetSbClient();
    setErr("");
    setShowSetup(false);
  };

  const authAction = async (mode) => {
    setErr(""); setBusy(true);
    const client = getSbClient();
    if (!client) { setErr("Save your Supabase settings first."); setBusy(false); return; }
    try {
      const fn = mode === "signup" ? "signUp" : "signInWithPassword";
      const { data: res, error } = await client.auth[fn]({ email: email.trim(), password: pw });
      if (error) throw error;
      const user = res && res.user;
      if (!user) throw new Error("No session returned. If you just signed up, disable email confirmation in Supabase (Authentication → Providers → Email).");
      await onSignedIn(user);
      setPw("");
    } catch (e) {
      setErr(e.message || "Auth failed.");
    }
    setBusy(false);
  };

  const signOut = async () => {
    const client = getSbClient();
    if (client) { try { await client.auth.signOut(); } catch (e) {} }
    onSignedOut();
  };

  const configured = !!getSbConfig();

  return (
    <div style={{ ...S.card, background: "#F0F7FF" }}>
      <div style={{ ...S.row, justifyContent: "space-between" }}>
        <span style={{ fontWeight: 700, fontSize: 15 }}>Cloud sync</span>
        {sbUser
          ? <span style={S.tag("#E8F8EE", C.green)}>Signed in</span>
          : configured ? <span style={S.tag("#FFF1E5", C.orange)}>Not signed in</span>
          : <span style={S.tag("#F0F0F3", C.sub)}>Not set up</span>}
      </div>

      {sbUser ? (
        <div style={{ marginTop: 8 }}>
          <div style={{ fontSize: 13, color: "#3A3A3C", lineHeight: 1.5 }}>
            Syncing as <b>{sbUser.email}</b>. Your logs back up automatically and load on any device you sign
            in from. {syncStatus && <span style={{ color: C.blue }}>· {syncStatus}</span>}
          </div>
          <button style={{ ...S.pillBtn("#E9E9EB", C.text), marginTop: 12 }} onClick={signOut}>Sign out</button>
        </div>
      ) : (
        <div style={{ marginTop: 8 }}>
          {!showSetup && configured ? null : (
            <>
              <div style={{ fontSize: 12.5, color: C.sub, lineHeight: 1.5, marginBottom: 10 }}>
                One-time setup: create a free Supabase project, then paste its <b>Project URL</b> and <b>anon
                public key</b> (Settings → API). Steps are in the chat.
              </div>
              <input style={{ ...S.input, marginBottom: 8 }} placeholder="Project URL (https://xxxx.supabase.co)"
                value={url} onChange={(e) => setUrl(e.target.value)} />
              <input style={{ ...S.input, marginBottom: 8 }} placeholder="anon public key (eyJ...)"
                value={key} onChange={(e) => setKey(e.target.value)} />
              <button style={{ ...S.pillBtn(), width: "100%" }} onClick={saveConfig}>Save settings</button>
            </>
          )}

          {configured && (
            <div style={{ marginTop: showSetup ? 14 : 0 }}>
              <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 8 }}>Sign in to sync</div>
              <input style={{ ...S.input, marginBottom: 8 }} type="email" autoCapitalize="none" placeholder="email"
                value={email} onChange={(e) => setEmail(e.target.value)} />
              <input style={{ ...S.input, marginBottom: 8 }} type="password" placeholder="password"
                value={pw} onChange={(e) => setPw(e.target.value)} />
              <div style={S.row}>
                <button style={{ ...S.pillBtn(), flex: 1 }} disabled={busy} onClick={() => authAction("login")}>Log in</button>
                <button style={{ ...S.pillBtn("#E9E9EB", C.text), flex: 1 }} disabled={busy} onClick={() => authAction("signup")}>Sign up</button>
              </div>
              <button style={{ ...S.smallPill("transparent", C.sub), marginTop: 8 }} onClick={() => { clearSbConfig(); resetSbClient(); setShowSetup(true); }}>
                Change Supabase settings
              </button>
              <div style={{ fontSize: 12, color: C.sub, marginTop: 8, lineHeight: 1.45 }}>
                First sign-in pushes your existing {data.sessions.length} log entries to the cloud — nothing is lost.
              </div>
            </div>
          )}
          {err && <div style={{ marginTop: 10, fontSize: 13, color: C.red, lineHeight: 1.4 }}>{err}</div>}
        </div>
      )}
    </div>
  );
}

/* ============================ BACKUP (export / import) ============================ */

function BackupCard({ data, persist }) {
  const [msg, setMsg] = useState("");
  const flash = (m) => { setMsg(m); setTimeout(() => setMsg(""), 3000); };

  const exportData = () => {
    try {
      const payload = JSON.stringify({ app: "recomp-coach", version: 8, exportedAt: new Date().toISOString(), data }, null, 2);
      const blob = new Blob([payload], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `recomp-coach-backup-${todayISO()}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      flash("Backup file created — save it to Files or iCloud.");
    } catch (e) {
      flash("Export failed on this device.");
    }
  };

  const importData = (ev) => {
    const file = ev.target.files && ev.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        const incoming = parsed && parsed.data ? parsed.data : parsed;
        if (!incoming || !Array.isArray(incoming.sessions)) throw new Error("bad file");
        // Same migration a fresh app boot would run against this same file —
        // see migrateInjuryAndGobletData's comment. `existing` (the app's
        // current in-memory data) is the fallback for bookkeeping fields the
        // file doesn't carry (history, an already-resolved goblet/boxsquat
        // decision) — it is never consulted for whether THIS file needs
        // migrating, so an old backup's fail-safe still fires even when the
        // live app already has some injuryProfile in memory.
        const migration = migrateInjuryAndGobletData(incoming, data);
        const merged = {
          ...data, ...incoming,
          sessions: migration.sessions,
          weights: incoming.weights || data.weights,
          swaps: incoming.swaps || data.swaps || {},
          nutrition: { ...(data.nutrition || {}), ...(incoming.nutrition || {}) },
          focus: { ...(data.focus || {}), ...(incoming.focus || {}) },
          plan: { ...(data.plan || {}), ...(incoming.plan || {}) },
          phase: incoming.phase || data.phase || {},
          injuryProfile: migration.injuryProfile,
          injuryProfileHistory: migration.injuryProfileHistory,
          injuryProfileMigration: migration.injuryProfileMigration,
          gobletBoxSquatMigration: migration.gobletBoxSquatMigration,
        };
        persist(merged);
        flash(`Restored ${merged.sessions.length} log entries and ${merged.weights.length} weigh-ins.`);
      } catch (e) {
        flash("Couldn't read that file — make sure it's a Recomp Coach backup.");
      }
    };
    reader.readAsText(file);
    ev.target.value = "";
  };

  return (
    <div style={{ ...S.card, background: "#F7F7FA" }}>
      <div style={{ fontWeight: 700, fontSize: 15 }}>Backup & restore</div>
      <div style={{ fontSize: 12.5, color: C.sub, marginTop: 4, lineHeight: 1.45 }}>
        Your logs live on this device only. <b>Export before any app update</b>, then Import after — that
        keeps every session safe across upgrades and new phones.
      </div>
      <div style={{ ...S.row, marginTop: 12 }}>
        <button style={{ ...S.pillBtn(), flex: 1 }} onClick={exportData}>Export backup</button>
        <label style={{ ...S.pillBtn("#E9E9EB", C.text), flex: 1, textAlign: "center", cursor: "pointer" }}>
          Import backup
          <input type="file" accept="application/json,.json" onChange={importData} style={{ display: "none" }} />
        </label>
      </div>
      <div style={{ fontSize: 12, color: C.sub, marginTop: 10, lineHeight: 1.4 }}>
        {data.sessions.length} log entries · {data.weights.length} weigh-ins currently stored.
      </div>
      {msg && (
        <div style={{ marginTop: 10, fontSize: 13, fontWeight: 600, color: C.green }}>{msg}</div>
      )}
    </div>
  );
}

/* ============================ INJURY PROFILE ============================ */

/* One-time, dismissible notice shown after the goalProfile.injuryRecovery ->
   injuryProfile.recoveringMode migration (see App's load effect). Whatever
   the migration did to effective behavior, the user is told about it once. */
function InjuryMigrationNotice({ data, persist }) {
  const notice = data.injuryProfileMigration;
  if (!notice || notice.dismissed) return null;
  const dismiss = () => persist({ ...data, injuryProfileMigration: { ...notice, dismissed: true } });
  return (
    <div style={{ ...S.card, background: "#EAF3FF", display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 10 }}>
      <div style={{ fontSize: 12.5, color: "#3A3A3C", lineHeight: 1.45 }}>{notice.message}</div>
      <button
        style={{ background: "transparent", border: "none", cursor: "pointer", color: C.sub, flexShrink: 0, padding: 0 }}
        onClick={dismiss} aria-label="Dismiss"
      >
        <X size={16} />
      </button>
    </div>
  );
}

/* One-time, resolvable prompt after the goblet/boxsquat split (Task 1 item
   1). Historical sessions logged under the old combined "goblet" id were
   defaulted to boxsquat (see App's load effect) — this asks rather than
   silently guessing, since the lift has real logged progress. "No" rewrites
   the migrated sessions back to goblet AND swaps the live program slot
   (data.swaps.boxsquat = "goblet") so future sessions log under the right
   id too, reusing the existing swap mechanism rather than new plumbing. */
function GobletBoxSquatMigrationPrompt({ data, persist }) {
  const migration = data.gobletBoxSquatMigration;
  if (!migration || migration.resolved) return null;

  const confirmBox = () => persist({ ...data, gobletBoxSquatMigration: { ...migration, resolved: true } });
  const correctToGoblet = () => {
    const sessions = data.sessions.map((s) => (s.exerciseId === "boxsquat" ? { ...s, exerciseId: "goblet" } : s));
    persist({
      ...data,
      sessions,
      swaps: { ...data.swaps, boxsquat: "goblet" },
      gobletBoxSquatMigration: { ...migration, resolved: true, defaultedTo: "goblet" },
    });
  };

  return (
    <div style={{ ...S.card, background: "#EAF3FF" }}>
      <div style={{ fontSize: 13, fontWeight: 700, color: C.blue }}>Which squat have you been doing?</div>
      <div style={{ fontSize: 12.5, color: "#3A3A3C", marginTop: 6, lineHeight: 1.45 }}>
        "Goblet / Box Squat" is now two separate exercises with different safety tags — self-limited
        (no box) vs. externally stopped (a box). Your logged history was assumed to be Box Squat so
        nothing else changes for now, but this needs your confirmation.
      </div>
      <div style={{ ...S.row, marginTop: 10, gap: 8 }}>
        <button style={{ ...S.pillBtn(), flex: 1 }} onClick={confirmBox}>Yes, Box Squat</button>
        <button style={{ ...S.pillBtn("#E9E9EB", C.text), flex: 1 }} onClick={correctToGoblet}>No, it was Goblet (no box)</button>
      </div>
    </div>
  );
}

/* Surfaces delayed-onset pain answers pending across ALL lifts (see
   findAllPendingPainRetros) — rendered once, at the top of the Workout tab,
   rather than gated on reopening any one specific exercise. */
function PendingPainRetroPrompts({ data, persist }) {
  const injuryProfile = data.injuryProfile || DEFAULT_INJURY_PROFILE;
  const pending = findAllPendingPainRetros(data.sessions, injuryProfile);
  const [values, setValues] = useState({});
  if (pending.length === 0) return null;

  const save = (session, value) => {
    const v = Math.max(0, Math.min(10, Number(value) || 0));
    const sessions = data.sessions.map((s) => (s.id === session.id ? { ...s, painRetro: v, painRetroAt: new Date().toISOString() } : s));
    persist({ ...data, sessions });
  };
  const dismiss = (session) => {
    const sessions = data.sessions.map((s) => (s.id === session.id ? { ...s, painRetroDismissed: true } : s));
    persist({ ...data, sessions });
  };

  return pending.map((s) => (
    <div key={s.id} style={{ ...S.card, background: "#FFF1E5" }}>
      <div style={{ fontSize: 13, fontWeight: 700, color: C.orange }}>
        Any pain in the 24h after your {shortDate(s.date)} {(EX_BY_ID[s.exerciseId] || {}).name || s.exerciseId} session?
      </div>
      <div style={{ ...S.row, marginTop: 8, flexWrap: "wrap" }}>
        <input
          style={{ ...S.input, width: 70 }} type="number" inputMode="numeric" min="0" max="10"
          placeholder="0–10" value={values[s.id] || ""} onChange={(e) => setValues({ ...values, [s.id]: e.target.value })}
        />
        <button style={S.smallPill()} onClick={() => save(s, 0)}>No pain</button>
        <button style={S.pillBtn(C.orange)} onClick={() => save(s, values[s.id])}>Save</button>
        <button style={{ background: "transparent", border: "none", cursor: "pointer", color: C.sub, fontSize: 12.5 }} onClick={() => dismiss(s)}>
          Skip
        </button>
      </div>
    </div>
  ));
}

/* Persistent, non-dismissable while clinicianReviewed is false. Rendered on
   the Workout tab and inside the Coach card — the two places a stale ROM
   limit would actually bite — while editing stays confined to the Log tab. */
function ClinicianReviewNotice({ compact }) {
  return (
    <div style={{ ...S.card, background: "#FFF1E5", display: "flex", gap: 10, alignItems: "flex-start", ...(compact ? { margin: "10px 0 0", padding: 12 } : {}) }}>
      <Flame size={18} color={C.orange} style={{ marginTop: 1, flexShrink: 0 }} />
      <div style={{ fontSize: 12.5, color: "#3A3A3C", lineHeight: 1.45 }}>
        <b style={{ color: C.orange }}>Not clinician-reviewed:</b> the depth and ROM limits in your
        injury profile were set in-app, not signed off by the clinician managing your injury.
        Treat them as a starting point, not medical clearance.
      </div>
    </div>
  );
}

/* Gate 5's persistent clinician-consult prompt. Non-dismissable by design —
   the spec is explicit that the app enforces rules, it does not assess
   whether an injury is worsening, so this doesn't go away until the
   underlying pattern (isPainEscalating) actually clears on its own
   (3 consecutive answered, at-or-below-threshold sessions — see
   isPainEscalating). Clearance is automatic but logged to
   injuryProfileHistory here, via a plain useEffect comparing this render's
   escalating set to the previous one — not inside isPainEscalating itself,
   which stays a pure, side-effect-free read. */
function PainEscalationNotice({ data, persist }) {
  const injuryProfile = data.injuryProfile || DEFAULT_INJURY_PROFILE;
  const threshold = (injuryProfile.movementConstraints && injuryProfile.movementConstraints.painRule && injuryProfile.movementConstraints.painRule.threshold) ?? 3;
  const patterns = PAIN_PATTERNS.filter((p) => isPainEscalating(data.sessions, p, threshold));
  const prevPatternsRef = useRef(patterns);

  useEffect(() => {
    const prev = prevPatternsRef.current;
    const cleared = prev.filter((p) => !patterns.includes(p));
    if (cleared.length > 0) {
      const at = new Date().toISOString();
      const entries = cleared.map((p) => ({ at, device: getDeviceId(), profile: null, note: `pain escalation cleared: ${PAIN_PATTERN_NAMES[p] || p}` }));
      persist({ ...data, injuryProfileHistory: [...(data.injuryProfileHistory || []), ...entries].slice(-50) });
    }
    prevPatternsRef.current = patterns;
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [patterns.join(",")]);

  if (patterns.length === 0) return null;
  return (
    <div style={{ ...S.card, background: "#FDECEC", display: "flex", gap: 10, alignItems: "flex-start" }}>
      <Flame size={18} color={C.red} style={{ marginTop: 1, flexShrink: 0 }} />
      <div style={{ fontSize: 12.5, color: "#3A3A3C", lineHeight: 1.45 }}>
        <b style={{ color: C.red }}>Consult your treating clinician:</b> pain above {threshold}/10 has recurred on
        the {patterns.map((p) => PAIN_PATTERN_NAMES[p] || p).join(", ")} pattern. No progression in load or sets is
        allowed on these movements until it clears — 3 consecutive logged sessions with answered pain at or below
        {" "}{threshold}/10 (a dismissed or unanswered session doesn't count either way). Grouped by mechanical
        loading pattern (Task 6) — a hip-flexion movement counts toward the same pattern whether it's a squat, a
        hinge, or a hip-loaded row, so this no longer misses a pattern that spans what used to be separate
        categories. This app enforces rules, it does not assess whether an injury is worsening.
      </div>
    </div>
  );
}

/* Task 2 commit 3, proposal Q5. dayKey values are template-namespaced
   (upperA/lowerA... vs ufUpperA/ufArms... vs shPush/shLower...), so
   switching templates already makes a stored prescription inert with zero
   extra code — resolveDayExercises just never finds a matching dayKey in
   the new template's day list. Retained, not deleted (manual template
   switches at 2335/4286-ish already spread ...plan untouched, and
   applyPasted's own wholesale-replace only happens on the NEXT paste-
   apply). What's missing without this notice is visibility: a
   prescription silently doing nothing looks identical to one that was
   never gated at all. Purely informational, no persist — nothing here
   needs to write anything, it just names what's inert and why. */
function StalePrescriptionsNotice({ data }) {
  const prescriptions = (data.plan && data.plan.prescriptions) || [];
  if (!prescriptions.length) return null;
  const currentDayIds = new Set(getProgram(data).map((d) => d.id));
  const stale = prescriptions.filter((p) => !currentDayIds.has(p.dayKey));
  if (!stale.length) return null;
  const names = [...new Set(stale.map((p) => (EX_BY_ID[p.exerciseId] || {}).name || p.exerciseId))];
  return (
    <div style={{ ...S.card, background: "#F7F7FA", display: "flex", gap: 10, alignItems: "flex-start" }}>
      <ClipboardList size={18} color={C.sub} style={{ marginTop: 1, flexShrink: 0 }} />
      <div style={{ fontSize: 12.5, color: "#3A3A3C", lineHeight: 1.45 }}>
        <b>{stale.length} prescription{stale.length !== 1 ? "s" : ""} not applying:</b> {names.join(", ")} — from a
        coach plan applied under a different template. They're kept, not deleted, but the day{stale.length !== 1 ? "s" : ""} they
        named don't exist in your current template. Switch back to apply them, or paste a new plan for this one.
      </div>
    </div>
  );
}

/* The only place injuryProfile is ever written. `save` is a plain closure
   variable, never assigned to a module-level binding — the plan parser and
   gate pipeline (extractPlanJson, applyCoachGates, and Task 4's gate runner)
   only ever receive `data` as a read-only prop, so there is no shared
   reference they could call even if a pasted plan tried to smuggle one in. */
function InjuryProfileCard({ data, persist }) {
  const profile = data.injuryProfile || DEFAULT_INJURY_PROFILE;
  const [open, setOpen] = useState(false);
  const [showHistory, setShowHistory] = useState(false);

  const save = (next) => {
    const stamped = { ...cloneInjuryProfileDefaults(), ...next };
    const historyEntry = { at: new Date().toISOString(), device: getDeviceId(), profile: stamped };
    persist({
      ...data,
      injuryProfile: stamped,
      injuryProfileHistory: [...(data.injuryProfileHistory || []), historyEntry].slice(-50),
    });
  };

  const toggleRecovering = () => save({ ...profile, recoveringMode: !profile.recoveringMode });
  const toggleClinicianReviewed = () => save({
    ...profile,
    clinicianReviewed: !profile.clinicianReviewed,
    lastReviewDate: !profile.clinicianReviewed ? todayISO() : profile.lastReviewDate,
  });
  const updateInjury = (idx, patch) => save({ ...profile, injuries: profile.injuries.map((inj, i) => (i === idx ? { ...inj, ...patch } : inj)) });
  const removeInjury = (idx) => save({ ...profile, injuries: profile.injuries.filter((_, i) => i !== idx) });
  // Defaults to the first vocabulary entry not already in use — keeps new
  // injuries inside the closed set that contraindications can actually
  // match, rather than a free-typed id nothing is tagged against.
  const addInjury = () => {
    const used = new Set(profile.injuries.map((i) => i.id));
    const nextVocabId = Object.keys(INJURY_VOCABULARY).find((id) => !used.has(id));
    const id = nextVocabId || `custom_${Date.now()}`;
    save({
      ...profile,
      injuries: [...profile.injuries, { id, label: INJURY_VOCABULARY[id] || "", side: null, status: "recovering", since: null }],
    });
  };
  // A select changes id AND label together, keeping them in lock-step with
  // the vocabulary; "Other" keeps a free-typed label but a non-colliding
  // custom id, visibly unmatched against any exercise's contraindications.
  const setInjuryVocab = (idx, val) => {
    if (val === "__other__") {
      const inj = profile.injuries[idx];
      updateInjury(idx, { id: INJURY_VOCABULARY[inj.id] ? `custom_${Date.now()}` : inj.id });
    } else {
      updateInjury(idx, { id: val, label: INJURY_VOCABULARY[val] });
    }
  };

  const history = [...(data.injuryProfileHistory || [])].sort((a, b) => (a.at < b.at ? 1 : -1)).slice(0, 8);
  const mc = profile.movementConstraints || DEFAULT_INJURY_PROFILE.movementConstraints;
  const reportingGaps = painReportingGaps(data.sessions, profile);
  const unknownIds = unknownInjuryIds(profile);
  const contraindicated = contraindicatedInActiveProgram(data);

  return (
    <div style={{ ...S.card, background: "#F7F7FA" }}>
      <button
        onClick={() => setOpen(!open)}
        style={{ ...font, display: "flex", justifyContent: "space-between", alignItems: "center", width: "100%", background: "transparent", border: "none", cursor: "pointer", textAlign: "left", padding: 0 }}
      >
        <div>
          <div style={{ fontWeight: 700, fontSize: 15 }}>Injury profile</div>
          <div style={{ fontSize: 12.5, color: C.sub, marginTop: 2 }}>
            {profile.recoveringMode ? "Recovering — movement gates active" : "Not in injury recovery"}
          </div>
        </div>
        <ChevronRight size={18} color={C.sub} style={{ transform: open ? "rotate(90deg)" : "none" }} />
      </button>

      {!profile.clinicianReviewed && <ClinicianReviewNotice compact />}

      {open && (
        <div style={{ marginTop: 14, borderTop: `1px solid ${C.line}`, paddingTop: 14 }}>
          <div style={{ ...S.row, justifyContent: "space-between" }}>
            <div style={{ fontSize: 14, fontWeight: 600 }}>Recovering from injury</div>
            <button style={S.smallPill(profile.recoveringMode ? "#FFF1E5" : "#E9E9EB", profile.recoveringMode ? C.orange : C.text)} onClick={toggleRecovering}>
              {profile.recoveringMode ? "ON — gates active" : "OFF"}
            </button>
          </div>
          <div style={{ fontSize: 12, color: C.sub, marginTop: 6, lineHeight: 1.4 }}>
            Manual only — this never auto-lifts on a week counter. The separate specialization-timing
            rule (template locks to Balanced under 8 logged weeks) still applies on its own schedule
            regardless of this switch.
          </div>

          <div style={{ ...S.row, justifyContent: "space-between", marginTop: 16 }}>
            <div style={{ fontSize: 14, fontWeight: 600 }}>Clinician-reviewed</div>
            <button style={S.smallPill(profile.clinicianReviewed ? "#E8F8EE" : "#E9E9EB", profile.clinicianReviewed ? C.green : C.text)} onClick={toggleClinicianReviewed}>
              {profile.clinicianReviewed ? `Confirmed${profile.lastReviewDate ? " " + shortDate(profile.lastReviewDate) : ""}` : "Not yet"}
            </button>
          </div>

          <div style={{ fontSize: 12, fontWeight: 700, color: C.sub, textTransform: "uppercase", letterSpacing: 0.4, marginTop: 18, marginBottom: 8 }}>
            Injuries
          </div>
          {unknownIds.length > 0 && (
            <div style={{ background: "#FFF1E5", borderRadius: 12, padding: "10px 12px", marginBottom: 8 }}>
              <div style={{ fontSize: 12.5, fontWeight: 700, color: C.orange }}>Unrecognized injury id</div>
              <div style={{ fontSize: 12, color: "#3A3A3C", marginTop: 4, lineHeight: 1.4 }}>
                {unknownIds.map((inj) => inj.label || inj.id).join(", ")} — not in the known vocabulary, so no
                exercise's contraindications can currently match it. Re-pick from the list below, or leave as
                "Other" if it's genuinely new (nothing is tagged against it yet).
              </div>
            </div>
          )}
          {profile.injuries.map((inj, i) => (
            <div key={inj.id || i} style={{ background: "#FFF", border: `1px solid ${C.line}`, borderRadius: 12, padding: 10, marginBottom: 8 }}>
              <select
                style={{ ...S.input, marginBottom: 6 }}
                value={INJURY_VOCABULARY[inj.id] ? inj.id : "__other__"}
                onChange={(e) => setInjuryVocab(i, e.target.value)}
              >
                {Object.entries(INJURY_VOCABULARY).map(([id, label]) => (
                  <option key={id} value={id}>{label}</option>
                ))}
                <option value="__other__">Other (not yet tagged in the library)</option>
              </select>
              {!INJURY_VOCABULARY[inj.id] && (
                <input
                  style={{ ...S.input, marginBottom: 6 }} placeholder="Describe the injury"
                  value={inj.label || ""} onChange={(e) => updateInjury(i, { label: e.target.value })}
                />
              )}
              <div style={{ ...S.row, gap: 6 }}>
                <select style={{ ...S.input, flex: 1 }} value={inj.side || ""} onChange={(e) => updateInjury(i, { side: e.target.value || null })}>
                  <option value="">No side</option>
                  <option value="left">Left</option>
                  <option value="right">Right</option>
                  <option value="bilateral">Bilateral</option>
                </select>
                <select style={{ ...S.input, flex: 1 }} value={inj.status || "recovering"} onChange={(e) => updateInjury(i, { status: e.target.value })}>
                  <option value="recovering">Recovering</option>
                  <option value="resolved">Resolved</option>
                  <option value="chronic">Chronic</option>
                </select>
              </div>
              <div style={{ ...S.row, marginTop: 6, justifyContent: "space-between" }}>
                <input
                  style={{ ...S.input, flex: 1, marginRight: 8 }} type="month" placeholder="Since"
                  value={inj.since || ""} onChange={(e) => updateInjury(i, { since: e.target.value || null })}
                />
                <button style={{ background: "transparent", border: "none", cursor: "pointer", color: C.red }} onClick={() => removeInjury(i)} aria-label="Remove injury">
                  <Trash2 size={16} />
                </button>
              </div>
            </div>
          ))}
          <button style={S.smallPill()} onClick={addInjury}><Plus size={13} /> Add injury</button>

          {reportingGaps.length > 0 && (
            <div style={{ background: "#FFF1E5", borderRadius: 12, padding: "10px 12px", marginTop: 12 }}>
              <div style={{ fontSize: 12.5, fontWeight: 700, color: C.orange }}>Pain reporting gap</div>
              <div style={{ fontSize: 12, color: "#3A3A3C", marginTop: 4, lineHeight: 1.4 }}>
                {reportingGaps.map((g) => `${(EX_BY_ID[g.exerciseId] || {}).name || g.exerciseId} (${g.streak} skipped in a row)`).join(", ")}
                {" "}— skipped, not confirmed pain-free. Answer next time it comes up if you can.
              </div>
            </div>
          )}

          <div style={{ fontSize: 12, fontWeight: 700, color: C.sub, textTransform: "uppercase", letterSpacing: 0.4, marginTop: 18, marginBottom: 8 }}>
            Movement constraints
          </div>
          <div style={{ fontSize: 12.5, color: "#3A3A3C", lineHeight: 1.6 }}>
            <div><b>Forbidden:</b> {mc.forbidden.join(", ") || "none"}</div>
            <div style={{ marginTop: 4 }}><b>Limited:</b> {mc.limited.map((l) => `${l.attribute} ≤ ${l.maxValue}`).join("; ") || "none"}</div>
            <div style={{ marginTop: 4 }}>
              <b>Pain rule:</b> pain &gt;{mc.painRule.threshold}/10{mc.painRule.window24h ? " (during or within 24h)" : ""} → reduce load {mc.painRule.value}%
            </div>
            <div style={{ marginTop: 8, fontStyle: "italic" }}>
              Direct editing of these lands with Task 1's movement-attribute vocabulary — for now
              they're set to the values Gate 2 (Task 4) will enforce.
            </div>
          </div>

          {/* Fix 3, point (d): reviewable in one place, rather than only
              discoverable by opening each day's cards one at a time.
              Read-only — see contraindicatedInActiveProgram's comment;
              nothing here removes or changes anything (point c). */}
          {contraindicated.length > 0 && (
            <div style={{ marginTop: 18 }}>
              <div style={{ fontSize: 12, fontWeight: 700, color: C.sub, textTransform: "uppercase", letterSpacing: 0.4, marginBottom: 8 }}>
                Contraindicated in your current program
              </div>
              {contraindicated.map(({ ex, reason, sourceNote }) => (
                <div key={ex.id} style={{ background: "#FDECEC", borderRadius: 12, padding: "10px 12px", marginBottom: 8 }}>
                  <div style={{ fontSize: 12.5, fontWeight: 700, color: C.red }}>{ex.name}</div>
                  <div style={{ fontSize: 12, color: "#3A3A3C", marginTop: 4, lineHeight: 1.4 }}>
                    {reason}{sourceNote ? ` This flag is ${sourceNote}.` : ""}
                  </div>
                </div>
              ))}
              <div style={{ fontSize: 11.5, color: C.sub, marginTop: 4, lineHeight: 1.4 }}>
                Nothing here is swapped out automatically. Review and change it from its own card on the
                Workout tab if you want to.
              </div>
            </div>
          )}

          {history.length > 0 && (
            <div style={{ marginTop: 16 }}>
              <button style={S.smallPill()} onClick={() => setShowHistory(!showHistory)}>
                {showHistory ? "Hide" : "Show"} change history ({history.length})
              </button>
              {showHistory && (
                <div style={{ marginTop: 8 }}>
                  {history.map((h, i) => (
                    <div key={i} style={{ fontSize: 11.5, color: C.sub, padding: "4px 0", borderBottom: i < history.length - 1 ? `1px solid ${C.line}` : "none" }}>
                      {new Date(h.at).toLocaleString()} · {h.device}
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

/* Task 1 requirement: a Settings view listing untagged exercises, so
   deny-by-default's real guarantee (coverage is total, not "mostly") stays
   visible and the library can be completed incrementally as new
   alternates are added. */
function TaggingCoverageCard() {
  const gaps = exerciseTaggingGaps();
  const conservative = conservativeDefaultExercises();
  const total = ALL_KNOWN.length;
  return (
    <div style={{ ...S.card, background: "#F7F7FA" }}>
      <div style={{ ...S.row, justifyContent: "space-between" }}>
        <div style={{ fontWeight: 700, fontSize: 15 }}>Exercise tagging coverage</div>
        <span style={S.tag(gaps.length === 0 ? "#E8F8EE" : "#FFF1E5", gaps.length === 0 ? C.green : C.orange)}>
          {total - gaps.length}/{total} tagged
        </span>
      </div>
      <div style={{ fontSize: 12, color: C.sub, marginTop: 6, lineHeight: 1.4 }}>
        {gaps.length === 0
          ? "Every exercise in the library has complete movement-attribute tags. While recovering, an untagged exercise would be denied by default — untagged means unknown, and unknown near a labral tear means no."
          : `${gaps.length} exercise${gaps.length > 1 ? "s" : ""} still missing tags — denied by default while recovering:`}
      </div>
      {gaps.length > 0 && (
        <div style={{ marginTop: 8 }}>
          {gaps.map((ex) => (
            <div key={ex.id} style={{ fontSize: 12.5, color: "#3A3A3C", padding: "4px 0", borderBottom: `1px solid ${C.line}` }}>
              {ex.name}
            </div>
          ))}
        </div>
      )}
      {conservative.length > 0 && (
        <div style={{ marginTop: 10, paddingTop: 10, borderTop: `1px solid ${C.line}` }}>
          <div style={{ fontSize: 12, fontWeight: 700, color: C.orange }}>
            {conservative.length} tagged on an unverified conservative default, not a fact
          </div>
          <div style={{ fontSize: 12, color: C.sub, marginTop: 4, lineHeight: 1.4 }}>
            "Tagged" isn't the same as "verified" — these had no existing in-app or clinical
            signal either way, so the more-restrictive value was used rather than a guess at safe:{" "}
            {conservative.map((ex) => ex.name).join(", ")}.
          </div>
        </div>
      )}
    </div>
  );
}

function Log({ data, persist, loaded, sbUser, syncStatus, onSignedIn, onSignedOut }) {
  // Point 6: routed through resolveDayExercises (was a hand-rolled
  // resolveSlot-only map) so this form sees the same picture the in-day
  // flow does — bonus lifts, prescription reconciliation, and any active
  // scheme all included, not bypassed. Without this, "the same treatment"
  // for schemes would have nothing to key off: a bare resolveSlot result
  // never carries .scheme at all.
  const resolvedProgram = getProgram(data).map((d) => ({
    ...d,
    exercises: resolveDayExercises(d, data).map((e) => e.ex),
  }));
  const exerciseById = (id) => resolvedProgram.flatMap((d) => d.exercises).find((e) => e.id === id) || EX_BY_ID[id] || { id, sets: 3 };
  // Blank-slate rows (weight:0 forces buildSegmentRows' bodyweight guard,
  // which blanks every segment's weight) — this form has never
  // auto-filled a recommended weight the way ExerciseCard does, only the
  // SEGMENT sequence and row count are worth seeding here.
  const blankRowsFor = (id) => buildSegmentRows(exerciseById(id), { weight: 0 });

  const [exId, setExId] = useState(resolvedProgram[0].exercises[0].id);
  const [sets, setSets] = useState(() => blankRowsFor(resolvedProgram[0].exercises[0].id));
  const [bw, setBw] = useState("");
  const [savedFlash, setSavedFlash] = useState("");
  const [pain, setPain] = useState("");
  const injuryProfile = data.injuryProfile || DEFAULT_INJURY_PROFILE;
  const selectedEx = exerciseById(exId);
  const hasNonTrivialScheme = selectedEx.scheme && selectedEx.scheme.type !== "straight";

  const flash = (msg) => { setSavedFlash(msg); setTimeout(() => setSavedFlash(""), 2000); };

  const saveSession = () => {
    // Point 2: segment rides through to the stored row here too.
    const clean = sets
      .map((s) => ({ w: Number(s.w) || 0, r: Number(s.r) || 0, segment: s.segment || "top" }))
      .filter((s) => s.r > 0);
    if (clean.length === 0) return;
    // Delayed-onset pain (painRetro) is asked for separately, across all lifts —
    // see findAllPendingPainRetros / PendingPainRetroPrompts, rendered on the
    // Workout tab.
    const session = {
      id: Date.now(), date: todayISO(), exerciseId: exId, sets: clean,
      pain: pain === "" ? null : Math.max(0, Math.min(10, Number(pain) || 0)),
      painRetro: null, painRetroAt: null, painRetroDismissed: false,
    };
    persist({ ...data, sessions: [...data.sessions, session] });
    setSets(blankRowsFor(exId));
    setPain("");
    flash("Session saved");
  };

  const saveWeight = () => {
    const lbs = Number(bw);
    if (!lbs) return;
    const weights = data.weights.filter((x) => x.date !== todayISO());
    persist({ ...data, weights: [...weights, { date: todayISO(), lbs }] });
    setBw("");
    flash("Body weight saved");
  };

  const deleteSession = (id) => {
    persist({ ...data, sessions: data.sessions.filter((s) => s.id !== id) });
  };

  const recent = [...data.sessions].sort((a, b) => b.id - a.id).slice(0, 6);
  const loggedIds = new Set(data.sessions.map((s) => s.exerciseId));
  const programIds = new Set(resolvedProgram.flatMap((d) => d.exercises.map((e) => e.id)));
  const extraLogged = ALL_KNOWN.filter((e) => loggedIds.has(e.id) && !programIds.has(e.id));

  return (
    <div>
      <header style={S.header}>
        <h1 style={S.h1}>Log</h1>
        <div style={S.sub}>{loaded ? "Everything you enter is saved automatically." : "Loading…"}</div>
      </header>

      {savedFlash && (
        <div style={{ ...S.card, background: "#E8F8EE", color: C.green, fontWeight: 700, fontSize: 14, textAlign: "center" }}>
          {savedFlash}
        </div>
      )}

      <div style={S.card}>
        <div style={{ ...S.row, marginBottom: 10 }}>
          <Scale size={18} color={C.blue} />
          <span style={{ fontWeight: 700, fontSize: 15 }}>Body weight</span>
        </div>
        <div style={S.row}>
          <input
            style={S.input} type="number" inputMode="decimal" placeholder="lbs (e.g., 146.2)"
            value={bw} onChange={(e) => setBw(e.target.value)}
          />
          <button style={S.pillBtn()} onClick={saveWeight}>Save</button>
        </div>
      </div>

      <div style={S.card}>
        <div style={{ fontWeight: 700, fontSize: 15, marginBottom: 10 }}>Log a lift</div>
        <select
          style={{ ...S.input, appearance: "none", marginBottom: 12 }}
          value={exId} onChange={(e) => { const id = e.target.value; setExId(id); setSets(blankRowsFor(id)); }}
        >
          {resolvedProgram.map((d) => (
            <optgroup key={d.id} label={d.name}>
              {d.exercises.map((ex) => (
                <option key={ex.slotId} value={ex.id}>{ex.name}</option>
              ))}
            </optgroup>
          ))}
          {extraLogged.length > 0 && (
            <optgroup label="Previously logged">
              {extraLogged.map((ex) => (
                <option key={ex.id} value={ex.id}>{ex.name}</option>
              ))}
            </optgroup>
          )}
        </select>

        {sets.map((s, i) => (
          <div key={i} style={{ marginBottom: 8 }}>
            <div style={S.row}>
